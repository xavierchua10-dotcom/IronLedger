<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Grant Pro — Admin</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f24; --panel-2:#242830; --line:#2e333b;
    --text:#e9e6df; --text-dim:#8b9098; --text-faint:#5c6169;
    --accent:#f2b134; --accent-dim:#7a6224; --accent-2:#c1443c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card{
    width:100%; max-width:380px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:24px;
  }
  h1{font-size:18px; margin:0 0 4px; font-weight:700;}
  .sub{font-size:12.5px; color:var(--text-dim); margin:0 0 20px; line-height:1.4;}
  label{display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input, select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 12px; font-size:14px; font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  button{
    width:100%; margin-top:18px; background:var(--accent); color:#1c1500; border:none;
    border-radius:8px; padding:12px; font-size:14px; font-weight:700; cursor:pointer;
  }
  button:disabled{opacity:0.5; cursor:default;}
  button:active:not(:disabled){background:var(--accent-dim); color:var(--text);}
  .btn-secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  .msg{font-size:12.5px; margin-top:14px; padding:10px 12px; border-radius:8px; line-height:1.4;}
  .msg-error{background:rgba(193,68,60,0.15); color:#e8908a; border:1px solid var(--accent-2);}
  .msg-success{background:rgba(242,177,52,0.12); color:var(--accent); border:1px solid var(--accent-dim);}
  .hidden{display:none !important;}
  .signed-in-as{font-size:11px; color:var(--text-faint); margin-top:16px; text-align:center;}
  .custom-days-row{display:none;}
  .custom-days-row.show{display:block;}
</style>
</head>
<body>

<!-- Sign-in screen -->
<div class="card" id="loginCard">
  <h1>Admin sign-in</h1>
  <p class="sub">Log in with your own account to continue.</p>
  <label for="loginEmail">Email</label>
  <input id="loginEmail" type="email" autocomplete="username">
  <label for="loginPassword">Password</label>
  <input id="loginPassword" type="password" autocomplete="current-password">
  <button id="loginBtn">Sign in</button>
  <button class="btn-secondary" id="googleBtn">Sign in with Google</button>
  <div class="msg msg-error hidden" id="loginError"></div>
</div>

<!-- Not authorized screen -->
<div class="card hidden" id="deniedCard">
  <h1>Not authorized</h1>
  <p class="sub">This account doesn't have access to this page.</p>
  <button class="btn-secondary" id="signOutBtn">Sign out</button>
</div>

<!-- Grant form -->
<div class="card hidden" id="formCard">
  <h1>Grant Pro</h1>
  <p class="sub">Manually unlocks Pro for a client when a Stripe payment didn't sync automatically.</p>

  <label for="clientEmail">Client's account email</label>
  <input id="clientEmail" type="email" placeholder="client@example.com">

  <label for="planSelect">Plan</label>
  <select id="planSelect">
    <option value="quarterly">Quarterly (90 days)</option>
    <option value="monthly" selected>Monthly (30 days)</option>
    <option value="annual">Annual (365 days)</option>
    <option value="custom">Custom</option>
  </select>

  <div class="custom-days-row" id="customDaysRow">
    <label for="customDays">Days</label>
    <input id="customDays" type="number" min="1" placeholder="e.g. 14">
  </div>

  <button id="grantBtn">Grant Pro</button>
  <div class="msg hidden" id="resultMsg"></div>

  <div class="signed-in-as" id="signedInAs"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFunctions, httpsCallable
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";

  // Same public config already visible in index.html's own source —
  // safe to reuse, it's not a secret (the real gate is server-side,
  // see the grantPro Cloud Function).
  const firebaseConfig = {
    apiKey: "AIzaSyA5zTxIK6Yn81BZ03_rlUUgWjGBkbtL2Wo",
    authDomain: "iron-ledge.firebaseapp.com",
    projectId: "iron-ledge",
    storageBucket: "iron-ledge.firebasestorage.app",
    messagingSenderId: "978680753798",
    appId: "1:978680753798:web:13fdbdb6b4bd3dbc72ab07"
  };

  // Client-side check only, for a clean "not authorized" screen instead
  // of a confusing error. NOT the real security boundary — that's the
  // server-side check inside the grantPro Cloud Function, which can't
  // be bypassed by editing this page's JS.
  const ADMIN_EMAIL = 'xavierchua10@gmail.com';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
  const functions = getFunctions(app);
  // httpsCallable attaches and the platform verifies the caller's own
  // ID token automatically — no manual getIdToken()/Authorization
  // header needed here anymore.
  const grantProFn = httpsCallable(functions, 'grantPro');

  const loginCard = document.getElementById('loginCard');
  const deniedCard = document.getElementById('deniedCard');
  const formCard = document.getElementById('formCard');
  const loginError = document.getElementById('loginError');
  const resultMsg = document.getElementById('resultMsg');

  function showError(el, text){
    el.textContent = text;
    el.classList.remove('hidden', 'msg-success');
    el.classList.add('msg-error');
  }
  function showSuccess(el, text){
    el.textContent = text;
    el.classList.remove('hidden', 'msg-error');
    el.classList.add('msg-success');
  }

  onAuthStateChanged(auth, function(user){
    loginCard.classList.add('hidden');
    deniedCard.classList.add('hidden');
    formCard.classList.add('hidden');

    if (!user){
      loginCard.classList.remove('hidden');
      return;
    }
    if ((user.email || '').toLowerCase() !== ADMIN_EMAIL){
      deniedCard.classList.remove('hidden');
      return;
    }
    formCard.classList.remove('hidden');
    document.getElementById('signedInAs').textContent = 'Signed in as ' + user.email;
  });

  document.getElementById('loginBtn').addEventListener('click', function(){
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    loginError.classList.add('hidden');
    signInWithEmailAndPassword(auth, email, password).catch(function(err){
      showError(loginError, err.message || 'Sign-in failed');
    });
  });

  document.getElementById('googleBtn').addEventListener('click', function(){
    loginError.classList.add('hidden');
    signInWithPopup(auth, googleProvider).catch(function(err){
      showError(loginError, err.message || 'Sign-in failed');
    });
  });

  document.getElementById('signOutBtn').addEventListener('click', function(){
    signOut(auth);
  });

  document.getElementById('planSelect').addEventListener('change', function(e){
    document.getElementById('customDaysRow').classList.toggle('show', e.target.value === 'custom');
  });

  document.getElementById('grantBtn').addEventListener('click', function(){
    var btn = document.getElementById('grantBtn');
    var clientEmail = document.getElementById('clientEmail').value.trim();
    var plan = document.getElementById('planSelect').value;
    var customDays = document.getElementById('customDays').value;

    resultMsg.classList.add('hidden');

    if (!clientEmail){
      showError(resultMsg, 'Enter the client\u2019s account email.');
      return;
    }
    if (plan === 'custom' && !customDays){
      showError(resultMsg, 'Enter a number of days for the custom plan.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Granting\u2026';

    grantProFn({
      email: clientEmail,
      plan: plan === 'custom' ? null : plan,
      customDays: plan === 'custom' ? customDays : null
    }).then(function(result){
      btn.disabled = false;
      btn.textContent = 'Grant Pro';
      var data = result.data;
      var endDate = new Date(data.currentPeriodEnd).toLocaleDateString();
      showSuccess(resultMsg, 'Pro granted for ' + data.email + ' \u2014 ' + data.daysGranted + ' days, until ' + endDate + '.');
      document.getElementById('clientEmail').value = '';
      document.getElementById('customDays').value = '';
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = 'Grant Pro';
      showError(resultMsg, (err && err.message) || 'Something went wrong.');
      console.error('Grant Pro request failed:', err);
    });
  });
</script>
</body>
</html>
