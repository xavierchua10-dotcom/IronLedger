<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Dash 30</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url('../fonts/inter-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url('../fonts/inter-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url('../fonts/inter-latin-700-normal.woff2') format('woff2');}
</style>
<style>
:root{--bg:#0b0b1e;--ink:#f4f1ff;--muted:#a79fd6;--cy:#22e5ff;--gold:#ffc83d;--pink:#ff3d8b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
.hud div{font-size:14px;color:var(--muted)}
.hud b{display:block;font-size:40px;font-weight:800;line-height:1;color:var(--ink)}
#time.low{color:var(--pink)}
#score{color:var(--gold)}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 90px);text-align:center;font-size:18px;font-weight:800;color:var(--pink);opacity:0;transition:opacity .15s;pointer-events:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,11,30,.6);cursor:pointer}
#overlay.hide{display:none}
.card{text-align:center;padding:0 28px;max-width:320px}
.card h1{margin:0 0 10px;font-size:46px;font-weight:800;color:var(--cy);line-height:1}
.card p{margin:0 0 22px;color:var(--muted);font-size:17px;line-height:1.45}
.card p i{font-style:normal;color:var(--gold)}.card p u{text-decoration:none;color:var(--pink)}
.go{display:inline-block;background:var(--cy);color:#04222a;border-radius:14px;padding:14px 34px;font-size:20px;font-weight:800}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div>Time<b id="time">30</b></div><div style="text-align:right">Orbs<b id="score">0</b></div></div>
<div id="msg">−2 seconds</div>
<div id="overlay" tabindex="0"><div class="card"><h1 id="t">Neon Dash</h1><p id="m">30 seconds. Drag or use ← → to steer. Grab the <i>gold orbs</i>, dodge the <u>pink blocks</u>.</p><span class="go" id="go">Tap to start</span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function sfReport(game,data){try{data.sfGame=game;window.parent.postMessage(data,location.origin)}catch(e){}}
if(typeof THREE==='undefined'){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p style="color:#aeb3bd;font:16px Inter,sans-serif;text-align:center;margin-top:30vh;padding:0 24px">Couldn\u2019t load the 3D engine. Check your connection and try again.</p>'});}
</script>
<script>
(function(){if(typeof THREE==='undefined')return;
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
window.__sfDispose=function(){try{window.requestAnimationFrame=function(){return 0};renderer.dispose();renderer.forceContextLoss();}catch(_){}};addEventListener('pagehide',window.__sfDispose);
var scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0b1e);scene.fog=new THREE.Fog(0x0b0b1e,25,85);
var cam=new THREE.PerspectiveCamera(65,1,0.1,150);cam.position.set(0,3.4,8);
scene.add(new THREE.HemisphereLight(0xb9a8ff,0x1a1040,0.9));
var key=new THREE.PointLight(0x22e5ff,1.2,30);scene.add(key);

// floor
var cv=document.createElement('canvas');cv.width=cv.height=128;var g=cv.getContext('2d');
g.fillStyle='#10103a';g.fillRect(0,0,128,128);g.strokeStyle='#6a3dff';g.lineWidth=5;g.strokeRect(0,0,128,128);
var ft=new THREE.CanvasTexture(cv);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(10,60);
var floor=new THREE.Mesh(new THREE.PlaneGeometry(20,120),new THREE.MeshBasicMaterial({map:ft}));
floor.rotation.x=-Math.PI/2;floor.position.z=-50;scene.add(floor);

// ship
var ship=new THREE.Mesh(new THREE.ConeGeometry(0.7,2,4),new THREE.MeshStandardMaterial({color:0x22e5ff,emissive:0x0a5b69,flatShading:true}));
ship.rotation.x=-Math.PI/2;ship.position.y=0.7;scene.add(ship);

var orbGeo=new THREE.IcosahedronGeometry(0.6,0),orbMat=new THREE.MeshBasicMaterial({color:0xffc83d});
var blkGeo=new THREE.BoxGeometry(1.8,1.8,1.8),blkMat=new THREE.MeshStandardMaterial({color:0xff3d8b,emissive:0x7a0f3f,flatShading:true});
var items=[],X=6;
var state='ready',time,score,tx=0,elapsed,spawn,shake=0,best=0;
try{best=+localStorage.getItem('neondash-best')||0}catch(e){}
var $time=document.getElementById('time'),$score=document.getElementById('score'),$msg=document.getElementById('msg');

function start(){
  items.forEach(function(o){scene.remove(o.m)});items=[];
  time=30;score=0;elapsed=0;spawn=0;tx=0;ship.position.x=0;
  $score.textContent=0;$time.textContent=30;$time.classList.remove('low');
  state='play';document.getElementById('overlay').classList.add('hide');
}
function end(){
  state='over';
  var nb=score>best;if(nb){best=score;try{localStorage.setItem('neondash-best',best)}catch(e){}}
  sfReport('dash',{type:'round',score:score,best:best});
  document.getElementById('t').textContent=score+(score===1?' orb':' orbs');
  document.getElementById('m').textContent=nb?'New best! Beat it again in 30 seconds.':'Best: '+best+'. Beat it in another 30 seconds.';
  document.getElementById('go').textContent='Play again';
  setTimeout(function(){document.getElementById('overlay').classList.remove('hide')},500);
}
function addItem(){
  var orb=Math.random()<0.6,m=new THREE.Mesh(orb?orbGeo:blkGeo,orb?orbMat:blkMat);
  m.position.set((Math.random()*2-1)*(X+0.5),orb?0.9:0.9,-80);scene.add(m);items.push({m:m,orb:orb});
}
function flashMsg(){$msg.style.opacity=1;setTimeout(function(){$msg.style.opacity=0},450)}

var left=0,right=0;
addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a')left=1;if(e.key==='ArrowRight'||e.key==='d')right=1;
  if((e.key===' '||e.key==='Enter')&&state!=='play')start();
});
addEventListener('keyup',function(e){if(e.key==='ArrowLeft'||e.key==='a')left=0;if(e.key==='ArrowRight'||e.key==='d')right=0});
var drag=false;
function px(e){tx=Math.max(-X,Math.min(X,(e.clientX/innerWidth-0.5)*2*X*1.15))}
canvas.addEventListener('pointerdown',function(e){drag=true;px(e)});
addEventListener('pointermove',function(e){if(drag)px(e)});
addEventListener('pointerup',function(){drag=false});
document.getElementById('overlay').addEventListener('click',start);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?85:65;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,0.05);last=now;
  var speed=26+elapsed*0.9;
  if(state==='play'){
    elapsed+=dt;time-=dt;
    var shown=Math.max(0,Math.ceil(time));$time.textContent=shown;if(time<=5)$time.classList.add('low');
    if(left)tx=Math.max(-X,tx-16*dt);if(right)tx=Math.min(X,tx+16*dt);
    spawn-=dt;if(spawn<=0){addItem();spawn=Math.max(0.18,0.42-elapsed*0.006)}
    for(var i=items.length-1;i>=0;i--){
      var o=items[i];o.m.position.z+=speed*dt;
      if(o.orb)o.m.rotation.y+=dt*4;else{o.m.rotation.y+=dt;o.m.rotation.x+=dt*0.6}
      var dz=o.m.position.z,dx=Math.abs(o.m.position.x-ship.position.x);
      if(dz>-1.2&&dz<1.2&&dx<(o.orb?1.3:1.5)){
        if(o.orb){score++;$score.textContent=score}else{time-=2;shake=1;flashMsg()}
        scene.remove(o.m);items.splice(i,1);continue;
      }
      if(dz>10){scene.remove(o.m);items.splice(i,1)}
    }
    if(time<=0){time=0;$time.textContent=0;end()}
  }else{
    items.forEach(function(o){o.m.rotation.y+=dt});
  }
  ft.offset.y+=(state==='play'?speed:8)*dt/2;
  ship.position.x+=(tx-ship.position.x)*Math.min(1,dt*12);
  ship.rotation.z=(tx-ship.position.x)*0.25;
  key.position.set(ship.position.x,3,2);
  shake=Math.max(0,shake-dt*3);
  cam.position.x=ship.position.x*0.5+(Math.random()-0.5)*shake*0.5;
  cam.position.y=3.4+(Math.random()-0.5)*shake*0.4;
  cam.lookAt(ship.position.x*0.5,0.8,-10);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
