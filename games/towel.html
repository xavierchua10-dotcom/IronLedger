<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Towel Stack</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url('../fonts/inter-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url('../fonts/inter-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url('../fonts/inter-latin-700-normal.woff2') format('woff2');}
</style>
<style>
:root{--bg:#0e1217;--ink:#f4f1ff;--muted:#a9b3c4;--acc:#5eead4;--gold:#f2b134;--red:#e5604f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud div{font-size:14px;color:var(--muted)}
.hud b{display:block;font-size:40px;font-weight:700;line-height:1;color:var(--ink)}
#score{color:var(--gold)}
#lives{display:block;font-size:20px;letter-spacing:6px;color:var(--gold);margin-top:6px;text-align:center}
#lives i{font-style:normal}#lives i.x{color:#3a424f}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 100px);text-align:center;font-size:22px;font-weight:700;color:var(--acc);opacity:0;transition:opacity .15s;pointer-events:none}
#msg.bad{color:var(--red)}
.bal{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(260px,70vw);pointer-events:none;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.bal .tr{position:relative;height:8px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,#e5604f,#f2b134 22%,#5eead4 40%,#5eead4 60%,#f2b134 78%,#e5604f);opacity:.9}
.bal .k{position:absolute;top:-4px;width:6px;height:16px;border-radius:3px;background:#fff;left:50%;margin-left:-3px;box-shadow:0 0 8px rgba(0,0,0,.6)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,16,.6);cursor:pointer}
#overlay.hide{display:none}
.card{text-align:center;padding:0 28px;max-width:320px}
.card h1{margin:0 0 10px;font-size:44px;font-weight:700;color:var(--acc);line-height:1}
.card p{margin:0 0 22px;color:var(--muted);font-size:17px;line-height:1.45}
.go{display:inline-block;background:var(--acc);color:#0b1a1f;border-radius:14px;padding:14px 34px;font-size:20px;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div>Height<b id="score">0</b></div><div><span id="lives"></span></div><div style="text-align:right">Best<b id="bestv">0</b></div></div>
<div id="msg"></div>
<div class="bal">BALANCE<div class="tr"><div class="k" id="knob"></div></div></div>
<div id="overlay" tabindex="0"><div class="card"><h1 id="t">Towel Stack</h1><p id="m">Drag to slide the bench. Catch each falling towel on top of the pile. Land one off centre and the tower leans, so catch the next on the other side.</p><span class="go" id="go">Play</span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function sfReport(game,data){try{data.sfGame=game;window.parent.postMessage(data,location.origin)}catch(e){}}
if(typeof THREE==='undefined'){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p style="color:#aeb3bd;font:16px Inter,sans-serif;text-align:center;margin-top:30vh;padding:0 24px">This game needs a connection to load. Check your internet and try again.</p>'})}
</script>
<script>
(function(){if(typeof THREE==='undefined')return;
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
window.__sfDispose=function(){try{window.requestAnimationFrame=function(){return 0};renderer.dispose();renderer.forceContextLoss();}catch(_){}};addEventListener('pagehide',window.__sfDispose);
var $score=document.getElementById('score'),$best=document.getElementById('bestv'),$msg=document.getElementById('msg'),$ov=document.getElementById('overlay'),$lives=document.getElementById('lives'),$knob=document.getElementById('knob');
function flash(t,bad){$msg.textContent=t;$msg.className=bad?'bad':'';$msg.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(function(){$msg.style.opacity=0},550)}

var scene=new THREE.Scene();scene.background=new THREE.Color(0x0e1217);
scene.fog=new THREE.Fog(0x0e1217,40,90);
var W=6,cam=new THREE.OrthographicCamera(-1,1,1,-1,-80,120),viewH=12;
scene.add(new THREE.HemisphereLight(0xdff4ff,0x1a2230,0.95));
var sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(5,14,10);scene.add(sun);

var TW=3.0,TH=0.46,TD=2.0,PW=4.4,MAXMISS=3,LEANMAX=1.6;
var best=0;try{best=+localStorage.getItem('towel-best')||0}catch(e){}$best.textContent=best;
var PAL=[[0xf4f1ea,0x5eead4],[0x5eead4,0xf4f1ea],[0xf2b134,0x14161a],[0xe5604f,0xf4f1ea],[0x6aa6f0,0xf4f1ea],[0xa78bfa,0xf4f1ea],[0xf4f1ea,0xf2b134]];
var matCache={};
function mat(c){return matCache[c]||(matCache[c]=new THREE.MeshStandardMaterial({color:c,roughness:0.92,flatShading:true}))}
var gBody=new THREE.BoxGeometry(TW,TH,TD),gStripe=new THREE.BoxGeometry(0.2,TH+0.02,TD+0.02);
function makeTowel(i){
  var p=PAL[i%PAL.length],g=new THREE.Group();
  g.add(new THREE.Mesh(gBody,mat(p[0])));
  var a=new THREE.Mesh(gStripe,mat(p[1]));a.position.x=-TW/2+0.38;g.add(a);
  var b=a.clone();b.position.x=TW/2-0.38;g.add(b);
  return g;
}

// bench (the base) + floor
var bench=new THREE.Group();scene.add(bench);
var bTop=new THREE.Mesh(new THREE.BoxGeometry(PW,0.5,TD+0.6),new THREE.MeshStandardMaterial({color:0x2a2f38,roughness:0.6}));bTop.position.y=-0.25;bench.add(bTop);
var bEdge=new THREE.Mesh(new THREE.BoxGeometry(PW+0.04,0.08,TD+0.64),new THREE.MeshStandardMaterial({color:0xf2b134,roughness:0.5}));bEdge.position.y=-0.52;bench.add(bEdge);
[-1,1].forEach(function(s){var l=new THREE.Mesh(new THREE.BoxGeometry(0.35,2.2,0.5),new THREE.MeshStandardMaterial({color:0x20242c,roughness:0.7}));l.position.set(s*(PW/2-0.5),-1.6,0);bench.add(l)});
var floor=new THREE.Mesh(new THREE.PlaneGeometry(80,40),new THREE.MeshStandardMaterial({color:0x151a21,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.7;scene.add(floor);
var grid=new THREE.GridHelper(80,40,0x1f2630,0x1a2029);grid.position.y=-2.69;scene.add(grid);

var state='ready',group=new THREE.Group(),towels=[],falling=[],pieces=[];
scene.add(group);
var score=0,miss=0,lean=0,combo=0,speed=7,platX=0,targetX=0,camY=0,t0=0,sinceSpawn=0,squash=null;
function updLives(){var h='';for(var i=0;i<MAXMISS;i++)h+='<i class="'+(i<MAXMISS-miss?'':'x')+'">&#9679;</i>';$lives.innerHTML=h}
function topY(){return towels.length*TH}   // surface height of the pile above the bench top
function reset(){
  towels.forEach(function(t){group.remove(t.m)});falling.forEach(function(f){scene.remove(f.m)});pieces.forEach(function(p){scene.remove(p.m)});
  towels=[];falling=[];pieces=[];group.rotation.z=0;
  score=0;miss=0;lean=0;combo=0;speed=7;platX=0;targetX=0;sinceSpawn=9;squash=null;
  $score.textContent=0;updLives();
}
function xRange(){return Math.max(2.2,cam.right-1.9)}
function spawn(){
  var i=score+falling.length,m=makeTowel(i);
  var x=(Math.random()*2-1)*xRange();
  m.position.set(x,camY+viewH+2,0);scene.add(m);
  falling.push({m:m,x:x,y:camY+viewH+2,i:i,missed:false,spin:(Math.random()-0.5)*0.6});
  sinceSpawn=0;
}
function start(){reset();state='play';$ov.classList.add('hide')}
// world x of the top surface centre of the pile (the pile sways with the lean)
function pileTopX(){
  var rz=group.rotation.z,y=topY();
  var rel=towels.length?towels[towels.length-1].rel:0;
  return platX+rel*Math.cos(rz)-y*Math.sin(rz);
}
function land(f){
  var top=pileTopX(),below=towels.length?TW:PW;
  var off=f.x-top,over=Math.abs(off);
  // the towel must overlap the one below by at least ~45% of its own width
  if(over>(below+TW)/2-TW*0.45)return false;
  var perfect=over<0.22;
  var rel=f.x-platX;               // position relative to the bench
  if(perfect){rel=towels.length?towels[towels.length-1].rel:0;combo++;lean*=0.4;flash(combo>2?'Perfect x'+combo:'Perfect')}
  else{combo=0;lean+=off*0.55}
  scene.remove(f.m);
  var m=makeTowel(f.i);m.position.set(rel,towels.length*TH+TH/2,0);group.add(m);
  towels.push({m:m,rel:rel});
  squash={m:m,t:0};
  score++;$score.textContent=score;speed=Math.min(13,7+score*0.12);
  if(Math.abs(lean)>LEANMAX){topple();return true}
  return true;
}
function topple(){
  state='over';
  var dirn=lean>0?1:-1;
  towels.forEach(function(t,k){
    var wp=new THREE.Vector3();t.m.getWorldPosition(wp);
    group.remove(t.m);t.m.position.copy(wp);t.m.rotation.z=group.rotation.z;scene.add(t.m);
    pieces.push({m:t.m,vx:dirn*(1.2+Math.random()*2.4+k*0.05),vy:2+Math.random()*3,vr:dirn*(-0.5-Math.random()*2.2),t:0});
  });
  towels=[];group.rotation.z=0;
  finish('The tower fell');
}
function finish(why){
  state='over';
  var nb=score>best;if(nb){best=score;try{localStorage.setItem('towel-best',best)}catch(e){}$best.textContent=best}
  sfReport('towel',{type:'round',score:score,best:best});
  document.getElementById('t').textContent=score+(score===1?' towel':' towels');
  document.getElementById('m').textContent=why+'. '+(nb?'New best!':'Best: '+best+'.')+' Go again.';
  document.getElementById('go').textContent='Play again';
  setTimeout(function(){$ov.classList.remove('hide')},800);
}
function setTargetFromPointer(e){
  var x=(e.clientX/innerWidth*2-1)*cam.right;
  var lim=cam.right-PW/2-0.2;
  targetX=Math.max(-lim,Math.min(lim,x));
}
canvas.addEventListener('pointerdown',function(e){e.preventDefault();setTargetFromPointer(e)});
canvas.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')setTargetFromPointer(e)});
var keys={};
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;if(e.key==='ArrowRight'||e.key==='d')keys.r=1;if((e.key===' '||e.key==='Enter')&&state!=='play')start()});
addEventListener('keyup',function(e){if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0});
$ov.addEventListener('click',start);
function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  var a=innerWidth/innerHeight;
  viewH=Math.max(7,W/a);
  cam.left=-viewH*a;cam.right=viewH*a;cam.top=viewH;cam.bottom=-viewH;
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
reset();
var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,0.05);last=now;t0+=dt;
  if(state==='play'){
    if(keys.l)targetX-=9*dt;if(keys.r)targetX+=9*dt;
    var lim=cam.right-PW/2-0.2;targetX=Math.max(-lim,Math.min(lim,targetX));
    platX+=(targetX-platX)*Math.min(1,dt*16);
    // lean slowly settles back a little, so a calm hand can recover
    lean-=lean*Math.min(1,dt*0.12);
    sinceSpawn+=dt;
    var inFlight=falling.length;
    var span=(viewH*2)/speed;
    if(inFlight<2&&sinceSpawn>span*0.55)spawn();
    // falling towels
    for(var i=falling.length-1;i>=0;i--){
      var f=falling[i];
      var prevBottom=f.y-TH/2;
      f.y-=speed*dt;
      var surf=topY();
      var bottom=f.y-TH/2;
      if(!f.missed&&prevBottom>=surf&&bottom<=surf){
        if(land(f)){falling.splice(i,1);if(state!=='play')break;continue}
        f.missed=true;miss++;updLives();flash('Miss',true);
        if(miss>=MAXMISS){finish('Three misses');}
      }
      f.m.position.set(f.x,f.y,0);f.m.rotation.y+=f.spin*dt;
      if(f.y<camY-viewH-4){scene.remove(f.m);falling.splice(i,1)}
    }
  }
  // pile sway: tilts with the lean and wobbles a touch more when it is leaning hard
  if(state==='play'||state==='ready'){
    var wob=Math.sin(t0*2.4)*0.012*(0.4+Math.abs(lean));
    group.rotation.z+=(( -lean*0.075+wob)-group.rotation.z)*Math.min(1,dt*8);
  }
  group.position.set(platX,0,0);bench.position.set(platX,0,0);
  if(squash){squash.t+=dt*6;var s=1-Math.sin(Math.min(1,squash.t)*Math.PI)*0.28;squash.m.scale.y=s;if(squash.t>=1){squash.m.scale.y=1;squash=null}}
  $knob.style.left=(50+Math.max(-1,Math.min(1,lean/LEANMAX))*50)+'%';
  for(var j=pieces.length-1;j>=0;j--){
    var p=pieces[j];p.t+=dt;p.vy-=22*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.rotation.z+=p.vr*dt;
    if(p.t>3.5||p.m.position.y<camY-viewH-6){scene.remove(p.m);pieces.splice(j,1)}
  }
  var ty=topY()+viewH*0.32-1.2;
  camY+=(Math.max(viewH*0.32-1.2,ty)-camY)*Math.min(1,dt*3.5);
  cam.position.set(0,camY+5,24);cam.lookAt(0,camY,0);
  floor.position.x=grid.position.x=0;
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(/[?&]debug/.test(location.search))window.__td={falling:function(){return falling},state:function(){return state},platX:function(){return platX},lean:function(){return lean},score:function(){return score},top:pileTopX,camR:function(){return cam.right},setX:function(x){targetX=x}};
})();
</script>
</body>
</html>
