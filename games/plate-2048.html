<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Plate 2048</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url('../fonts/inter-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url('../fonts/inter-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url('../fonts/inter-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-display:swap;src:url('../fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2');}
</style>
<style>
:root{--bg:#14161a;--panel:#1d2026;--ink:#f4f1ff;--mut:#9aa1ad;--gold:#f2b134;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.hud{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:flex-end}
.hud div{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.hud b{display:block;font-size:34px;line-height:1.05;color:var(--ink);letter-spacing:0}
#score{color:var(--gold)}
h1{margin:14px 0 4px;font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px;text-align:center}
#board{position:relative;width:min(92vw,420px);aspect-ratio:1;background:var(--panel);border-radius:18px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.grid{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.cell{background:rgba(255,255,255,.04);border-radius:50%}
#tiles{position:absolute;inset:10px}
.t{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;transition:left .11s ease,top .11s ease;color:#0b0c0e}
.t .in{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.t small{font-size:.42em;font-weight:700;opacity:.7;margin-top:2px}
.t.new .in{animation:pop .18s ease}.t.mer .in{animation:bump .2s ease}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.18)}}
.btns{margin-top:16px;display:flex;gap:10px}
button{font:700 15px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--ink);border-radius:12px;padding:12px 22px}
button.p{background:var(--gold);color:#1a1300;border-color:var(--gold)}
#ov{position:absolute;inset:0;border-radius:18px;background:rgba(12,13,16,.82);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#ov.show{display:flex}#ov h2{margin:0 0 6px;font-size:34px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}#ov p{margin:0 0 18px;color:var(--mut);font-size:16px}
.hint{margin-top:12px;color:var(--mut);font-size:13px}
</style></head><body>
<div class="wrap">
<div class="hud"><div>Total<b id="score">0</b></div><div style="text-align:right">Best<b id="best">0</b></div></div>
<h1>Plate 2048</h1>
<p class="sub">Swipe to slide. Matching plates merge. Load the bar to <b style="color:var(--ink)">320 kg</b>.</p>
<div id="board"><div class="grid" id="grid"></div><div id="tiles"></div>
<div id="ov"><h2 id="ovt">Bar loaded!</h2><p id="ovm"></p><div class="btns"><button class="p" id="ovb">Play again</button></div></div></div>
<div class="btns"><button id="undo">Undo</button><button id="new">New game</button></div>
<div class="hint">Swipe or use arrow keys</div>
</div>
<script>
function sfReport(g,d){try{d.sfGame=g;window.parent.postMessage(d,location.origin)}catch(e){}}
(function(){
var N=4,GAP=8,grid=[],score=0,best=0,won=false,over=false,hist=[],idc=0;
try{best=+localStorage.getItem('p2048-best')||0}catch(e){}
document.getElementById('best').textContent=best;
var g=document.getElementById('grid');for(var i=0;i<16;i++){var c=document.createElement('div');c.className='cell';g.appendChild(c)}
var $t=document.getElementById('tiles'),$s=document.getElementById('score'),$b=document.getElementById('best');
var COL={2.5:['#e9e6df','#c9c6bf'],5:['#f6f2e6','#e6dfc8'],10:['#ffe29a','#f2c14e'],20:['#f6b93b','#e08e0b'],40:['#f2a134','#d9741a'],80:['#ee7b3a','#d9531a'],160:['#e8504a','#c0302b'],320:['#5eead4','#14b8a6'],640:['#8ef7e6','#2dd4bf'],1280:['#c9fff5','#5eead4']};
function Tile(v,r,c,isNew){return{id:++idc,v:v,r:r,c:c,isNew:!!isNew,merged:false}}
function empty(){var e=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);return e}
function spawn(){var e=empty();if(!e.length)return;var p=e[Math.floor(Math.random()*e.length)];grid[p[0]][p[1]]=Tile(Math.random()<.85?2.5:5,p[0],p[1],true)}
function snap(){return{g:grid.map(function(r){return r.map(function(t){return t?t.v:0})}),s:score}}
function restore(s){grid=[];for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++)grid[r][c]=s.g[r][c]?Tile(s.g[r][c],r,c):null}score=s.s}
function fmt(v){return v%1?v.toFixed(1):''+v}
var els={};
function render(){
  var bw=document.getElementById('board').clientWidth-20,cell=(bw-GAP*3)/4,seen={};
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var t=grid[r][c];if(!t)continue;seen[t.id]=1;
    var el=els[t.id];
    if(!el){el=document.createElement('div');el.className='t'+(t.isNew?' new':'');el.innerHTML='<div class="in"></div>';$t.appendChild(el);els[t.id]=el;el.style.transition='none';
      el.style.left=(t.c*(cell+GAP))+'px';el.style.top=(t.r*(cell+GAP))+'px';void el.offsetWidth;el.style.transition=''}
    el.style.width=el.style.height=cell+'px';el.style.fontSize=(cell*(fmt(t.v).length>3?.3:.36))+'px';
    el.style.left=(t.c*(cell+GAP))+'px';el.style.top=(t.r*(cell+GAP))+'px';
    var col=COL[t.v]||COL[1280],in_=el.firstChild;in_.style.background='radial-gradient(circle at 35% 30%,'+col[0]+','+col[1]+')';
    in_.style.boxShadow='inset 0 0 0 '+Math.max(3,cell*.07)+'px rgba(0,0,0,.18)';
    in_.innerHTML=fmt(t.v)+'<small>kg</small>';
    if(t.merged){in_.classList.remove('x');el.classList.remove('mer');void el.offsetWidth;el.classList.add('mer');t.merged=false}
    t.isNew=false}
  Object.keys(els).forEach(function(id){if(!seen[id]){var e=els[id];delete els[id];setTimeout(function(){e.remove()},130)}});
  $s.textContent=fmt(score);
}
function move(dir){ // 0 left 1 up 2 right 3 down
  if(over)return;var before=snap(),moved=false,gain=0;
  var ng=[];for(var r=0;r<N;r++){ng[r]=[];for(var c=0;c<N;c++)ng[r][c]=null}
  for(var k=0;k<N;k++){
    var line=[];for(var j=0;j<N;j++){var r=dir%2?j:k,c=dir%2?k:j;if(dir>1){r=dir%2?N-1-j:k;c=dir%2?k:N-1-j}var t=grid[r][c];if(t)line.push(t)}
    var out=[];for(var i=0;i<line.length;i++){var a=line[i];if(i+1<line.length&&line[i+1].v===a.v){var b=line[i+1];var m=Tile(a.v*2,0,0);m.merged=true;m._from=[a,b];out.push(m);gain+=m.v;i++}else out.push(a)}
    for(var j=0;j<N;j++){var t2=out[j];if(!t2)continue;var r2=dir%2?j:k,c2=dir%2?k:j;if(dir>1){r2=dir%2?N-1-j:k;c2=dir%2?k:N-1-j}
      if(t2._from){t2._from.forEach(function(f){var old=f.r+','+f.c;f.r=r2;f.c=c2;f.dead=true;moved=true;});t2.r=r2;t2.c=c2;delete t2._from}
      else{if(t2.r!==r2||t2.c!==c2)moved=true;t2.r=r2;t2.c=c2}
      ng[r2][c2]=t2}
  }
  if(!moved)return;
  hist.push(before);if(hist.length>1)hist.shift();
  // animate: move old tiles first (those merged slide into place then vanish)
  var old=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c])old.push(grid[r][c]);
  grid=ng;score+=gain;
  old.forEach(function(t){if(t.dead){var el=els[t.id];if(el){var bw=document.getElementById('board').clientWidth-20,cell=(bw-GAP*3)/4;el.style.left=(t.c*(cell+GAP))+'px';el.style.top=(t.r*(cell+GAP))+'px';delete els[t.id];setTimeout(function(){el.remove()},120)}}});
  spawn();render();
  if(score>best){best=score;$b.textContent=fmt(best);try{localStorage.setItem('p2048-best',best)}catch(e){}}
  var hit=false;for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c]&&grid[r][c].v>=320)hit=true;
  if(hit&&!won){won=true;show('Bar loaded!','320 kg on the bar. Keep stacking?','Keep going')}
  else if(!canMove()){over=true;sfReport('plate',{type:'round',score:score,best:best});show('Rack is full','Total '+fmt(score)+' kg. Best '+fmt(best)+' kg.','Play again')}
}
function canMove(){if(empty().length)return true;for(var r=0;r<N;r++)for(var c=0;c<N;c++){var t=grid[r][c];if(c+1<N&&grid[r][c+1].v===t.v)return true;if(r+1<N&&grid[r+1][c].v===t.v)return true}return false}
function show(t,m,b){document.getElementById('ovt').textContent=t;document.getElementById('ovm').textContent=m;document.getElementById('ovb').textContent=b;document.getElementById('ov').classList.add('show')}
function hide(){document.getElementById('ov').classList.remove('show')}
function reset(){grid=[];for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++)grid[r][c]=null}score=0;won=false;over=false;hist=[];$t.innerHTML='';els={};spawn();spawn();hide();render()}
document.getElementById('new').onclick=reset;
document.getElementById('ovb').onclick=function(){if(over)reset();else hide()};
document.getElementById('undo').onclick=function(){if(!hist.length)return;restore(hist.pop());over=false;$t.innerHTML='';els={};hide();render()};
addEventListener('keydown',function(e){var m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3}[e.key];if(m!==undefined){e.preventDefault();move(m)}});
var sx,sy;addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',function(e){if(sx==null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx<0?0:2);else move(dy<0?1:3)});
addEventListener('resize',render);
window.__p2048={move:move,grid:function(){return grid},score:function(){return score}};
reset();
})();
</script></body></html>
