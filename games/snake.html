<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake 3D</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url('../fonts/inter-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url('../fonts/inter-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url('../fonts/inter-latin-700-normal.woff2') format('woff2');}
</style>
<style>
:root{--bg:#14161a;--ink:#eef2ff;--muted:#9aa6cf;--mint:#5eead4;--amber:#fbbf24;--panel:rgba(20,26,46,.82);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.hud div{font-size:15px;color:var(--muted)}
.hud b{display:block;font-size:34px;font-weight:800;color:var(--ink);line-height:1}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,28,.55)}
#overlay.hide{display:none}
.card{background:var(--panel);padding:28px 30px;border-radius:20px;text-align:center;max-width:300px;border:1px solid rgba(255,255,255,.08)}
.card h1{margin:0 0 8px;font-size:38px;font-weight:800;color:var(--mint)}
.card p{margin:0 0 20px;color:var(--muted);font-size:16px;line-height:1.4}
button{font:inherit;cursor:pointer}
#go{background:var(--mint);color:#08201c;border:0;border-radius:12px;padding:12px 28px;font-size:18px;font-weight:800}
#go:focus-visible,.pad button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pad{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px}
.pad button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;color:var(--ink);font-size:22px}
.pad button:active{background:rgba(94,234,212,.35)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div>Apples<b id="sc">0</b></div><div style="text-align:right">Best<b id="bs">0</b></div></div>
<div class="pad" aria-label="Direction controls">
<button class="u" data-d="0,-1" aria-label="Up">↑</button><button class="l" data-d="-1,0" aria-label="Left">←</button><button class="d" data-d="0,1" aria-label="Down">↓</button><button class="r" data-d="1,0" aria-label="Right">→</button>
</div>
<div id="overlay"><div class="card"><h1 id="t">Snake 3D</h1><p id="m">Swipe, use the arrow pad, or press arrow keys / WASD. Eat apples, avoid walls and your tail.</p><button id="go">Play</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function sfReport(game,data){try{data.sfGame=game;window.parent.postMessage(data,location.origin)}catch(e){}}
if(typeof THREE==='undefined'){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p style="color:#aeb3bd;font:16px Inter,sans-serif;text-align:center;margin-top:30vh;padding:0 24px">Couldn\u2019t load the 3D engine. Check your connection and try again.</p>'});}
</script>
<script>
(function(){if(typeof THREE==='undefined')return;
var N=15, H=(N-1)/2;
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x14161a);
scene.fog=new THREE.Fog(0x14161a,24,48);
var cam=new THREE.PerspectiveCamera(45,1,0.1,100);
scene.add(new THREE.HemisphereLight(0xdfe7ff,0x1a2040,0.85));
var sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(6,14,8);sun.castShadow=true;
sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// board
var cv=document.createElement('canvas');cv.width=cv.height=N*32;
var cx=cv.getContext('2d');
for(var i=0;i<N;i++)for(var j=0;j<N;j++){cx.fillStyle=(i+j)%2?'#3b4470':'#343c66';cx.fillRect(i*32,j*32,32,32)}
var tex=new THREE.CanvasTexture(cv);tex.magFilter=THREE.NearestFilter;
var side=new THREE.MeshStandardMaterial({color:0x1f2547});
var slab=new THREE.Mesh(new THREE.BoxGeometry(N,0.5,N),[side,side,new THREE.MeshStandardMaterial({map:tex}),side,side,side]);
slab.position.y=-0.25;slab.receiveShadow=true;scene.add(slab);

// snake pieces
var segGeo=new THREE.BoxGeometry(0.86,0.7,0.86);
var head=new THREE.Group();
var hm=new THREE.MeshStandardMaterial({color:0x2dd4bf});
var hb=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.8,0.95),hm);hb.castShadow=true;head.add(hb);
var eyeM=new THREE.MeshStandardMaterial({color:0xffffff}),pupM=new THREE.MeshBasicMaterial({color:0x08201c});
[-0.24,0.24].forEach(function(x){
  var e=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,12),eyeM);e.position.set(x,0.18,0.34);head.add(e);
  var p=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),pupM);p.position.set(x,0.18,0.46);head.add(p);
});
scene.add(head);
var segs=[];
function segMesh(i){
  while(segs.length<=i){
    var k=segs.length;
    var m=new THREE.Mesh(segGeo,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.46-Math.min(k,30)*0.004,0.7,0.5-Math.min(k,30)*0.004)}));
    m.castShadow=true;scene.add(m);segs.push(m);
  }
  segs[0].visible=false; // slot 0 is never used (the head is its own mesh); it used to sit at the board centre
  return segs[i];
}
var apple=new THREE.Mesh(new THREE.SphereGeometry(0.36,20,20),new THREE.MeshStandardMaterial({color:0xfbbf24,emissive:0x7a4a00,emissiveIntensity:0.5}));
apple.castShadow=true;scene.add(apple);

// state
var snake,prev,dir,queue,food,score,best=0,state='ready',acc=0,stepMs=150,flash=0,pop=0;
try{best=+localStorage.getItem('snake3d-best')||0}catch(e){}
var $sc=document.getElementById('sc'),$bs=document.getElementById('bs');$bs.textContent=best;

function reset(){
  snake=[{x:7,z:7},{x:6,z:7},{x:5,z:7}];prev=snake.map(function(s){return{x:s.x,z:s.z}});
  dir={x:1,z:0};queue=[];score=0;stepMs=150;acc=0;flash=0;
  $sc.textContent=0;placeFood();
  head.rotation.y=Math.PI/2;
}
function placeFood(){
  var free=[];
  for(var x=0;x<N;x++)for(var z=0;z<N;z++)if(!snake.some(function(s){return s.x===x&&s.z===z}))free.push({x:x,z:z});
  food=free[Math.floor(Math.random()*free.length)];
}
function turn(dx,dz){
  if(state!=='play')return;
  var last=queue.length?queue[queue.length-1]:dir;
  if((dx===-last.x&&dz===-last.z)||(dx===last.x&&dz===last.z))return;
  if(queue.length<2)queue.push({x:dx,z:dz});
}
function step(){
  if(queue.length)dir=queue.shift();
  var nh={x:snake[0].x+dir.x,z:snake[0].z+dir.z};
  var eat=food&&nh.x===food.x&&nh.z===food.z;
  var body=eat?snake:snake.slice(0,-1);
  if(nh.x<0||nh.z<0||nh.x>=N||nh.z>=N||body.some(function(s){return s.x===nh.x&&s.z===nh.z})){return die()}
  prev=snake.map(function(s){return{x:s.x,z:s.z}});
  snake=[nh].concat(eat?snake:snake.slice(0,-1));
  if(eat){score++;$sc.textContent=score;pop=1;stepMs=Math.max(75,150-score*3);placeFood()}
}
function die(){
  state='over';flash=1;
  if(score>best){best=score;$bs.textContent=best;try{localStorage.setItem('snake3d-best',best)}catch(e){}}
  sfReport('snake',{type:'round',score:score,best:best});
  setTimeout(function(){
    document.getElementById('t').textContent=score>0&&score>=best?'New best: '+score:'Game over';
    document.getElementById('m').textContent='You ate '+score+(score===1?' apple.':' apples.')+' Ready for another run?';
    document.getElementById('go').textContent='Play again';
    document.getElementById('overlay').classList.remove('hide');
  },650);
}
function start(){
  reset();state='play';document.getElementById('overlay').classList.add('hide');
}
document.getElementById('go').addEventListener('click',start);

// input
var keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',function(e){
  var k=keys[e.key]||keys[(e.key||'').toLowerCase()];
  if(k){e.preventDefault();turn(k[0],k[1])}
  else if((e.key===' '||e.key==='Enter')&&state!=='play'){e.preventDefault();start()}
});
Array.prototype.forEach.call(document.querySelectorAll('.pad button'),function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();var d=b.dataset.d.split(',');turn(+d[0],+d[1])});
});
var t0=null;
canvas.addEventListener('pointerdown',function(e){t0={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',function(e){
  if(!t0)return;var dx=e.clientX-t0.x,dy=e.clientY-t0.y;t0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
});

function resize(){
  var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
reset();

var last=performance.now(),camT=new THREE.Vector3();
function lerp(a,b,t){return a+(b-a)*t}
function frame(now){
  var dt=Math.min(now-last,60);last=now;
  if(state==='play'){acc+=dt;while(acc>=stepMs&&state==='play'){acc-=stepMs;step()}}
  var t=state==='play'?Math.min(acc/stepMs,1):1;
  for(var i=0;i<snake.length;i++){
    var p=prev[i]||snake[i],c=snake[i];
    var x=lerp(p.x,c.x,t)-H,z=lerp(p.z,c.z,t)-H;
    if(i===0){
      head.position.set(x,0.4,z);
      var target=Math.atan2(dir.x,dir.z),d=target-head.rotation.y;
      d=Math.atan2(Math.sin(d),Math.cos(d));head.rotation.y+=d*0.35;
      var s=1+pop*0.25;head.scale.set(s,s,s);
    }else{
      var m=segMesh(i);m.visible=true;m.position.set(x,0.35,z);
      var sc=1-Math.min(i/Math.max(snake.length,8),1)*0.35;m.scale.set(sc,sc,sc);
    }
  }
  for(var j=snake.length;j<segs.length;j++)segs[j].visible=false;
  pop=Math.max(0,pop-dt/200);
  apple.position.set(food.x-H,0.55+Math.sin(now/260)*0.1,food.z-H);
  apple.rotation.y=now/500;
  if(flash>0){flash=Math.max(0,flash-dt/500);hm.color.setRGB(lerp(0.18,0.95,flash),lerp(0.83,0.2,flash),lerp(0.75,0.2,flash))}
  // camera: tilted overview that leans toward the head
  var portrait=cam.aspect<1,dist=portrait?1.55:1;
  camT.set((head.position.x)*0.25,0,(head.position.z)*0.25);
  cam.position.x=lerp(cam.position.x,camT.x,0.05);
  cam.position.y=19*dist*(portrait?0.92:1);
  cam.position.z=lerp(cam.position.z,camT.z+13*dist,0.05);
  cam.lookAt(camT.x*0.6,0,camT.z*0.6);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
