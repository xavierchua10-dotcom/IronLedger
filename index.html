<html lang="en">

<meta property="og:type" content="website">
<meta property="og:url" content="https://xavierchua10-dotcom.github.io/IronLedger/">

<meta name="twitter:description" content="Log your lifts, any style, any split. A free workout tracker by Savior.">
<meta name="twitter:image" content="https://xavierchua10-dotcom.github.io/IronLedger/icons/og-image.jpg">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFit Logger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --mm-body:#4a5262;
    --mm-body-line:#8b93a3;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --density-card-pad:14px 14px 12px;
    --density-card-gap:20px;
    --density-head-gap:10px;
    --density-row-pad:4px 0;
    --density-addrow-gap:10px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  button, input, select, [data-action]{
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Every tappable control (buttons, tabs, chips, muscle-map regions, etc.)
     is a <button> or carries [data-action]. Inputs/selects are deliberately
     left out here so typing, copy, and select-all still work normally. */
  button, [data-action]{
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body{
    background:
      linear-gradient(rgba(10,11,14,0.80), rgba(10,11,14,0.86)),
      url('images/hero-background.jpg') center / cover no-repeat fixed;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    flex-direction:column;
    background:rgba(20,23,27,0.62);
    overflow:hidden;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(16,18,21,0.72);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent);}
  .topbar h1 .brand-tag{
    color:var(--text-faint);
    font-size:11px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:lowercase;
    vertical-align:middle;
  }
  .unit-toggle{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    padding:9px 12px;
    min-height:40px;
    border-radius:var(--radius-xl);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
  }
  .unit-toggle:active{background:var(--panel-3);}
  .session-meta-actions .unit-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:11px;
    padding:0;
    width:32px;
    height:32px;
    min-height:0;
    border-radius:var(--radius-sm);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .hidden{display:none !important;}

  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .account-wrap{position:relative;display:flex;align-items:center;gap:8px;}
  .notif-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    width:290px;
    max-width:calc(100vw - 32px);
    max-height:70vh;
    display:flex;
    flex-direction:column;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    z-index:20;
    animation:notifSlideDown 0.18s ease;
  }
  .notif-dropdown .pro-panel-header{padding:14px 16px 4px;}
  .notif-dropdown .pro-panel-body{padding:12px 16px 16px;}
  /* Shared floating menu for the exercise-card "⋮" buttons (both the
     per-exercise header menu and each set row's menu). A single global
     element repositioned via JS to sit under whichever "⋮" was tapped
     (see renderRowActionMenu), rather than one dropdown per row — this
     one lives outside #view so it survives tab re-renders untouched. */
  .row-action-menu{
    position:fixed;
    min-width:140px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    padding:6px;
    z-index:30;
    animation:notifSlideDown 0.15s ease;
  }
  .row-action-menu.hidden{display:none;}
  .row-action-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.02em;
    padding:10px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .row-action-item:active{background:var(--panel-3);}
  .row-action-item.danger{color:var(--accent-2);}

  /* ---------- Guided tour ---------- */
  /* #tourBackdrop: full-screen, catches every tap while the tour is open
     so a stray touch can't hit real controls underneath — it does not
     itself draw the dimming (see .tour-spotlight below for that).
     #tourSpotlight: a small ring positioned exactly over the current
     target; its oversized box-shadow is what actually paints the dimmed
     backdrop-with-a-cutout illusion. pointer-events:none since clicks
     should fall through to the backdrop, not the ring.
     #tourBubble: the floating text card with the step's title/copy and
     Back/Next controls, repositioned above or below the target depending
     on available space (see positionTourBubble). */
  .tour-backdrop{
    position:fixed;
    inset:0;
    z-index:210;
    background:transparent;
  }
  .tour-backdrop.hidden{display:none;}
  .tour-spotlight{
    position:fixed;
    z-index:211;
    border-radius:var(--radius-md);
    border:2px solid var(--accent-2);
    box-shadow:0 0 0 9999px rgba(6,7,9,0.68), 0 0 12px rgba(193,68,60,0.6);
    pointer-events:none;
    transition:top 0.2s ease, left 0.2s ease, width 0.2s ease, height 0.2s ease;
  }
  .tour-spotlight.hidden{display:none;}
  .tour-bubble{
    position:fixed;
    z-index:212;
    max-width:300px;
    background:var(--panel-2);
    border:1px solid var(--accent-dim);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
  }
  .tour-bubble.hidden{display:none;}
  .tour-bubble.tour-bubble-centered{
    top:50% !important;
    left:50% !important;
    bottom:auto !important;
    transform:translate(-50%, -50%);
    width:min(300px, calc(100vw - 48px)) !important;
  }
  .tour-bubble-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .tour-bubble-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;color:var(--accent);}
  .tour-bubble-close{background:none;border:none;color:var(--text-faint);font-size:14px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
  .tour-bubble-text{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:14px;}
  .tour-bubble-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .tour-bubble-progress{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);}
  .tour-bubble-actions{display:flex;gap:8px;}
  .tour-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:7px 14px;
    border-radius:var(--radius-sm);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  .tour-btn:active{background:var(--panel-3);}
  .tour-btn.primary{background:var(--accent);color:#1c1500;border-color:var(--accent);}
  .tour-btn.primary:active{opacity:0.9;background:var(--accent);}
  .account-menu-avatar-label{
    font-size:10px;
    color:var(--text-faint);
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:0 2px;
    margin-bottom:6px;
  }
  .account-menu-avatar-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:10px;
  }
  .avatar-pick-btn{
    width:100%;
    height:48px;
    min-width:44px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--line);
    background:var(--panel-3);
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .avatar-pick-btn:active{background:var(--panel-2);}
  .avatar-pick-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .avatar-pick-btn svg{pointer-events:none;display:block;}

  /* ---------- Auth gate ---------- */
  #authGate{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:rgba(20,23,27,0.9);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:30px 24px 26px;
    box-shadow:0 16px 48px rgba(0,0,0,0.5);
  }
  .auth-title{text-align:center;margin-bottom:22px;}
  .auth-title h1{
    font-family:'Oswald',sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .auth-title h1 span{color:var(--accent);}
  .auth-title .auth-sub{
    color:var(--text-faint);
    font-size:12px;
    letter-spacing:0.05em;
    margin-top:4px;
  }
  .auth-tabs{
    display:flex;
    background:var(--panel-2);
    border-radius:var(--radius-sm);
    padding:3px;
    margin-bottom:18px;
  }
  .auth-tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:9px 4px;
    border-radius:var(--radius-xs);
    cursor:pointer;
  }
  .auth-tabs button.active{background:var(--accent);color:#1c1500;}
  .auth-field{margin-bottom:12px;}
  .auth-field input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:12px;
    font-size:16px;
  }
  .auth-field input:focus{outline:none;border-color:var(--accent);}
  /* Password show/hide toggle — wraps any password input (auth screen,
     change password, delete account confirm) regardless of which base
     input style it uses; padding-right just needs to clear the button. */
  .password-field-wrap{position:relative;}
  .password-field-wrap input{padding-right:38px !important;box-sizing:border-box;}
  .password-toggle-btn{
    position:absolute;
    right:2px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    padding:8px;
    margin:0;
    cursor:pointer;
    color:var(--text-faint);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .password-toggle-btn:active{color:var(--text-dim);}
  .password-toggle-btn svg{width:18px;height:18px;display:block;}
  .password-toggle-btn .pw-eye-hide{display:none;}
  .password-toggle-btn.is-visible .pw-eye-show{display:none;}
  .password-toggle-btn.is-visible .pw-eye-hide{display:block;}
  .auth-avatar-label{
    font-size:11px;
    color:var(--text-dim);
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin:2px 0 8px;
  }
  .auth-avatar-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .auth-forgot-link{
    display:block;
    width:100%;
    text-align:right;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:11.5px;
    text-decoration:underline;
    font-family:inherit;
    cursor:pointer;
    padding:0 0 12px;
    margin-top:-4px;
  }
  .auth-forgot-link:active{color:var(--accent);}
  .auth-error{
    color:var(--accent-2);
    font-size:12px;
    min-height:16px;
    margin-bottom:8px;
    line-height:1.4;
  }
  .auth-submit{
    width:100%;
    padding:14px;
    border-radius:var(--radius);
    border:none;
    background:var(--accent);
    color:#1c1500;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:700;
    cursor:pointer;
  }
  .auth-submit:active{opacity:0.9;}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    color:var(--text-faint);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .auth-divider::before,.auth-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .auth-guest-btn{
    width:100%;
    padding:13px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
  }
  .auth-guest-btn:active{background:var(--panel-2);}
  .auth-note{
    font-size:11px;
    color:var(--text-faint);
    text-align:center;
    margin-top:16px;
    line-height:1.5;
  }

  /* ---------- Main / view ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(100px + var(--safe-bottom));
  }

  .view-slide-track{
    display:flex;
    width:200%;
    pointer-events:none;
    will-change:transform;
    backface-visibility:hidden;
  }
  .view-slide-pane{
    width:50%;
    flex-shrink:0;
    min-width:0;
  }

  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:22px 0 8px;
  }
  .section-label:first-child{margin-top:0;}
  .danger-zone-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .danger-zone-toggle .dz-chevron{
    font-size:10px;
    color:var(--text-faint);
    transition:transform 0.15s ease;
  }
  .danger-zone-toggle.open .dz-chevron{transform:rotate(180deg);}
  .history-old-toggle{
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    user-select:none;
  }
  .history-old-toggle:active{opacity:0.7;}
  .history-old-caret{font-size:9px;}
  .history-month-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 2px 4px;
  }
  .history-month-label:first-of-type{padding-top:2px;}

  input[type=text].session-name-input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    padding:4px 0 10px;
    margin-bottom:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  input[type=text].session-name-input::placeholder{color:#9aa0a8;text-transform:none;font-weight:500;font-size:13px;letter-spacing:normal;}
  input[type=text].session-name-input:focus{outline:none;border-bottom-color:var(--accent);}

  .session-name-row{display:flex;align-items:center;gap:10px;}
  .session-name-row .session-name-input{flex:1 1 auto;min-width:0;}
  .template-toggle-btn{
    flex:0 0 auto;
    width:38px;
    height:38px;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--accent-dim);
    background:transparent;
    color:var(--accent);
    padding:0;
    cursor:pointer;
  }
  .template-toggle-btn:active{background:var(--accent-dim);}
  .template-toggle-btn svg{display:block;width:18px;height:18px;}

  .session-meta{
    display:flex;
    gap:14px;
    color:#c7ccd3;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    margin-bottom:18px;
  }
  .session-meta b{color:var(--accent);font-weight:600;}

  /* ---------- Exercise card ---------- */
  .exercise-card{
    background-color:var(--panel);
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/exercise-card-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:var(--density-card-pad);
    margin-bottom:var(--density-card-gap);
  }
  /* This card repeats once per exercise (dense text: set rows, timestamps,
     icon buttons), so it needs a heavier darkening gradient than the
     single-block cards elsewhere, plus these targeted brightness bumps for
     the bits that have no background of their own. The image
     (images/exercise-card-bg.jpg) ships as a separate file uploaded alongside
     this index.html, not baked in. */
  .exercise-card .set-idx,
  .exercise-card .set-detail .x,
  .exercise-card .set-act-btn,
  .exercise-card .exercise-collapsed-meta .chevron,
  .exercise-card .icon-btn{
    color:#c7ccd3;
  }
  .exercise-card .set-detail .set-time{color:#dfe2e6;}
  .exercise-card .eh-title h3{color:#e4e6ea;}
  .exercise-card .exercise-head-actions .icon-btn{background:rgba(10,12,16,0.4);}
  .exercise-card .set-act-btn{
    border:1px solid var(--line);
    background:rgba(10,12,16,0.4);
  }
  /* User-selectable card background, set via Settings > Card Style. JS sets
     data-card-bg on <body> (see renderApp) to match state.settings.cardBg;
     these rules override the default images/exercise-card-bg.jpg above per choice.
     "default" needs no rule here since it's what the base rule already
     shows. "none" strips the photo back to a flat panel for anyone who'd
     rather skip it entirely. Each image ships as a separate file uploaded
     alongside this index.html, same as the base one — none are baked in. */
  body[data-card-bg="chest"] .exercise-card{
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/chest-bg.jpg');
  }
  body[data-card-bg="back"] .exercise-card{
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/back-bg.jpg');
  }
  body[data-card-bg="shoulder"] .exercise-card{
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/shoulder-bg.jpg');
  }
  body[data-card-bg="arms"] .exercise-card{
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/arms-bg.jpg');
  }
  body[data-card-bg="legs"] .exercise-card{
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/legs-bg.jpg');
  }
  body[data-card-bg="abs"] .exercise-card{
    background-image:linear-gradient(180deg, rgba(8,9,12,0.62), rgba(8,9,12,0.93)), url('images/abs-bg.jpg');
  }
  body[data-card-bg="none"] .exercise-card{
    background-image:none;
  }

  .brief-panel{

    background:transparent;
    color:var(--accent-2);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- Muscle map ---------- */
  .mm-toggle-btn{
    flex:0 0 auto;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:var(--radius);
    border:2px solid var(--accent);
    background:var(--accent-dim);
    color:var(--accent);
    padding:0;
    cursor:pointer;
  }
  .mm-toggle-btn:active{background:var(--accent);color:#1c1500;}
  .mm-toggle-btn svg{display:block;width:22px;height:22px;}

  /* ---------- Template picker (category cards -> template list) ---------- */
  .pro-panel-header-left{display:flex;align-items:center;gap:6px;min-width:0;}
  .pro-panel-header-left h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pro-panel-back{
    flex-shrink:0;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:none;
    color:var(--text-dim);
    font-size:22px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .pro-panel-back:active{color:var(--text);}
  .template-card{
    width:100%;
    text-align:left;
    display:block;
    padding:14px 16px;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    margin-bottom:10px;
  }
  .template-card:last-child{margin-bottom:0;}
  .template-card:not(.template-cat-card):active{border-color:var(--accent);background:var(--panel-3);}
  .template-divider{
    height:1px;
    background:var(--line);
    margin:0 2px 14px;
  }
  /* Category cards (step 1 of the template picker) get a photo background
     per category, via a fixed relative filename — NOT baked into this
     file as base64. The actual jpg files (images/ppl-bg.jpg, images/upper-lower-bg.jpg,
     images/full-body-bg.jpg) ship as separate assets uploaded alongside this
     index.html, in the same folder, so the relative url() below resolves.
     The gradient darkens the photo so the label/description/count stay
     readable regardless of what's busy in the underlying image. */
  .template-cat-card{
    position:relative;
    min-height:110px;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .template-cat-card:active{border-color:var(--accent);filter:brightness(1.12);}
  .template-cat-card[data-category="ppl"]{
    background-image:linear-gradient(180deg, rgba(10,12,16,0.55), rgba(10,12,16,0.88)), url('images/ppl-bg.jpg');
  }
  .template-cat-card[data-category="upperLower"]{
    background-image:linear-gradient(180deg, rgba(10,12,16,0.55), rgba(10,12,16,0.88)), url('images/upper-lower-bg.jpg');
  }
  .template-cat-card[data-category="fullBody"]{
    background-image:linear-gradient(180deg, rgba(10,12,16,0.55), rgba(10,12,16,0.88)), url('images/full-body-bg.jpg');
  }
  .template-cat-card .template-card-sub{color:#d7dae0;}
  .template-cat-card .template-card-count{color:#aab0b8;}
  .template-card-name{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--accent);
    margin-bottom:4px;
  }
  .template-card-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:2px;}
  .template-card-count{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;}

  /* ---------- Notification bell overlay ---------- */
  .notif-card{
    padding:14px 16px;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:var(--panel-2);
    margin-bottom:10px;
  }
  .notif-card:last-child{margin-bottom:0;}
  .notif-card.urgent{border-color:var(--accent-2-dim);}
  .notif-card-title{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--text);
    margin-bottom:4px;
  }
  .notif-card.urgent .notif-card-title{color:var(--accent-2);}
  .notif-card-msg{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .notif-card-actions{display:flex;gap:8px;margin-top:10px;}
  .notif-card-action{
    width:100%;
    padding:9px;
    border-radius:var(--radius-sm);
    border:none;
    background:var(--accent);
    color:#1c1500;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .notif-card-action:active{opacity:0.85;}
  .notif-card-dismiss{
    width:100%;
    padding:9px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .notif-card-dismiss:active{opacity:0.85;}
  .notif-empty{text-align:center;color:var(--text-faint);font-size:13px;padding:24px 12px;}

  /* ---------- Rest timer duration picker ---------- */
  /* Scoped to the panel's own id (not the shared .pro-panel class, which
     every other overlay — templates, notifications, pricing, etc — also
     uses) so only this one picker gets the photo background. The actual
     image (images/rest-timer-bg.jpg) ships as a separate file uploaded alongside
     this index.html, not baked in here. */
  #restTimerPickerPanel{
    background-color:var(--panel-2);
    background-image:linear-gradient(180deg, rgba(10,12,16,0.6), rgba(10,12,16,0.88)), url('images/rest-timer-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .rest-timer-picker-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:20px 0 8px;
  }
  .rest-timer-adjust-btn{
    width:46px;height:46px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#1c1500;
    font-size:22px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .rest-timer-adjust-btn:active{background:var(--accent-dim);transform:scale(0.94);}
  .rest-timer-adjust-btn:disabled{opacity:0.35;}
  .rest-timer-picker-time{
    font-family:'JetBrains Mono',monospace;
    font-size:36px;
    font-weight:700;
    color:var(--text);
    min-width:110px;
    text-align:center;
  }
  .rest-timer-picker-sub{
    text-align:center;
    font-size:11px;
    color:#c7ccd3;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding-bottom:10px;
  }
  .rest-timer-start-btn{width:100%;background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius-md);padding:17px;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;}
  .rest-timer-start-btn:active{opacity:0.9;transform:scale(0.98);}
  .rest-timer-start-btn:active{opacity:0.85;}

  /* ---------- Muscle map overlay (floating card) ---------- */
  .mm-overlay{
    position:fixed;
    inset:0;
    background:rgba(8,9,11,0.68);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:90;
  }
  .mm-overlay.hidden{display:none;}
  .mm-overlay:not(.hidden){animation:overlayBackdropIn 0.15s ease;}
  .mm-overlay:not(.hidden) .mm-overlay-panel{
    animation:overlayPanelIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .mm-overlay-panel{
    width:100%;
    max-width:460px;
    height:min(85vh, 780px);
    display:flex;
    flex-direction:column;
    background-color:var(--panel-2);
    background-image:linear-gradient(180deg, rgba(10,12,16,0.55), rgba(10,12,16,0.88)), url('images/muscle-picker-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    border:2px solid var(--accent-dim);
    border-radius:var(--radius-xl);
    padding:14px 16px 14px;
    box-shadow:0 16px 48px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  /* Scoped to this panel's own id (unique to the muscle-group picker, not
     the shared .pro-panel other overlays use). The image
     (images/muscle-picker-bg.jpg) ships as a separate file uploaded alongside
     this index.html, not baked in. Everything else in here (view tabs,
     exercise-list items, the equipment tag) already sits on its own solid
     pill background and needs no change — only the empty-state hint text
     sits directly on the photo. */
  #mmOverlayPanel .mm-list-empty{color:#c7ccd3;}
  .mm-overlay-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    flex-shrink:0;
  }
  .mm-overlay-head h2{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text);
    margin:0;
  }
  .mm-overlay-head .icon-btn{width:34px;height:34px;background:var(--panel-3);flex-shrink:0;}
  .mm-columns{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  .mm-diagram-col{
    flex:0 0 auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .mm-list-col{
    flex:1;
    min-width:0;
    min-height:0;
    margin-top:10px;
    padding-top:12px;
    border-top:1px solid var(--line);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .mm-viewtabs{
    display:flex;
    background:var(--panel-3);
    border-radius:var(--radius-sm);
    padding:3px;
    margin-bottom:6px;
    width:fit-content;
  }
  .mm-viewtabs button{
    background:none;
    border:none;
    color:var(--text-faint);
    padding:6px 12px;
    border-radius:var(--radius-xs);
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
  }
  .mm-viewtabs button.active{background:var(--accent);color:#1c1500;}
  .mm-svg-wrap{
    display:flex;
    justify-content:center;
    background:radial-gradient(ellipse 70% 65% at center, rgba(255,255,255,0.05), transparent 72%);
    border-radius:var(--radius-md);
    padding:6px 0;
  }
  .mm-svg-wrap svg{
    display:block;
    width:100%;
    max-width:130px;
    height:auto;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  }
  .mm-shape{cursor:pointer;transition:fill 0.15s ease, fill-opacity 0.15s ease, filter 0.15s ease;}
  .mm-shape:active{fill-opacity:1 !important;}
  .mm-shape.selected{filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),0.75));}
  .mm-shape-static{pointer-events:none;}
  @media (prefers-reduced-motion: reduce){
    .mm-shape{transition:none;}
  }
  .mm-list-empty{
    height:100%;
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    line-height:1.5;
    padding:0 4px;
  }
  .mm-selected-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  .mm-exercise-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .mm-exercise-item{
    width:100%;
    text-align:left;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    background:var(--panel-3);
    border:1px solid var(--line);
    color:var(--text);
    font-size:12.5px;
    line-height:1.3;
    font-family:'Inter',sans-serif;
    font-weight:500;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .mm-exercise-item-name{width:100%;white-space:normal;word-break:break-word;}
  .mm-exercise-item-eq{
    flex-shrink:0;
    background:var(--panel);
    color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:var(--radius);
  }
  .mm-exercise-item:active{background:var(--panel);border-color:var(--accent-dim);}
  .mm-exercise-item-custom{color:var(--accent);border-color:var(--accent-dim);background:transparent;}

  /* ---------- Exercise search overlay (full-screen, blurred backdrop) ----------
     Positioned absolute (not fixed) so it sizes itself against #app's own
     box — #app's height is already kept in sync with visualViewport when
     the keyboard opens (see the visualViewport.resize listener near the
     bottom of the script), so this overlay automatically stays within the
     keyboard-safe area for free, no extra scroll-into-view handling needed. */
  .ex-search-overlay{
    position:absolute;
    inset:0;
    z-index:92;
    background:rgba(14,16,19,0.82);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    animation:exSearchBackdropIn 0.22s ease;
  }
  .ex-search-overlay.hidden{display:none;}
  .ex-search-panel{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:exSearchPanelIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ex-search-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 16px 12px;
    flex-shrink:0;
  }
  .ex-search-back{
    width:36px;
    height:36px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:none;
    background:var(--panel-3);
    color:var(--text);
    cursor:pointer;
    padding:0;
  }
  .ex-search-back svg{display:block;}
  .ex-search-back:active{background:var(--panel-2);transform:scale(0.94);}
  .ex-search-input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1.5px solid var(--accent-dim);
    color:var(--text);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .ex-search-input:focus{outline:none;border-color:var(--accent);}
  .ex-suggest-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:4px 16px calc(20px + var(--safe-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .ex-suggest-list.hidden{display:none;}
  .ex-suggest-item{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    text-align:left;
    background:var(--panel-3);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    padding:13px 14px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .ex-suggest-item:active{background:var(--panel);border-color:var(--accent-dim);}
  .ex-suggest-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ex-suggest-tag{
    flex-shrink:0;
    background:var(--panel);
    color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:var(--radius);
  }
  .ex-suggest-custom{
    width:100%;
    text-align:left;
    background:transparent;
    border:1.5px dashed var(--accent-dim);
    color:var(--accent);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    padding:13px 14px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .ex-suggest-custom:active{background:var(--accent-dim);}

  /* ---------- Exercise-search filter (muscle group / equipment) ---------- */
  .ex-search-filter{
    width:36px;
    height:36px;
    flex-shrink:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:none;
    background:var(--panel-3);
    color:var(--text);
    cursor:pointer;
    padding:0;
  }
  .ex-search-filter svg{display:block;}
  .ex-search-filter:active{background:var(--panel-2);transform:scale(0.94);}
  .ex-search-filter.active{background:var(--accent-dim);color:var(--accent);}
  .ex-filter-dot{
    position:absolute;
    top:4px;
    right:4px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent);
    border:1.5px solid var(--panel-3);
  }
  .ex-filter-panel{
    flex-shrink:0;
    padding:0 16px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    animation:exSearchBackdropIn 0.18s ease;
  }
  .ex-filter-panel.hidden{display:none;}
  .ex-filter-row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:4px;
  }
  .ex-filter-row-head:first-child{margin-top:0;}
  .eq-guide-btn{
    width:20px;height:20px;
    border-radius:50%;
    border:1px solid var(--accent-dim);
    background:none;
    color:var(--accent);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    margin-left:auto;
  }
  .eq-guide-btn:active{background:var(--accent-dim);}
  .eq-guide-panel img{width:100%;display:block;border-radius:var(--radius-sm);}
  .ex-filter-row-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .ex-filter-clear{
    background:none;
    border:none;
    color:var(--accent);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:2px 0;
  }
  .ex-filter-chips{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .ex-filter-chip{
    background:var(--panel-3);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:var(--radius-xl);
    cursor:pointer;
  }
  .ex-filter-chip.active{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:var(--accent);
  }
  .ex-filter-chip:active{transform:scale(0.96);}
  .ex-filter-empty{
    padding:34px 10px;
    text-align:center;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
    font-size:13px;
  }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--text-faint);
  }
  .empty .glyph{margin-bottom:10px;opacity:0.6;display:flex;justify-content:center;}
  .empty .glyph svg{width:32px;height:32px;}
  .empty p{font-size:13px;line-height:1.6;margin:0;}

  /* ---------- History ---------- */
  .history-search-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius);
    padding:12px;
    font-size:16px;
    margin-bottom:14px;
  }
  .history-search-input:focus{outline:none;border-color:var(--accent);}
  .history-no-match{
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    padding:24px 0;
  }
  .history-no-match.hidden{display:none;}
  .history-item.hidden{display:none;}
  .history-item{
    background-color:var(--panel);
    background-image:linear-gradient(180deg, rgba(28,31,36,0.90), rgba(28,31,36,0.96)), url('images/history-bg.jpg');
    background-size:cover;
    background-position:top center;
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .history-item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 14px;
    cursor:pointer;
  }
  .history-item-head .hi-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .history-item-head .hi-name{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .hi-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .history-item-head-editing{cursor:default;}
  .hi-rename-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
  }
  .hi-name-input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--accent-dim);
    color:var(--text);
    border-radius:7px;
    padding:9px 10px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .hi-name-input:focus{outline:none;border-color:var(--accent);}
  .history-item-head .hi-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:#a9aeb5;
  }
  .hi-duration{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .hi-duration-bar{
    width:52px;
    height:4px;
    border-radius:2px;
    background:var(--panel-3);
    overflow:hidden;
    flex-shrink:0;
  }
  .hi-duration-fill{height:100%;background:var(--accent);border-radius:2px;}
  .hi-duration-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:#a9aeb5;
    white-space:nowrap;
  }
  .set-time{color:#a9aeb5;font-size:0.85em;}
  .history-item-head .hi-stats{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    text-align:right;
  }
  .history-item-body{
    padding:0 14px 14px;
    border-top:1px solid var(--line);
  }
  .hi-ex{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 0;}
  .hi-ex:not(:first-child){border-top:1px solid var(--line);margin-top:10px;padding-top:14px;}
  .hi-ex-main{min-width:0;flex:1;}
  .hi-ex-name{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:4px;}
  .hi-ex-sets{font-family:'JetBrains Mono',monospace;font-size:12px;color:#a9aeb5;line-height:1.7;}
  .hi-ex-sets .pr-tag{margin-left:6px;}
  .hi-tip-btn{
    width:26px;
    height:26px;
    flex-shrink:0;
    border-radius:var(--radius-sm);
    background:rgba(var(--accent-rgb),0.12);
    border:1px solid var(--accent-dim);
    color:var(--accent);
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    position:relative;
  }
  .hi-tip-btn:active{background:rgba(var(--accent-rgb),0.24);}
  .hi-tip-btn.locked{color:var(--text-faint);border-color:var(--line);background:var(--panel);}
  .hi-tip-btn.locked::after{
    content:'\1F512';
    position:absolute;
    bottom:-4px;
    right:-4px;
    font-size:7px;
    background:var(--panel-2);
    border-radius:50%;
    width:12px;
    height:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .ex-tip-panel-ex{font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;color:var(--text);text-transform:uppercase;letter-spacing:0.02em;margin-bottom:2px;}
  .ex-tip-panel-last{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-faint);margin-bottom:12px;}
  .ex-tip-panel-empty{font-size:12.5px;color:var(--text-faint);line-height:1.5;padding:4px 0;}
  /* Scoped to the panel's own id (not the shared .pro-panel class other
     overlays also use) so only the Tips/Target popup gets the photo
     background. The image (images/tips-target-bg.jpg) ships as a separate file
     uploaded alongside this index.html, not baked in. The tip callout box
     (.prc-tip) is switched from its usual translucent accent tint to a
     solid dark card here specifically, since it's the main thing the
     person needs to read on this screen — everything else just gets its
     text brightened enough to hold up against the photo. */
  #exTipPanel{
    background-color:var(--panel-2);
    background-image:linear-gradient(180deg, rgba(10,12,16,0.6), rgba(10,12,16,0.88)), url('images/tips-target-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  #exTipPanel .ex-tip-panel-last{color:#c7ccd3;}
  #exTipPanel .ex-tip-panel-empty{color:#c7ccd3;}
  #exTipPanel .prc-tip{background:#2b2620;}
  #exTipPanel .prc-tip{color:#d7dae0;}
  #exTipPanel .prc-tip-badge{background:#332a16;border-color:var(--accent-dim);}
  #exTipPanel .pro-panel-close{color:#c7ccd3;}
  .hi-delete{
    margin-top:0;
    background:none;
    border:none;
    color:var(--accent-2);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px 0;
  }
  .hi-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:12px;gap:8px;}
  .hi-menu-btn{
    border:1px solid var(--line);
    width:28px;
    height:28px;
    font-size:16px;
  }
  .hi-print,.hi-edit,.hi-repeat{
    background:none;
    border:1px solid var(--line);
    color:var(--accent);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    padding:7px 12px;
    border-radius:var(--radius-sm);
  }
  .hi-print:active,.hi-edit:active,.hi-repeat:active{background:var(--panel-3);}
  .hi-print-pro{
    background:linear-gradient(135deg, var(--accent), #d9971f);
    border:1px solid var(--accent-dim);
    color:#1c1500;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    padding:7px 12px;
    border-radius:var(--radius-sm);
  }
  .hi-print-pro:active{opacity:0.88;}

  /* ---------- Print receipt ---------- */
  .print-receipt{display:none;}
  @media print{
    body > *:not(#printReceipt){display:none !important;}
    #printReceipt{display:block !important;}
    @page{margin:10mm;}
  }
  .print-receipt{
    background:#fff;
    color:#000;
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:12px;
    width:280px;
    margin:0 auto;
    padding:0;
  }
  .print-receipt .pr-brand{
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .print-receipt .pr-brand .pr-brand-accent{color:#b8860b;}
  .print-receipt .pr-tagline{
    text-align:center;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#b8860b;
    margin-bottom:10px;
  }
  .print-receipt .pr-line{border-top:1px dashed #b8860b;margin:8px 0;}
  .print-receipt .pr-row{display:flex;justify-content:space-between;gap:8px;}
  .print-receipt .pr-session-name{font-weight:700;text-transform:uppercase;}
  .print-receipt .pr-ex-name{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:11px;}
  .print-receipt .pr-ex-muscle{font-weight:400;text-transform:none;color:#000;}
  .print-receipt .pr-set{display:flex;justify-content:space-between;padding-left:6px;}
  .print-receipt .pr-set .pr-pr{font-weight:700;color:#b8860b;}
  .print-receipt .pr-footer{text-align:center;font-size:10px;margin-top:14px;letter-spacing:0.04em;color:#b8860b;}

  /* ---------- Print receipt: PRO (modern layout, printed) ---------- */
  .print-receipt.pro{
    font-family:'Inter',sans-serif;
    font-size:11px;
    width:520px;
    padding:0;
  }
  .print-receipt.pro .prc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #14161a;padding-bottom:8px;margin-bottom:10px;}
  .print-receipt.pro .prc-brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.04em;text-transform:uppercase;color:#14161a;}
  .print-receipt.pro .prc-brand-accent{color:#c99a2e;}
  .print-receipt.pro .prc-badge{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;background:#14161a;color:#f2b134;padding:3px 9px;border-radius:var(--radius-xl);}
  .print-receipt.pro .prc-meta{display:flex;justify-content:space-between;font-size:10.5px;color:#666;margin-bottom:12px;}
  .print-receipt.pro .prc-stats{display:flex;gap:8px;margin-bottom:12px;}
  .print-receipt.pro .prc-stat{flex:1;border:1px solid #ddd;border-radius:var(--radius-sm);padding:7px 10px;}
  .print-receipt.pro .prc-stat-label{font-size:8.5px;text-transform:uppercase;letter-spacing:0.06em;color:#888;}
  .print-receipt.pro .prc-stat-value{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:#14161a;}
  .print-receipt.pro .prc-ex{border:1px solid #e2e2e2;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:7px;page-break-inside:avoid;}
  .print-receipt.pro .prc-ex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px;}
  .print-receipt.pro .prc-ex-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;color:#14161a;}
  .print-receipt.pro .prc-ex-muscle{font-size:9.5px;color:#888;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
  .print-receipt.pro .prc-set{display:flex;justify-content:space-between;font-size:10.5px;padding:2px 0;border-bottom:1px solid #f4f4f4;color:#222;}
  .print-receipt.pro .prc-set-time{color:#999;font-size:9.5px;margin-right:6px;}
  .print-receipt.pro .prc-pr{color:#c99a2e;font-weight:700;}
  .print-receipt.pro .prc-tip{margin-top:5px;padding:7px 9px;background:#f7f4ea;border-left:3px solid #c99a2e;font-size:10px;color:#444;border-radius:0 6px 6px 0;}
  .print-receipt.pro .prc-tip b{color:#14161a;}
  .print-receipt.pro .prc-tip.compact{padding:5px 8px;font-size:9.5px;line-height:1.35;}
  .print-receipt.pro .prc-tip-target{margin-top:4px;font-weight:700;color:#c99a2e;font-size:9.5px;text-transform:uppercase;letter-spacing:0.03em;}
  .print-receipt.pro .prc-footer{text-align:center;font-size:9.5px;color:#999;margin-top:10px;letter-spacing:0.04em;}

  /* ---------- Pro receipt overlay (on-screen preview + paywall) ---------- */
  .pro-panel{
    width:100%;
    max-width:440px;
    max-height:84vh;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:0 16px 48px rgba(0,0,0,0.55);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .pro-panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;flex-shrink:0;gap:10px;}
  .pro-panel-header h3{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--text);
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .pro-panel-badge{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:var(--accent);color:#1c1500;padding:2px 8px;border-radius:var(--radius-xl);flex-shrink:0;}
  .pro-panel-close{background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0;}
  .pro-panel-close:active{color:var(--text);}
  .pro-panel-sub{padding:0 18px 12px;font-size:11.5px;color:var(--text-faint);border-bottom:1px solid var(--line);}
  .pro-panel-body{padding:14px 18px;overflow-y:auto;flex:1;}
  .pro-panel-footer{padding:14px 18px;border-top:1px solid var(--line);flex-shrink:0;}
  .pro-print-btn{width:100%;background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius);padding:12px;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;}
  .pro-print-btn:active{opacity:0.9;}

  /* ---------- Print menu overlay (choose PDF vs PDF Pro) ---------- */
  .print-menu-panel{max-width:340px;}
  .print-menu-body{padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px;}
  .print-menu-option{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;font-family:inherit;cursor:pointer;color:var(--text);}
  .print-menu-option:active{background:var(--panel-3);}
  .print-menu-option .pmo-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center;}
  .print-menu-option .pmo-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .print-menu-option .pmo-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;}
  .print-menu-option .pmo-sub{font-size:11px;color:var(--text-faint);}
  .print-menu-option.pro .pmo-title{color:var(--accent);}

  /* shared receipt-content classes, styled for the dark on-screen preview */
  .pro-panel-body .prc-stats{display:flex;gap:8px;margin-bottom:14px;}
  .pro-panel-body .prc-stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center;}
  .pro-panel-body .prc-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);}
  .pro-panel-body .prc-stat-value{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-top:2px;}
  .pro-panel-body .prc-ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;}
  .pro-panel-body .prc-ex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;}
  .pro-panel-body .prc-ex-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;color:var(--text);text-transform:uppercase;}
  .pro-panel-body .prc-ex-muscle{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
  .pro-panel-body .prc-set{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);padding:2px 0;gap:8px;}
  .pro-panel-body .prc-set-time{color:var(--text-faint);font-size:10.5px;margin-right:6px;}
  .pro-panel-body .prc-pr{color:var(--accent);font-weight:700;}
  .pro-panel-body .prc-tip{margin-top:8px;padding:9px 10px;background:rgba(var(--accent-rgb),0.08);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:11.5px;color:var(--text-dim);line-height:1.5;}
  .pro-panel-body .prc-tip b{color:var(--text);}
  .pro-panel-body .prc-tip-target{margin-top:5px;font-weight:700;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;}
  .pro-panel-body .prc-tip-badge{
    margin-top:8px;
    padding:9px 10px;
    background:rgba(var(--accent-rgb),0.14);
    border:1px solid var(--accent-dim);
    border-radius:var(--radius-sm);
    font-size:11.5px;
    font-weight:700;
    color:var(--accent);
  }

  /* ---------- Pro paywall ---------- */
  .paywall-body{padding:6px 20px 22px;text-align:center;}
  .paywall-icon{font-size:34px;margin-bottom:8px;}
  .paywall-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .paywall-sub{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:16px;}
  .paywall-features{text-align:left;list-style:none;padding:0;margin:0 0 18px;}
  .paywall-features li{font-size:12.5px;color:var(--text-dim);padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;}
  .paywall-features li:last-child{border-bottom:none;}
  .paywall-features li .chk{color:var(--accent);flex-shrink:0;}
  .paywall-price{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:12px;}
  .paywall-price span{font-size:11px;color:var(--text-faint);font-weight:400;}
  .paywall-unlock-btn{width:100%;background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius);padding:13px;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;margin-bottom:8px;}
  .paywall-unlock-btn:active{opacity:0.9;}
  .paywall-note{font-size:10.5px;color:var(--text-faint);}

  /* ---------- Gold "PRO" panel button (topbar) ---------- */
  .pro-star-btn{
    width:auto;height:32px;min-width:44px;border-radius:var(--radius-sm);
    background:var(--panel-2);border:1px solid var(--line);
    padding:0 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--text-faint);
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;
  }
  .pro-star-btn:active{background:var(--panel-3);}
  .pro-star-btn.is-pro{color:#1c1500;background:var(--accent);border-color:var(--accent);}
  .notif-bell-btn{
    position:relative;
    width:32px;height:32px;border-radius:var(--radius-sm);
    background:var(--panel-2);border:1px solid var(--line);
    padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--text-dim);
  }
  .notif-bell-btn:active{background:var(--panel-3);}
  .notif-bell-btn svg{display:block;width:17px;height:17px;}
  #restTimerHeaderBtn{background:var(--accent);border-color:var(--accent);color:#1c1500;}
  #restTimerHeaderBtn:active{opacity:0.85;}
  .notif-bell-dot{
    position:absolute;top:5px;right:6px;
    width:8px;height:8px;border-radius:50%;
    background:var(--accent-2);border:1.5px solid var(--bg);
  }
  .pro-badge-mini{
    display:inline-block;font-size:9px;font-weight:700;letter-spacing:0.08em;
    text-transform:uppercase;background:var(--accent);color:#1c1500;
    padding:2px 7px;border-radius:var(--radius-xl);margin-left:6px;vertical-align:middle;
  }
  .dev-badge{
    display:inline-block;font-size:8px;font-weight:700;letter-spacing:0.08em;
    text-transform:uppercase;background:var(--panel-3);color:var(--text-dim);
    padding:2px 6px;border-radius:var(--radius-xl);margin-left:6px;vertical-align:middle;border:1px solid var(--line);
  }

  /* ---------- Trial banner ---------- */
  .trial-banner{
    display:flex;align-items:center;gap:8px;padding:9px 16px;
    background:rgba(var(--accent-rgb),0.10);border-bottom:1px solid var(--accent-dim);
    font-size:12px;color:var(--text-dim);
  }
  .trial-banner.hidden{display:none;}
  .trial-banner.trial-banner-ended{
    background:rgba(193,68,60,0.12);border-bottom-color:var(--accent-2);
  }
  .trial-banner.trial-banner-ended .trial-banner-star{color:var(--accent-2);}
  .trial-banner.trial-banner-ended .trial-banner-cta{background:var(--accent-2);color:#fff;}
  .trial-banner-star{color:var(--accent);font-size:13px;flex-shrink:0;}
  .trial-banner-text{flex:1;min-width:0;}
  .trial-banner-text b{color:var(--text);}
  .trial-banner-cta{
    background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius-xl);
    padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:0.03em;
    text-transform:uppercase;cursor:pointer;flex-shrink:0;font-family:'Oswald',sans-serif;
  }
  .editing-past-banner{
    flex-shrink:0;
    display:flex;align-items:center;gap:8px;padding:10px 16px;
    border-top:1px solid var(--accent-dim);
    background:rgba(var(--accent-rgb),0.10);
    font-size:12px;color:var(--text-dim);line-height:1.4;
  }
  .editing-past-banner.hidden{display:none;}
  .editing-past-banner-icon{color:var(--accent);font-size:14px;flex-shrink:0;}
  .editing-past-banner-text b{color:var(--text);}

  /* ---------- Pricing modal ---------- */
  /* Scoped to .pricing-panel (the Go Pro modal's own class, distinct from
     the shared .pro-panel every other overlay also uses) so only this
     modal gets the photo background. The image (images/go-pro-bg.jpg) ships as
     a separate file uploaded alongside this index.html, not baked in. A
     few text bits that sit directly on the panel (not on their own solid
     card) get brightened here too, so they stay readable over the photo —
     everything else (price cards, billing toggle, trial card) already
     has its own solid/tinted background and needs no change. */
  .pricing-panel{
    background-color:var(--panel-2);
    background-image:linear-gradient(180deg, rgba(10,12,16,0.62), rgba(10,12,16,0.9)), url('images/go-pro-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .pricing-panel .paywall-features li{color:#d7dae0;}
  .pricing-panel .trial-offer-divider{color:#c7ccd3;}
  .pricing-panel .paywall-note{color:#c7ccd3;}
  .pricing-panel .paywall-sub{color:#d7dae0;}
  .pricing-body{padding:6px 20px 22px;overflow-y:auto;overflow-x:hidden;flex:1;-webkit-overflow-scrolling:touch;}
  .billing-toggle{

    padding:4px;margin:14px 0 18px;position:relative;

  }
  .billing-toggle button.active{color:#1c1500;}
  .billing-toggle::before{
    content:'';position:absolute;top:4px;bottom:4px;left:4px;
    width:calc(33.333% - 5.333px);background:var(--accent);border-radius:var(--radius-pill);
    transition:transform 0.22s cubic-bezier(0.22,0.61,0.36,1);z-index:0;
  }
  .billing-toggle.monthly::before{transform:translateX(100%);}
  .billing-toggle.annual::before{transform:translateX(200%);}
  .bt-save{
    position:absolute;top:-9px;right:6px;background:var(--accent-2);color:#fff;
    font-size:9px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:2px 7px;border-radius:var(--radius-xl);pointer-events:none;z-index:2;
  }
  .price-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:18px;text-align:center;margin-bottom:14px;position:relative;
  }
  .price-card.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .price-savings-badge{
    display:inline-block;background:var(--accent);color:#1c1500;
    font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
    padding:4px 10px;border-radius:var(--radius-xl);margin-bottom:10px;
  }
  .price-card-amount{font-family:'Oswald',sans-serif;font-size:32px;font-weight:800;color:var(--text);}
  .price-card-amount span{font-size:13px;font-weight:500;color:var(--text-faint);}
  .price-card-sub{font-size:11.5px;color:var(--text-faint);margin:4px 0 16px;}
  .price-cta-btn{
    width:100%;background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius);
    padding:14px;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;
  }
