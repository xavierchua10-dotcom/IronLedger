  /* =========================================================
     GUIDED TOUR — replaces the old Q&A-chat Help panel with a
     step-by-step walkthrough that spotlights real UI elements and
     explains them in a speech-bubble, switching tabs as needed.
     Steps that target something which may not exist yet for a
     brand-new account (a history entry, a progress chart, etc) fall
     back to a stable container element (see `fallback`) so the tour
     never breaks for someone with an empty account — exactly the
     person who most needs it.
     ========================================================= */
  var TOUR_STEPS = [
    { tab: 'log', selector: '.template-toggle-btn', fallback: '#view', title: 'Start from a template', text: 'New here? Tap this to load a pre-built routine \u2014 Push Day, Legs, Full Body, and more \u2014 instead of adding exercises one by one.' },
    { tab: 'log', selector: '[data-action="add-blank-exercise"]', title: 'Add an exercise', text: 'Tap here to add an exercise \u2014 search by name, or browse the full library grouped by muscle.' },
    { tab: 'log', selector: '.mm-toggle-btn', title: 'Browse by muscle', text: 'Prefer to browse? This opens a body diagram \u2014 tap a muscle group to see matching exercises.' },
    { tab: 'log', selector: '#restTimerHeaderBtn', title: 'Rest timer', text: 'Start a rest timer between sets. It keeps counting down even if you switch tabs.' },
    { tab: 'log', selector: '#notifBellBtn', title: 'Notifications', text: 'Trial status, reminders, and other updates show up here.' },
    { tab: 'history', selector: '#historySearchInput', fallback: '#view', title: 'History', text: 'Every finished session lands here. Tap the \u22ee on any session to edit, repeat, or delete it.' },
    { tab: 'progress', selector: '.progress-select', fallback: '#view', title: 'Progress', text: 'Track your estimated 1-rep max and trend over time for any exercise you\u2019ve logged.' },
    { tab: 'settings', selector: '[data-action="open-bodyweight-picker"]', fallback: '#view', title: 'Bodyweight & goal', text: 'Set these once \u2014 they power real load tracking on bodyweight exercises and shape how Pro Tips suggests your next set.' },
    { tab: 'settings', selector: '.accent-theme-picker', fallback: '#view', title: 'Accent color', text: 'Not feeling gold? Pick a different accent color \u2014 it applies throughout the whole app.' },
    { tab: 'settings', selector: '.card-bg-picker', fallback: '#view', title: 'Card style', text: 'Pick a background photo for your exercise cards \u2014 or turn it off for a plain look.' },
    { tab: 'settings', selector: '.settings-row .seg', fallback: '#view', title: 'Units', text: 'Switch between kg and lb any time. Your data\u2019s always stored in kg internally, so nothing\u2019s lost switching back and forth.' }
  ];

  function startTour(){
    ui.tourStep = 0;
    renderTourStep();
  }
  function endTour(){
    ui.tourStep = null;
    renderTourStep();
  }
  function tourNext(){
    if (ui.tourStep === null) return;
    if (ui.tourStep >= TOUR_STEPS.length - 1){ endTour(); return; }
    ui.tourStep++;
    renderTourStep();
  }
  function tourBack(){
    if (ui.tourStep === null || ui.tourStep === 0) return;
    ui.tourStep--;
    renderTourStep();
  }
  function findTourTarget(step){
    var el = document.querySelector(step.selector);
    if (el) return el;
    return step.fallback ? document.querySelector(step.fallback) : null;
  }
  // Positions the small "ring" element exactly over the target so its
  // oversized box-shadow (0 0 0 9999px) reads as a dimmed backdrop with a
  // cutout — a single element, no SVG mask needed. A separate full-screen
  // #tourBackdrop (transparent, pointer-events:auto) sits behind it to
  // catch taps so the tour can't be knocked off course by accidentally
  // hitting real controls underneath; the ring itself is pointer-events:none
  // so it's purely visual. If there's no target at all, the ring hides and
  // the bubble just centers on screen.
  function positionTourBubble(targetEl){
    var ring = document.getElementById('tourSpotlight');
    var bubble = document.getElementById('tourBubble');
    if (!targetEl){
      ring.classList.add('hidden');
      bubble.classList.add('tour-bubble-centered');
      bubble.style.top = ''; bubble.style.left = ''; bubble.style.bottom = '';
      return;
    }
    bubble.classList.remove('tour-bubble-centered');
    var rect = targetEl.getBoundingClientRect();
    var pad = 6;
    ring.classList.remove('hidden');
    ring.style.top = (rect.top - pad) + 'px';
    ring.style.left = (rect.left - pad) + 'px';
    ring.style.width = (rect.width + pad * 2) + 'px';
    ring.style.height = (rect.height + pad * 2) + 'px';

    var bubbleWidth = Math.min(300, window.innerWidth - 24);
    bubble.style.width = bubbleWidth + 'px';
    var left = Math.min(Math.max(12, rect.left), window.innerWidth - 12 - bubbleWidth);
    bubble.style.left = left + 'px';

    // Always computed as a `top` value (never `bottom`) specifically so it
    // can be clamped in one place — a safety net on top of the
    // scrollIntoView call in renderTourStep, in case a target's rect is
    // ever off-screen for some other reason (e.g. a very short viewport).
    // estBubbleHeight is a rough guess since the bubble isn't laid out at
    // measurement time; the clamp only needs to be in the right ballpark
    // to keep it fully on-screen, not pixel-exact.
    var estBubbleHeight = 170;
    var spaceBelow = window.innerHeight - rect.bottom;
    var spaceAbove = rect.top;
    var top = (spaceBelow >= 150 || spaceBelow >= spaceAbove)
      ? rect.bottom + 14
      : rect.top - estBubbleHeight - 14;
    top = Math.max(12, Math.min(top, window.innerHeight - estBubbleHeight - 12));
    bubble.style.top = top + 'px';
    bubble.style.bottom = 'auto';
  }
  function renderTourStep(){
    var backdrop = document.getElementById('tourBackdrop');
    var ring = document.getElementById('tourSpotlight');
    var bubble = document.getElementById('tourBubble');
    if (!backdrop || !ring || !bubble) return;
    if (ui.tourStep === null){
      backdrop.classList.add('hidden');
      ring.classList.add('hidden');
      bubble.classList.add('hidden');
      bubble.innerHTML = '';
      return;
    }
    var step = TOUR_STEPS[ui.tourStep];
    var needsTabSwitch = state.tab !== step.tab;
    if (needsTabSwitch){
      state.tab = step.tab;
      renderApp();
    }
    backdrop.classList.remove('hidden');
    bubble.classList.remove('hidden');
    bubble.innerHTML =
      '<div class="tour-bubble-head">' +
        '<div class="tour-bubble-title">'+esc(step.title)+'</div>' +
        '<button type="button" class="tour-bubble-close" data-action="tour-skip" aria-label="End tour">&#10005;</button>' +
      '</div>' +
      '<div class="tour-bubble-text">'+esc(step.text)+'</div>' +
      '<div class="tour-bubble-footer">' +
        '<span class="tour-bubble-progress">'+(ui.tourStep + 1)+' / '+TOUR_STEPS.length+'</span>' +
        '<div class="tour-bubble-actions">' +
          (ui.tourStep > 0 ? '<button type="button" class="tour-btn" data-action="tour-back">Back</button>' : '') +
          '<button type="button" class="tour-btn primary" data-action="tour-next">'+(ui.tourStep === TOUR_STEPS.length - 1 ? 'Done' : 'Next')+'</button>' +
        '</div>' +
      '</div>';
    // Deferred a frame so a just-triggered tab switch has finished
    // painting before we touch the target. If the target sits further
    // down a scrollable tab (Card Style, for instance, is well below the
    // fold on Settings), its rect would otherwise come back way outside
    // the viewport and the top/bottom math below would push the bubble
    // off-screen entirely — so scroll it into view first, then wait one
    // more frame for that scroll to actually land before measuring.
    requestAnimationFrame(function(){
      var targetEl = findTourTarget(step);
      if (targetEl && targetEl.id !== 'view'){
        targetEl.scrollIntoView({ block: 'center', behavior: 'instant' });
      }
      requestAnimationFrame(function(){
        positionTourBubble(findTourTarget(step));
      });
    });
  }
  window.addEventListener('resize', function(){
    if (ui.tourStep === null) return;
    positionTourBubble(findTourTarget(TOUR_STEPS[ui.tourStep]));
  });

  function exportData(){
    var payload = { sessions: state.sessions, routines: state.routines, settings: state.settings, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'saviorfit-logger-backup-' + stamp + '.json';
    document.body.appendChild(a);

    URL.revokeObjectURL(url);

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if (!data.sessions || !Array.isArray(data.sessions)) throw new Error('bad format');
        state.sessions = data.sessions;
        if (data.routines && Array.isArray(data.routines)) state.routines = data.routines;
        if (data.settings) state.settings = data.settings;
        saveSessions();
        saveRoutines();
        saveSettings();
        showToast('Backup restored');
        renderApp();
      }catch(err){
        showToast('Could not read that file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // Hide the tab bar and Finish Session bar while the on-screen keyboard
  // is actually covering the screen — not just "an input is focused".
  // Those aren't the same thing on mobile: a field can stay focused after
  // the keyboard's been dismissed (tapped away, back-gesture, etc), and
  // tying this to focus alone left the tab bar gone with nothing actually
  // covering it. window.visualViewport reports the real visible height,
  // which shrinks when the keyboard opens and recovers when it closes,
  // regardless of focus — so that's what actually drives this now. The
  // top header is deliberately left alone (see convo) — it's not in the
  // cramped zone next to the keyboard, and hiding it would block quick
  // access to the rest timer/notifications mid-type. Uses its own class
  // (not .hidden) so it doesn't fight with the render-driven show/hide
  // logic tied to session state.
  var KB_HIDE_TARGETS = ['sessionFinishBar', 'editingPastBanner'];
  var KB_HIDE_TARGET_SELECTORS = ['.tabbar'];
  function setKbHide(on){
    KB_HIDE_TARGETS.forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.classList.toggle('kb-hide', on);
    });
    KB_HIDE_TARGET_SELECTORS.forEach(function(sel){
      var el = document.querySelector(sel);
      if (el) el.classList.toggle('kb-hide', on);
    });
  }
  if (window.visualViewport){
    var updateKbHideFromViewport = function(){
      var active = document.activeElement;
      var inputFocused = !!(active && active.matches && active.matches('input, textarea'));
      // Threshold well above normal browser-chrome fluctuation (the URL
      // bar collapsing/expanding is usually ~50-60px) but comfortably
      // below any real keyboard's height (~250px+), so this reliably
      // means "keyboard is open" rather than just "page scrolled".
      var shrink = window.innerHeight - window.visualViewport.height;
      setKbHide(inputFocused && shrink > 150);
    };
    window.visualViewport.addEventListener('resize', updateKbHideFromViewport);
    document.addEventListener('focusout', function(e){
      if (e.target.matches && e.target.matches('input, textarea')){
        setTimeout(updateKbHideFromViewport, 60);
      }
    });
  } else {
    // Fallback for browsers without visualViewport support: back to the
    // focus-only heuristic, which is imperfect but better than nothing.
    document.addEventListener('focusin', function(e){
      if (e.target.matches && e.target.matches('input, textarea')) setKbHide(true);
    });
    document.addEventListener('focusout', function(e){
      if (e.target.matches && e.target.matches('input, textarea')){
        setTimeout(function(){
          var active = document.activeElement;
          if (!active || !(active.matches && active.matches('input, textarea'))) setKbHide(false);
        }, 60);
      }
    });
  }

        saveExerciseName(m.exId, m.name);

      else if (m && m.kind === 'start-routine') startRoutine(m.routineId);
      else if (m && m.kind === 'start-template') applyTemplate(m.templateKey);
      else if (m && m.kind === 'routine') deleteRoutine(m.routineId);
      else if (m && m.kind === 'clear-data') clearAllData();
      else if (m && m.kind === 'clear-brief') clearBrief();
      else if (m && m.kind === 'brief-entry') deleteBriefEntry(m.entryId);
      else if (m && m.kind === 'reset-log') resetLog();
      else if (m && m.kind === 'logout') logOut();
      else if (m && m.kind === 'delete-account') openDeleteAccountPasswordConfirm();
      else if (m && m.kind === 'add-set-global'){
        var session = getActiveSession();
        var ex = findExercise(session, m.exId);
        ui.expandedAddSet[m.exId] = false;
        if (ex) commitSet(ex, m.weightKg, m.reps);
      }
      else if (m && m.kind === 'edit-set-confirm'){
        applySetEdit(m.exId, m.setId, m.weightKg, m.reps);
      }
      else if (m && m.kind === 'edit-set-open-confirm'){
        editSet(m.exId, m.setId);
      }
      else if (m && m.kind === 'rename-exercise-confirm'){
        editExerciseName(m.exId);
      }
      else if (m && m.kind === 'toggle-unit'){
        state.settings.unit = state.settings.unit === 'kg' ? 'lb' : 'kg';
        saveSettings();
        renderApp();
      }
      else if (m && m.kind === 'rename-session-confirm'){
        editHistoryName(m.sessionId);
      }
      else if (m && m.kind === 'open-add-set-confirm'){
        openAddSetPanel(m.exId);
      }
      else if (m && m.kind === 'discard-set-entry'){
        closeAddSetPanel(m.exId);
      }
      else renderApp();
    }
  });
  var routineNameOverlayEl = document.getElementById('routineNameOverlay');
  routineNameOverlayEl.addEventListener('click', function(e){
    if (e.target === routineNameOverlayEl){
      cancelSaveRoutine();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'cancel-save-routine') cancelSaveRoutine();
    else if (el.dataset.action === 'confirm-save-routine') confirmSaveRoutine();
  });
  routineNameOverlayEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.id === 'routineNameInput'){
      e.preventDefault();
      confirmSaveRoutine();
    }
  });

  var deletePasswordOverlayEl = document.getElementById('deletePasswordOverlay');
  deletePasswordOverlayEl.addEventListener('click', function(e){
    if (e.target === deletePasswordOverlayEl){
      if (!ui.deleteAccountPasswordBusy) cancelDeleteAccountPasswordConfirm();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'cancel-delete-password') cancelDeleteAccountPasswordConfirm();
    else if (el.dataset.action === 'confirm-delete-password') submitDeleteAccountPasswordConfirm();
  });
  deletePasswordOverlayEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.id === 'deletePasswordInput'){
      e.preventDefault();
      submitDeleteAccountPasswordConfirm();
    }
  });

  // Tapping the dimmed backdrop during the tour does nothing (by design —
  // see positionTourBubble's comment on why stray taps are blocked rather
  // than passed through), so no listener is needed here beyond what the
  // bubble's own Back/Next/Skip buttons already handle via the main
  // delegated click handler above.

  var briefOverlayEl = document.getElementById('briefOverlay');
  briefOverlayEl.addEventListener('click', function(e){
    if (e.target === briefOverlayEl){
      closeBrief();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-brief') closeBrief();
    else if (el.dataset.action === 'delete-brief-entry') confirmDeleteBriefEntry(el.dataset.entry);
    else if (el.dataset.action === 'open-pricing'){
      closeBrief();
      openPricing();
    }
    else if (el.dataset.action === 'clear-brief'){
      ui.confirmModal = {
        kind: 'clear-brief',
        title: 'Clear the Brief?',
        message: 'This erases every entry in the activity log. Your sessions, exercises, and History are untouched \u2014 this only clears the Brief itself.',
        confirmLabel: 'Clear all',
        variant: 'danger'
      };
      renderConfirmModal();
    }
  });

  var proOverlayEl = document.getElementById('proOverlay');
  proOverlayEl.addEventListener('click', function(e){
    if (e.target === proOverlayEl){
      closeProReceipt();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-pro-receipt'){
      closeProReceipt();
    } else if (el.dataset.action === 'print-pro-receipt'){
      printSessionReceiptPro(el.dataset.session);
    } else if (el.dataset.action === 'open-pricing'){
      closeProReceipt();
      openPricing();
    }
  });

  var pricingOverlayEl = document.getElementById('pricingOverlay');
  pricingOverlayEl.addEventListener('click', function(e){
    if (e.target === pricingOverlayEl){
      closePricing();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-pricing'){
      closePricing();
    } else if (el.dataset.action === 'guest-signup-prompt'){
      promptGuestSignUp();
    } else if (el.dataset.action === 'set-billing-cycle'){
      var c = el.dataset.cycle;
      ui.billingCycle = (c === 'annual' || c === 'quarterly') ? c : 'monthly';
      renderPricingPanel();
    } else if (el.dataset.action === 'start-checkout'){
      var p = el.dataset.plan;
      startCheckout((p === 'annual' || p === 'quarterly') ? p : 'monthly');
    } else if (el.dataset.action === 'request-start-trial'){
      ui.confirmingTrial = true;
      renderPricingPanel();
    } else if (el.dataset.action === 'cancel-start-trial'){
      ui.confirmingTrial = false;
      renderPricingPanel();
    } else if (el.dataset.action === 'start-free-trial'){
      startFreeTrial();
    } else if (el.dataset.action === 'manage-subscription'){
      openManageSubscription();
    }
  });

  var printMenuOverlayEl = document.getElementById('printMenuOverlay');
  printMenuOverlayEl.addEventListener('click', function(e){
    if (e.target === printMenuOverlayEl){
      closePrintMenu();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-print-menu'){
      closePrintMenu();
    } else if (el.dataset.action === 'print-pdf-choice'){
      var sid = el.dataset.session;
      closePrintMenu();
      printSessionReceipt(sid);
    } else if (el.dataset.action === 'print-pdf-pro-choice'){
      var sid2 = el.dataset.session;
      closePrintMenu();
      openProReceipt(sid2);
    }
  });

  var exTipOverlayEl = document.getElementById('exTipOverlay');
  exTipOverlayEl.addEventListener('click', function(e){
    if (e.target === exTipOverlayEl){
      closeExTip();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-ex-tip'){
      closeExTip();
    } else if (el.dataset.action === 'open-pricing'){
      closeExTip();
      openPricing();
    }
  });

  var avatarPickOverlayEl = document.getElementById('avatarPickOverlay');
  avatarPickOverlayEl.addEventListener('click', function(e){
    if (e.target === avatarPickOverlayEl){
      closeAvatarPick();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-avatar-pick'){
      closeAvatarPick();
    } else if (el.dataset.action === 'pick-avatar-draft'){
      ui.avatarPickDraft = el.dataset.avatar;
      renderAvatarPickOverlay();
    } else if (el.dataset.action === 'confirm-avatar-pick'){
      confirmAvatarPick();
    }
  });

  var templatePickerOverlayEl = document.getElementById('templatePickerOverlay');
  templatePickerOverlayEl.addEventListener('click', function(e){
    if (e.target === templatePickerOverlayEl){
      closeTemplatePicker();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-template-picker'){
      closeTemplatePicker();
    } else if (el.dataset.action === 'select-template-category'){
      openTemplateCategory(el.dataset.category);
    } else if (el.dataset.action === 'template-picker-back'){
      backToTemplateCategories();
    } else if (el.dataset.action === 'select-template'){
      openStartTemplateConfirm(el.dataset.template);
    }
  });

  var restTimerPickerOverlayEl = document.getElementById('restTimerPickerOverlay');
  restTimerPickerOverlayEl.addEventListener('click', function(e){
    if (e.target === restTimerPickerOverlayEl){
      closeRestTimerPicker();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-rest-timer-picker'){
      closeRestTimerPicker();
    } else if (el.dataset.action === 'rest-timer-adjust'){
      adjustRestTimerDraft(parseInt(el.dataset.delta, 10));
    } else if (el.dataset.action === 'start-rest-timer'){
      startRestTimer();
    }
  });

  var bodyweightPickerOverlayEl = document.getElementById('bodyweightPickerOverlay');
  bodyweightPickerOverlayEl.addEventListener('click', function(e){
    if (e.target === bodyweightPickerOverlayEl){
      closeBodyweightPicker();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-bodyweight-picker'){
      closeBodyweightPicker();
    } else if (el.dataset.action === 'confirm-bodyweight'){
      confirmBodyweightPicker();
    } else if (el.dataset.action === 'set-goal-draft'){
      setGoalDraft(el.dataset.goal);
    }
  });
  bodyweightPickerOverlayEl.addEventListener('keydown', function(e){
    if (e.target.id !== 'bodyweightDraftInput') return;
    if (e.key === 'Enter'){
      e.preventDefault();
      confirmBodyweightPicker();
    } else if (e.key === 'Escape'){
      e.preventDefault();
      closeBodyweightPicker();
    }
  });

  var changePasswordOverlayEl = document.getElementById('changePasswordOverlay');
  changePasswordOverlayEl.addEventListener('click', function(e){
    if (e.target === changePasswordOverlayEl){
      if (!ui.changePasswordBusy) closeChangePasswordPanel();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'close-change-password'){
      if (!ui.changePasswordBusy) closeChangePasswordPanel();
    } else if (el.dataset.action === 'submit-change-password'){
      submitChangePassword();
    }
  });
  changePasswordOverlayEl.addEventListener('keydown', function(e){
    var ids = ['changePwCurrentInput','changePwNewInput','changePwConfirmInput'];
    if (ids.indexOf(e.target.id) === -1) return;
    if (e.key === 'Enter'){
      e.preventDefault();
      submitChangePassword();
    } else if (e.key === 'Escape'){
      e.preventDefault();
      if (!ui.changePasswordBusy) closeChangePasswordPanel();
    }
  });

  var equipmentGuideOverlayEl = document.getElementById('equipmentGuideOverlay');
  equipmentGuideOverlayEl.addEventListener('click', function(e){
    if (e.target === equipmentGuideOverlayEl || e.target.closest('[data-action="close-equipment-guide"]')){
      closeEquipmentGuide();
    }
  });

  // Single delegated listener for every password show/hide button in the
  // app (auth screen, change password, delete account) — safe to keep
  // separate from each overlay's own click handler since nothing here
  // calls stopPropagation, so this still fires no matter which overlay
  // or screen the button lives in.
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action="toggle-password-visibility"]');
    if (!btn) return;
    togglePasswordVisibility(btn);
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (ui.confirmModal){
      ui.confirmModal = null;
      renderApp();
    } else if (ui.savingRoutine){
      cancelSaveRoutine();
    } else if (ui.confirmingDeleteAccountPassword){
      if (!ui.deleteAccountPasswordBusy) cancelDeleteAccountPasswordConfirm();
    } else if (ui.tourStep !== null){
      endTour();
    } else if (ui.showBrief){
      closeBrief();
    } else if (ui.showProReceipt){
      closeProReceipt();
    } else if (ui.showPricing){
      closePricing();
    } else if (ui.showPrintMenu){
      closePrintMenu();
    } else if (ui.showExTip){
      closeExTip();
    } else if (ui.showAvatarPick){
      closeAvatarPick();
    } else if (ui.showTemplatePicker){
      closeTemplatePicker();
    } else if (ui.showRestTimerPicker){
      closeRestTimerPicker();
    } else if (ui.showBodyweightPicker){
      closeBodyweightPicker();
    } else if (ui.showChangePassword){
      if (!ui.changePasswordBusy) closeChangePasswordPanel();
    } else if (ui.showEquipmentGuide){
      closeEquipmentGuide();
    } else if (ui.showNotifications){
      closeNotifications();
    } else if (ui.showMuscleMap){
      ui.showMuscleMap = false;
      ui.selectedMuscle = null;
      ui.pendingMuscle = null;
      renderApp();
    }
  });

  /* =========================================================
     INIT
     Boots gated on Firebase resolving whether there's a logged-in
     user (its own local session cache makes this near-instant on
     repeat visits, but it's still async on first paint — hence the
     brief #bootLoading splash). Guest mode is checked as a fallback
     once Firebase confirms there's no logged-in user.
     ========================================================= */
  function initAuthListener(){
    if (!window.SaviorFirebase){
      // Firebase module hasn't finished loading/initializing yet — retry shortly.
      setTimeout(initAuthListener, 50);
      return;
    }
    window.SaviorFirebase.onAuthChange(function(user){
      if (user){
        enterAccount(user.uid, user.email);
      } else if (loadCurrentAccountId() === 'guest'){
        state.currentAccount = 'guest';
        state.userDoc = null;
        bootAccountData();
        showAppShell();
        renderApp();
      } else {
        state.currentAccount = null;
        state.currentAccountEmail = null;
        state.userDoc = null;
        showAuthGateShell();
        renderAuthGate();
      }
    });
  }
  initAuthListener();

  // Foreground push: while this tab is open and focused, FCM delivers
  // the payload here instead of as a native OS notification (that only
  // happens for background/closed tabs, handled inside sw.js). Just
  // surface it as a toast so it's not silently dropped.
  (function initForegroundPush(){
    if (!window.SaviorFirebase || !window.SaviorFirebase.onForegroundPush){
      setTimeout(initForegroundPush, 50);
      return;
    }
    window.SaviorFirebase.onForegroundPush(function(payload){
      var body = (payload && payload.notification && payload.notification.body)
        || (payload && payload.data && payload.data.body)
        || 'New notification';
      showToast(body);
    });
  })();

  // Keeps the trial countdown fresh while the app sits open (e.g. "2 days
  // left" -> "1 day left", or a trial crossing into the "ending soon"
  // urgent window) without needing any other interaction to trigger it —
  // updates the bell's dot, and the dropdown's contents if it's open.
  setInterval(function(){
    var appShellVisible = !document.getElementById('app').classList.contains('hidden');
    if (!appShellVisible) return;
    var notifBellDotEl = document.getElementById('notifBellDot');
    if (notifBellDotEl){
      notifBellDotEl.classList.toggle('hidden', !getNotifications().some(function(n){ return n.urgent; }));
    }
    if (ui.showNotifications) renderNotifOverlay();
  }, 60000);

  // Enables offline use + the "Install app" prompt on Android/Chrome.
  // Silently does nothing over file:// or if the browser lacks support.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // --- Keep bottom bars above the on-screen keyboard ---
  // #app is position:fixed sized to the *layout* viewport, which most mobile
  // browsers don't shrink when the keyboard opens (they shrink the *visual*
  // viewport instead and scroll the page). That leaves the Finish/Add Set
  // bar and tab bar sitting behind the keyboard. Syncing #app's real height
  // to visualViewport.height fixes it without needing to close the keyboard.
  if (window.visualViewport){
    var appShellEl = document.getElementById('app');
    var syncAppHeight = function(){
      appShellEl.style.height = window.visualViewport.height + 'px';
      // The shell resizing doesn't by itself guarantee whatever's being
      // typed into is still inside the now-shorter visible area — a field
      // low on the page can end up sitting right at (or past) the new
      // bottom edge. 'nearest' is a no-op if it's already visible, so this
      // only moves things when the keyboard actually pushed it out of view.
      var active = document.activeElement;
      if (active && active.tagName === 'INPUT' && appShellEl.contains(active)){
        active.scrollIntoView({ block: 'nearest' });
      }
      syncExSearchOverlayHeight();
    };
    window.visualViewport.addEventListener('resize', syncAppHeight);
    syncAppHeight();
  }

  // --- "Install this as an app" banner ---
  // Chrome/Edge fire beforeinstallprompt; captured here and triggered
  // from the banner's own "Install" button (see triggerInstallPrompt,
  // wired through the same data-action delegation as everything else)
  // instead of relying on the browser's own often-suppressed
  // mini-infobar. iOS Safari never fires this event, so on iOS the
  // banner still shows, but its button walks through manual "Add to
  // Home Screen" steps instead of triggering a native prompt.
  var deferredInstallPrompt = null;

  function isStandaloneDisplay(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  // Called from the delegated click handler above when the banner's
  // "Install" button is tapped.
  function triggerInstallPrompt(){
    if (deferredInstallPrompt){
      var promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      ui.installPromptAvailable = false;
      renderInstallBanner();
      promptEvent.prompt();
      promptEvent.userChoice.catch(function(){});
    } else if (ui.installIsIOS){
      alert('To install SaviorFit Logger:\n\n1. Tap the Share icon\n2. Tap "Add to Home Screen"');
    }
  }

  (function(){
    if (isStandaloneDisplay()) return; // already installed — nothing to offer

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredInstallPrompt = e;
      ui.installPromptAvailable = true;
      renderInstallBanner();
    });

    if (/iphone|ipad|ipod/i.test(navigator.userAgent)){
      ui.installIsIOS = true;
      ui.installPromptAvailable = true;
      renderInstallBanner();
    }

    window.addEventListener('appinstalled', function(){
      deferredInstallPrompt = null;
      ui.installPromptAvailable = false;
      renderInstallBanner();
    });
  })();
})();
</script>
</body>
