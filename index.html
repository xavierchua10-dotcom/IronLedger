    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    flex-direction:column;
    background:rgba(20,23,27,0.62);
    overflow:hidden;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(16,18,21,0.72);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent);}
  .topbar h1 .brand-tag{
    color:var(--text-faint);
    font-size:11px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:lowercase;
    vertical-align:middle;
  }
  .unit-toggle{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    padding:9px 12px;
    min-height:40px;
    border-radius:20px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
  }
  .unit-toggle:active{background:var(--panel-3);}

  .install-app-btn{
    background:var(--accent);
    border:none;
    color:#14161a;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    padding:9px 12px;
    min-height:40px;
    border-radius:20px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .install-app-btn:active{background:var(--accent-dim);color:var(--text);}

  .hidden{display:none !important;}

  .topbar-right{display:flex;align-items:center;gap:10px;}
  .account-wrap{position:relative;}
  .account-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .account-avatar:active{background:var(--panel-3);}
  .account-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    min-width:160px;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    z-index:20;
  }
  .account-menu-name{
    font-size:12px;
    color:var(--text-dim);
    font-weight:600;
    padding:4px 6px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
    word-break:break-word;
  }
  .account-menu-logout{
    width:100%;
    background:none;
    border:none;
    color:var(--accent-2);
    font-size:13px;
    font-weight:600;
    text-align:left;
    padding:6px;
    cursor:pointer;
    border-radius:6px;
  }
  .account-menu-logout:active{background:var(--panel-3);}

  /* ---------- Auth gate ---------- */
  #authGate{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:rgba(20,23,27,0.9);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 24px 26px;
    box-shadow:0 16px 48px rgba(0,0,0,0.5);
  }
  .auth-title{text-align:center;margin-bottom:22px;}
  .auth-title h1{
    font-family:'Oswald',sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .auth-title h1 span{color:var(--accent);}
  .auth-title .auth-sub{
    color:var(--text-faint);
    font-size:12px;
    letter-spacing:0.05em;
    margin-top:4px;
  }
  .auth-tabs{
    display:flex;
    background:var(--panel-2);
    border-radius:8px;
    padding:3px;
    margin-bottom:18px;
  }
  .auth-tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:9px 4px;
    border-radius:6px;
    cursor:pointer;
  }
  .auth-tabs button.active{background:var(--accent);color:#1c1500;}
  .auth-field{margin-bottom:12px;}
  .auth-field input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:12px;
    font-size:16px;
  }
  .auth-field input:focus{outline:none;border-color:var(--accent);}
  .auth-error{
    color:var(--accent-2);
    font-size:12px;
    min-height:16px;
    margin-bottom:8px;
    line-height:1.4;
  }
  .auth-submit{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#1c1500;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:700;
    cursor:pointer;
  }
  .auth-submit:active{opacity:0.9;}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    color:var(--text-faint);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .auth-divider::before,.auth-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .auth-guest-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
  }
  .auth-guest-btn:active{background:var(--panel-2);}
  .auth-note{
    font-size:11px;
    color:var(--text-faint);
    text-align:center;
    margin-top:16px;
    line-height:1.5;
  }

  /* ---------- Main / view ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(100px + var(--safe-bottom));
  }

  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:22px 0 8px;
  }
  .section-label:first-child{margin-top:0;}

  input[type=text].session-name-input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    padding:4px 0 10px;
    margin-bottom:4px;
  }
  input[type=text].session-name-input::placeholder{color:var(--text-faint);text-transform:none;font-weight:500;}
  input[type=text].session-name-input:focus{outline:none;border-bottom-color:var(--accent);}

  .session-meta{
    display:flex;
    gap:14px;
    color:var(--text-dim);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    margin-bottom:18px;
  }
  .session-meta b{color:var(--accent);font-weight:600;}

  /* ---------- Exercise card ---------- */
  .exercise-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
    margin-bottom:14px;
  }
  .exercise-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .exercise-head-actions{display:flex;gap:2px;flex-shrink:0;}
  .exercise-head h3{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .exercise-card.collapsed{padding:0;}
  .exercise-head-collapsed{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:14px;
    cursor:pointer;
  }
  .exercise-head-collapsed .eh-title{flex:1;min-width:0;}
  .exercise-head-collapsed .eh-title h3{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
    color:var(--text-dim);
  }
  .exercise-collapsed-meta{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--accent);
    flex-shrink:0;
    white-space:nowrap;
  }
  .exercise-collapsed-meta .chevron{color:var(--text-faint);font-size:13px;}
  .eh-title{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    min-width:0;
  }
  .muscle-badge{
    background:var(--panel-3);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:10px;
    white-space:nowrap;
  }
  .muscle-badge.sm{
    font-size:9px;
    padding:2px 6px;
    margin-left:4px;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:18px;
    line-height:1;
    padding:0;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:8px;
    flex-shrink:0;
  }
  .icon-btn:active{background:var(--panel-3);color:var(--text);}
  .exercise-head-actions .icon-btn{
    border:1px solid var(--line);
  }

  .exercise-volume{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding-bottom:8px;
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .exercise-volume b{color:var(--accent);font-weight:700;letter-spacing:normal;text-transform:none;}

  .set-row{
    display:grid;
    grid-template-columns:20px 1fr auto 80px;
    align-items:center;
    gap:6px;
    padding:4px 0;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
  }
  .set-row.editing{
    background:rgba(242,177,52,0.08);
    border-radius:6px;
  }
  .set-row .set-idx{color:var(--text-faint);}
  .set-row .set-detail{color:var(--text);}
  .set-row .set-detail .x{color:var(--text-faint);margin:0 4px;}
  .set-row .set-flags{display:flex;gap:5px;align-items:center;justify-content:flex-end;}
  .flame{color:var(--accent-2);font-size:12px;}
  .pr-tag{
    background:var(--accent-2-dim);
    color:var(--accent-2);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.04em;
    padding:2px 6px;
    border-radius:10px;
  }
  .set-actions{display:flex;gap:4px;justify-content:flex-end;}
  .set-act-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:14px;
    cursor:pointer;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    padding:0;
  }
  .set-act-btn:active{color:var(--accent);background:var(--panel-3);}

  .editing-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--accent);
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--accent-dim);
  }

  .add-set-row{
    display:grid;
    grid-template-columns:1fr 1fr auto auto;
    gap:8px;
    align-items:center;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .add-set-row.editing-row{
    border-top:none;
    margin-top:6px;
    padding-top:0;
  }
  .add-set-row input{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:9px 8px;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    width:100%;
    min-width:0;
  }
  .add-set-row.no-add-btn{
    grid-template-columns:1fr 1fr auto;
  }
  .add-set-row input:focus{outline:none;border-color:var(--accent);}
  .failure-toggle{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-faint);
    border-radius:8px;
    width:42px;
    height:42px;
    font-size:15px;
    cursor:pointer;
    flex-shrink:0;
  }
  .failure-toggle.active{background:var(--accent-2-dim);border-color:var(--accent-2);color:var(--accent-2);}
  .add-set-btn{
    background:var(--accent);
    border:none;
    color:#1c1500;
    font-weight:700;
    border-radius:8px;
    width:42px;
    height:42px;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  .add-set-btn:active{opacity:0.85;}
  .edit-btn-group{display:flex;gap:6px;}
  .save-edit-btn{
    background:var(--accent);
    border:none;
    color:#1c1500;
    font-weight:700;
    border-radius:8px;
    width:40px;
    height:42px;
    font-size:15px;
    cursor:pointer;
  }
  .save-edit-btn:active{opacity:0.85;}
  .cancel-edit-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-faint);
    border-radius:8px;
    width:40px;
    height:42px;
    font-size:13px;
    cursor:pointer;
  }
  .cancel-edit-btn:active{background:var(--panel-3);color:var(--text);}

  /* ---------- Buttons / generic ---------- */
  .btn-block{
    width:100%;
    padding:13px;
    border-radius:var(--radius);
    border:1px dashed var(--line);
    background:transparent;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .btn-block:active{background:var(--panel-2);}
  .btn-primary{
    width:100%;
    padding:15px;
    border-radius:var(--radius);
    border:none;
    background:var(--accent);
    color:#1c1500;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  .btn-primary:active{opacity:0.9;}
  .btn-primary:disabled{background:var(--panel-3);color:var(--text-faint);cursor:default;}
  .btn-danger{
    width:100%;
    padding:13px;
    border-radius:var(--radius);
    border:1px solid var(--accent-2-dim);
    background:transparent;
    color:var(--accent-2);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- Muscle map ---------- */
  .mm-toggle-btn{
    border:2px solid var(--accent);
    background:var(--accent-dim);
    color:var(--accent);
    font-weight:700;
    padding:14px;
  }
  .mm-toggle-btn:active{background:var(--accent);color:#1c1500;}

  /* ---------- Muscle map overlay (floating card) ---------- */
  .mm-overlay{
    position:fixed;
    inset:0;
    background:rgba(8,9,11,0.68);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:90;
  }
  .mm-overlay.hidden{display:none;}
  .mm-overlay-panel{
    width:100%;
    max-width:340px;
    max-height:75vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--panel-2);
    border:2px solid var(--accent-dim);
    border-radius:16px;
    padding:12px 16px 14px;
    box-shadow:0 16px 48px rgba(0,0,0,0.5);
  }
  .mm-overlay-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .mm-overlay-head h2{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text);
    margin:0;
  }
  .mm-overlay-head .icon-btn{width:34px;height:34px;background:var(--panel-3);flex-shrink:0;}
  .mm-columns{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .mm-diagram-col{
    flex:0 0 auto;
    width:112px;
  }
  .mm-list-col{
    flex:1;
    min-width:0;
    max-height:236px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .mm-viewtabs{
    display:flex;
    background:var(--panel-3);
    border-radius:8px;
    padding:3px;
    margin-bottom:6px;
    width:fit-content;
  }
  .mm-viewtabs button{
    background:none;
    border:none;
    color:var(--text-faint);
    padding:6px 12px;
    border-radius:6px;
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
    cursor:pointer;
  }
  .mm-viewtabs button.active{background:var(--accent);color:#1c1500;}
  .mm-svg-wrap{
    display:flex;
    justify-content:center;
  }
  .mm-svg-wrap svg{
    display:block;
    width:100%;
    max-width:112px;
    height:auto;
  }
  .mm-shape{cursor:pointer;transition:fill 0.15s ease, fill-opacity 0.15s ease;}
  .mm-shape-static{pointer-events:none;}
  @media (prefers-reduced-motion: reduce){
    .mm-shape{transition:none;}
  }
  .mm-list-empty{
    height:100%;
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    line-height:1.5;
    padding:0 4px;
  }
  .mm-selected-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  .mm-exercise-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .mm-exercise-item{
    width:100%;
    text-align:left;
    background:var(--panel-3);
    border:1px solid var(--line);
    color:var(--text);
    font-size:12.5px;
    line-height:1.3;
    font-family:'Inter',sans-serif;
    font-weight:500;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .mm-exercise-item:active{background:var(--panel);border-color:var(--accent-dim);}
  .mm-exercise-item-custom{color:var(--accent);border-color:var(--accent-dim);background:transparent;}

  .name-input-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .name-input-row input{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius);
    padding:12px;
    font-size:16px;
  }
  .name-input-row input:focus{outline:none;border-color:var(--accent);}
  .name-input-row button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    border-radius:var(--radius);
    padding:0 16px;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
  }
  .name-input-row button.ready{
    background:var(--accent);
    border-color:var(--accent);
    color:#2a1f04;
  }
  .name-input-row button.ready:active{opacity:0.85;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--text-faint);
  }
  .empty .glyph{margin-bottom:10px;opacity:0.6;display:flex;justify-content:center;}
  .empty .glyph svg{width:32px;height:32px;}
  .empty p{font-size:13px;line-height:1.6;margin:0;}

  /* ---------- History ---------- */
  .history-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .history-item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 14px;
    cursor:pointer;
  }
  .history-item-head .hi-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .history-item-head .hi-name{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .hi-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .hi-rename-btn{
    width:26px;
    height:26px;
    font-size:12px;
    flex-shrink:0;
  }
  .history-item-head-editing{cursor:default;}
  .hi-rename-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
  }
  .hi-name-input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--accent-dim);
    color:var(--text);
    border-radius:7px;
    padding:9px 10px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .hi-name-input:focus{outline:none;border-color:var(--accent);}
  .history-item-head .hi-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
  }
  .history-item-head .hi-stats{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    text-align:right;
  }
  .history-item-body{
    padding:0 14px 14px;
    border-top:1px solid var(--line);
  }
  .hi-ex{padding:10px 0 0;}
  .hi-ex-name{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:4px;}
  .hi-ex-sets{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-faint);line-height:1.7;}
  .hi-ex-sets .pr-tag{margin-left:6px;}
  .hi-delete{
    margin-top:0;
    background:none;
    border:none;
    color:var(--accent-2);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px 0;
  }
  .hi-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .hi-print{
    background:none;
    border:1px solid var(--line);
    color:var(--accent);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    padding:7px 12px;
    border-radius:8px;
  }
  .hi-print:active{background:var(--panel-3);}

  /* ---------- Print receipt ---------- */
  .print-receipt{display:none;}
  @media print{
    body > *:not(#printReceipt){display:none !important;}
    #printReceipt{display:block !important;}
    @page{margin:12mm;}
  }
  .print-receipt{
    background:#fff;
    color:#000;
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:12px;
    width:280px;
    margin:0 auto;
    padding:0;
  }
  .print-receipt .pr-brand{
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .print-receipt .pr-brand .pr-brand-accent{color:#b8860b;}
  .print-receipt .pr-tagline{
    text-align:center;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#b8860b;
    margin-bottom:10px;
  }
  .print-receipt .pr-line{border-top:1px dashed #b8860b;margin:8px 0;}
  .print-receipt .pr-row{display:flex;justify-content:space-between;gap:8px;}
  .print-receipt .pr-session-name{font-weight:700;text-transform:uppercase;}
  .print-receipt .pr-ex-name{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:11px;}
  .print-receipt .pr-ex-muscle{font-weight:400;text-transform:none;color:#000;}
  .print-receipt .pr-set{display:flex;justify-content:space-between;padding-left:6px;}
  .print-receipt .pr-set .pr-pr{font-weight:700;color:#b8860b;}
  .print-receipt .pr-footer{text-align:center;font-size:10px;margin-top:14px;letter-spacing:0.04em;color:#b8860b;}

  /* ---------- Progress ---------- */
  .progress-select{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius);
    padding:12px;
    font-size:16px;
    margin-bottom:16px;
  }
  .chart-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:16px;
  }
  .chart-stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-family:'JetBrains Mono',monospace;
  }
  .chart-stats .cs-block .cs-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;}
  .chart-stats .cs-block .cs-val{font-size:16px;color:var(--accent);font-weight:700;}
  .chart-empty-note{
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    padding:22px 10px;
  }
  .pr-list-item{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:8px 0;
    border-top:1px solid var(--line);
    color:var(--text-dim);
  }
  .pr-list-item .pl-w{color:var(--text);font-weight:600;}

  /* ---------- Settings ---------- */
  .settings-group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 14px;
    margin-bottom:16px;
  }
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .settings-row:first-child{border-top:none;}
  .settings-row .sr-label{font-size:14px;color:var(--text);}
  .settings-row .sr-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .settings-row button.sr-action{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    border-radius:8px;
    padding:8px 14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .settings-row button.sr-action-danger{
    color:var(--accent-2);
    border-color:var(--accent-2-dim);
  }
  .settings-row .seg{
    display:flex;
    background:var(--panel-2);
    border-radius:8px;
    padding:3px;
  }
  .settings-row .seg button{
    background:none;border:none;color:var(--text-faint);
    padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .settings-row .seg button.active{background:var(--accent);color:#1c1500;}

  /* ---------- Fixed finish-session bar ---------- */
  .session-finish-bar{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px 16px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .session-finish-bar.hidden{display:none;}
  .session-finish-bar .btn-primary{
    flex:1;
    margin-top:0;
    padding:11px;
    font-size:13px;
  }
  .add-set-global-btn{
    flex:1;
    padding:11px;
    border:none;
    border-radius:8px;
    background:#5ab7e8;
    color:#0b2733;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .add-set-global-btn:active{opacity:0.85;}
  .add-set-global-btn:disabled{
    background:var(--panel-2);
    color:var(--text-faint);
    cursor:not-allowed;
    opacity:0.7;
  }

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + var(--safe-bottom));
    max-width:480px;
    margin:0 auto;
    width:100%;
  }
  .tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:600;
    padding:8px 4px 6px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    border-radius:8px;
  }
  .tabbar button .tab-glyph{font-size:17px;}
  .tabbar button .tab-glyph svg{width:17px;height:17px;display:block;}
  .tabbar button.active{color:var(--accent);}
  .tabbar button:active{background:var(--panel-2);}

  .toast{
    position:fixed;
    bottom:calc(90px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-3);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ---------- Delete confirmation overlay ---------- */
  .confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(8,9,11,0.68);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
  }
  .confirm-overlay.hidden{display:none;}
  .confirm-panel{
    width:100%;
    max-width:340px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px 20px;
    box-shadow:0 16px 48px rgba(0,0,0,0.55);
  }
  .confirm-title{
    font-family:'Oswald',sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
    letter-spacing:0.01em;
  }
  .confirm-message{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
    margin-bottom:20px;
  }
  .confirm-buttons{display:flex;gap:10px;}
  .confirm-btn-cancel{
    flex:1;
    min-height:44px;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .confirm-btn-cancel:active{background:var(--panel-3);}
  .confirm-btn-danger{
    flex:1;
    min-height:44px;
    border-radius:10px;
    border:none;
    background:var(--accent-2);
    color:#fdf1f0;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .confirm-btn-danger:active{opacity:0.85;}
  .confirm-btn-primary{
    flex:1;
    min-height:44px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#1c1500;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .confirm-btn-primary:active{opacity:0.85;}

  @media (prefers-reduced-motion: reduce){
    .toast{transition:none;}
    *{animation:none !important;}
  }

  @keyframes prpulse{
    0%{transform:scale(1);}
    35%{transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  .pr-tag.fresh{animation:prpulse 0.4s ease;}

  ::selection{background:var(--accent-dim);color:var(--text);}
</style>
</head>
<body>
<div id="app" class="hidden">
  <header class="topbar">
    <h1>IRON <span>LEDGER</span> <span class="brand-tag">savior</span></h1>
    <div class="topbar-right">
      <div class="account-wrap">
        <button class="account-avatar" id="accountAvatarBtn" data-action="toggle-account-menu">G</button>
        <div class="account-menu hidden" id="accountMenu">
          <div class="account-menu-name" id="accountMenuName">Guest</div>
          <button class="account-menu-logout" data-action="log-out">Log out</button>

    <button data-action="set-tab" data-tab="log"><span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="1" y="4" width="4" height="16" rx="1.3"/><rect x="19" y="4" width="4" height="16" rx="1.3"/><rect x="5" y="10.4" width="14" height="3.2" rx="1"/></svg></span>Log</button>
    <button data-action="set-tab" data-tab="history"><span class="tab-glyph">&#128220;</span>History</button>
    <button data-action="set-tab" data-tab="progress"><span class="tab-glyph">&#8599;</span>Progress</button>
    <button data-action="set-tab" data-tab="settings"><span class="tab-glyph">&#9881;</span>Settings</button>

</div>

</div>

<div id="printReceipt" class="print-receipt hidden"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     STATE
     ========================================================= */
  var STORAGE_SESSIONS = 'il_sessions_v1';
  var STORAGE_SETTINGS = 'il_settings_v1';
  var STORAGE_ACCOUNTS = 'il_accounts_v1';
  var STORAGE_CURRENT_ACCOUNT = 'il_current_account_v1';

  var state = {
    sessions: [],
    settings: { unit: 'kg' },
    tab: 'log',
    currentAccount: null   // null (show gate) | 'guest' | account id
  };

  var ui = {
    expandedHistory: {},   // sessionId -> bool
    progressExercise: null,
    showMuscleMap: false,
    muscleMapView: 'front',
    selectedMuscle: null,
    pendingMuscle: null,
    editingSet: null,      // { exId, setId } or null
    editingHistoryName: null,  // sessionId currently being renamed, or null
    showAccountMenu: false,
    authMode: 'login',     // 'login' | 'signup'
    authError: null,
    authDraft: { username: '' },
    confirmModal: null,           // { kind:'exercise'|'set'|'session', title, message, exId, setId, sessionId } or null
    pendingDeleteAccount: false,
    freshPRSetId: null,    // id of a just-logged set that should play the PR pulse animation once
    activeExId: null       // exercise whose weight/reps inputs were last focused — used by the global Add Set button
  };

  /* =========================================================
     ACCOUNTS  (local, on-device only — no server, no sync)
     ========================================================= */
  function scopedKey(base){
    var acct = state.currentAccount;
    return (!acct || acct === 'guest') ? base : (base + '::' + acct);
  }
  function loadAccounts(){
    try{
      var raw = localStorage.getItem(STORAGE_ACCOUNTS);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveAccounts(accounts){
    localStorage.setItem(STORAGE_ACCOUNTS, JSON.stringify(accounts));
  }
  function loadCurrentAccountId(){
    return localStorage.getItem(STORAGE_CURRENT_ACCOUNT);
  }
  function setCurrentAccountId(id){
    if (id) localStorage.setItem(STORAGE_CURRENT_ACCOUNT, id);
    else localStorage.removeItem(STORAGE_CURRENT_ACCOUNT);
  }
  function currentAccountUsername(){
    if (!state.currentAccount || state.currentAccount === 'guest') return 'Guest';
    var accounts = loadAccounts();
    var acct = accounts.find(function(a){ return a.id === state.currentAccount; });
    return acct ? acct.username : 'Guest';
  }
  // Basic on-device hashing via the browser's built-in crypto — this is not
  // server-verified security, just keeps a plain password out of localStorage.
  function hashPassword(pw){
    var enc = new TextEncoder().encode(pw);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }
  // If someone already has data under the old unscoped keys (from before
  // accounts existed), treat them as already-continuing-as-guest instead of
  // interrupting them with a gate the first time this update loads.
  function determineInitialAccount(){
    var stored = loadCurrentAccountId();
    if (stored) return stored;
    try{
      var legacy = localStorage.getItem(STORAGE_SESSIONS);
      if (legacy && JSON.parse(legacy).length > 0) return 'guest';
    }catch(e){}
    return null;
  }

  function loadSessions(){
    try{
      var raw = localStorage.getItem(scopedKey(STORAGE_SESSIONS));
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function loadSettings(){
    try{
      var raw = localStorage.getItem(scopedKey(STORAGE_SETTINGS));
      return raw ? JSON.parse(raw) : { unit: 'kg' };
    }catch(e){ return { unit: 'kg' }; }
  }
  function saveSessions(){
    localStorage.setItem(scopedKey(STORAGE_SESSIONS), JSON.stringify(state.sessions));
  }
  function saveSettings(){
    localStorage.setItem(scopedKey(STORAGE_SETTINGS), JSON.stringify(state.settings));
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* =========================================================
     UNIT HELPERS  (weights always stored internally in kg)
     ========================================================= */
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }
  function toDisplay(kg){
    var v = state.settings.unit === 'kg' ? kg : kgToLb(kg);
    return roundNice(v);
  }
  function toStoredKg(displayVal){
    var v = parseFloat(displayVal);
    if (isNaN(v)) return null;
    return state.settings.unit === 'kg' ? v : lbToKg(v);
  }
  function roundNice(v){
    return Math.round(v * 100) / 100;
  }
  function fmtWeight(kg){
    var v = toDisplay(kg);
    var rounded = Math.round(v * 10) / 10;
    return (rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1));
  }
  function unitLabel(){ return state.settings.unit; }

  /* =========================================================
     SESSION / EXERCISE / SET HELPERS
     ========================================================= */
  function getActiveSession(){
    var active = state.sessions.find(function(s){ return s.status === 'active'; });
    if (!active){
      active = {
        id: uid(),
        name: '',
        date: new Date().toISOString(),
        status: 'active',
        exercises: []
      };
      state.sessions.unshift(active);
      saveSessions();
    }
    return active;
  }

  // Re-derive isPR flags for every set of a given exercise name, across all
  // sessions, in chronological order. Needed after an edit or delete since
  // changing one set can change which sets before/after it count as PRs.
  function recomputeExercisePRs(exerciseName){
    var key = exerciseName.trim().toLowerCase();
    var entries = [];
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== key) return;
        ex.sets.forEach(function(st){ entries.push({ date: s.date, set: st }); });
      });
    });
    entries.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    var best = 0;
    entries.forEach(function(e){
      var val = e1rm(e.set.weightKg, e.set.reps);
      var isPR = val > best + 0.001;
      e.set.isPR = isPR;
      if (isPR) best = val;
    });
  }

  function findExercise(session, exId){
    return session.exercises.find(function(e){ return e.id === exId; });
  }

  function allExerciseNames(){
    var set = {};
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(e){
        if (e.name && e.name.trim()) set[e.name.trim()] = true;
      });
    });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  }

  function e1rm(weightKg, reps){
    reps = Math.max(1, reps);
    if (reps === 1) return weightKg;
    return weightKg * (1 + reps / 30);
  }

  // best e1rm for a given exercise name across all sessions, excluding one specific set id
  function bestE1RM(exerciseName, excludeSetId){
    var name = exerciseName.trim().toLowerCase();
    var best = 0;
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name) return;
        ex.sets.forEach(function(st){
          if (st.id === excludeSetId) return;
          var val = e1rm(st.weightKg, st.reps);
          if (val > best) best = val;
        });
      });
    });
    return best;
  }

  function sessionVolume(session){
    var total = 0;
    session.exercises.forEach(function(ex){
      ex.sets.forEach(function(st){ total += st.weightKg * st.reps; });
    });
    return total;
  }
  function exerciseVolume(ex){
    var total = 0;
    ex.sets.forEach(function(st){ total += st.weightKg * st.reps; });
    return total;
  }
  function sessionSetCount(session){
    var total = 0;
    session.exercises.forEach(function(ex){ total += ex.sets.length; });
    return total;
  }

  /* =========================================================
     MUSCLE MAP  (body diagram for exercise selection)
     ========================================================= */
  var MUSCLE_SHAPES = {
    front: [
      { type:'circle', cx:100, cy:24, r:18, muscle:null },
      { type:'rect', x:92, y:42, w:16, h:10, rx:3, muscle:null },
      { type:'ellipse', cx:56, cy:64, rx:18, ry:15, muscle:'Shoulders' },
      { type:'ellipse', cx:144, cy:64, rx:18, ry:15, muscle:'Shoulders' },
      { type:'rect', x:76, y:54, w:48, h:44, rx:10, muscle:'Chest' },
      { type:'rect', x:32, y:80, w:20, h:60, rx:8, muscle:'Biceps' },
      { type:'rect', x:148, y:80, w:20, h:60, rx:8, muscle:'Biceps' },
      { type:'rect', x:28, y:142, w:18, h:58, rx:8, muscle:'Forearms' },
      { type:'rect', x:154, y:142, w:18, h:58, rx:8, muscle:'Forearms' },
      { type:'rect', x:78, y:100, w:44, h:56, rx:10, muscle:'Abs' },
      { type:'rect', x:72, y:158, w:24, h:95, rx:12, muscle:'Quads' },
      { type:'rect', x:104, y:158, w:24, h:95, rx:12, muscle:'Quads' },
      { type:'rect', x:74, y:255, w:22, h:85, rx:12, muscle:'Calves' },
      { type:'rect', x:104, y:255, w:22, h:85, rx:12, muscle:'Calves' }
    ],
    back: [
      { type:'circle', cx:100, cy:24, r:18, muscle:null },
      { type:'rect', x:92, y:42, w:16, h:10, rx:3, muscle:null },
      { type:'ellipse', cx:56, cy:64, rx:18, ry:15, muscle:'Shoulders' },
      { type:'ellipse', cx:144, cy:64, rx:18, ry:15, muscle:'Shoulders' },
      { type:'rect', x:80, y:52, w:40, h:28, rx:8, muscle:'Traps' },
      { type:'rect', x:74, y:82, w:52, h:70, rx:10, muscle:'Back' },
      { type:'rect', x:32, y:80, w:20, h:60, rx:8, muscle:'Triceps' },
      { type:'rect', x:148, y:80, w:20, h:60, rx:8, muscle:'Triceps' },
      { type:'rect', x:28, y:142, w:18, h:58, rx:8, muscle:'Forearms' },
      { type:'rect', x:154, y:142, w:18, h:58, rx:8, muscle:'Forearms' },
      { type:'rect', x:74, y:154, w:52, h:45, rx:12, muscle:'Glutes' },
      { type:'rect', x:72, y:201, w:24, h:80, rx:12, muscle:'Hamstrings' },
      { type:'rect', x:104, y:201, w:24, h:80, rx:12, muscle:'Hamstrings' },
      { type:'rect', x:74, y:283, w:22, h:75, rx:12, muscle:'Calves' },
      { type:'rect', x:104, y:283, w:22, h:75, rx:12, muscle:'Calves' }
    ]
  };

  var MUSCLE_EXERCISES = {

  function muscleMapSVG(view, selected){
    var shapes = MUSCLE_SHAPES[view];
    var svg = '<svg viewBox="0 0 200 370" preserveAspectRatio="xMidYMid meet">';
    shapes.forEach(function(s){
      var isMuscle = !!s.muscle;
      var isSel = isMuscle && s.muscle === selected;
      var fill = isSel ? 'var(--accent)' : 'var(--panel-3)';
      var fillOpacity = !isMuscle ? '1' : (isSel ? '1' : '0.6');
      var stroke = isSel ? 'var(--accent)' : 'var(--line)';
      var extra = isMuscle
        ? ' class="mm-shape'+(isSel?' selected':'')+'" data-action="mm-select-muscle" data-muscle="'+esc(s.muscle)+'"'
        : ' class="mm-shape-static"';
      var common = 'fill="'+fill+'" fill-opacity="'+fillOpacity+'" stroke="'+stroke+'" stroke-width="1.5"'+extra;
      if (s.type === 'circle'){
        svg += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'" '+common+'/>';
      } else if (s.type === 'ellipse'){
        svg += '<ellipse cx="'+s.cx+'" cy="'+s.cy+'" rx="'+s.rx+'" ry="'+s.ry+'" '+common+'/>';
      } else {
        svg += '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" rx="'+(s.rx||6)+'" '+common+'/>';
      }
    });
    svg += '</svg>';
    return svg;
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function fmtDate(iso){
    var d = new Date(iso);
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
  }
  function fmtDateShort(iso){
    var d = new Date(iso);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }
  function fmtTime(iso){
    var d = new Date(iso);
    var h = d.getHours();
    var m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    var mm = m < 10 ? '0'+m : m;
    return h + ':' + mm + ' ' + ampm;
  }

  // one point per session for this exercise: best e1rm set in that session + top weight
  function collectExercisePoints(name){
    var pts = [];
    var chronological = state.sessions.filter(function(s){ return s.status === 'done'; })
      .slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    chronological.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name.trim().toLowerCase()) return;
        if (ex.sets.length === 0) return;
        var bestSet = ex.sets.reduce(function(a,b){
          return e1rm(b.weightKg,b.reps) > e1rm(a.weightKg,a.reps) ? b : a;
        }, ex.sets[0]);
        var topKg = Math.max.apply(null, ex.sets.map(function(st){ return st.weightKg; }));
        pts.push({ date: s.date, e1rm: e1rm(bestSet.weightKg, bestSet.reps), topKg: topKg });
      });
    });
    return pts;
  }

  function collectPRs(name){
    var prs = [];
    var chronological = state.sessions.filter(function(s){ return s.status === 'done'; })
      .slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    chronological.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name.trim().toLowerCase()) return;
        ex.sets.forEach(function(st){
          if (st.isPR) prs.push({ date: s.date, weightKg: st.weightKg, reps: st.reps });
        });
      });
    });
    return prs;
  }

  function buildChartSVG(points){
    var w = 400, h = 140, pad = 16;
    var vals = points.map(function(p){ return p.e1rm; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max){ min = min - 1; max = max + 1; }
    var n = points.length;
    function xAt(i){ return n === 1 ? w/2 : pad + (i/(n-1)) * (w - pad*2); }
    function yAt(v){ return h - pad - ((v - min)/(max - min)) * (h - pad*2); }

    var path = points.map(function(p,i){
      return (i===0?'M':'L') + xAt(i).toFixed(1) + ',' + yAt(p.e1rm).toFixed(1);
    }).join(' ');

    var dots = points.map(function(p,i){
      return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.e1rm).toFixed(1)+'" r="3" fill="#f2b134"/>';
    }).join('');

    var areaPath = path + ' L' + xAt(n-1).toFixed(1) + ',' + (h-pad) + ' L' + xAt(0).toFixed(1) + ',' + (h-pad) + ' Z';

    var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="140" preserveAspectRatio="none">';
    svg += '<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">' +
             '<stop offset="0%" stop-color="#f2b134" stop-opacity="0.28"/>' +
             '<stop offset="100%" stop-color="#f2b134" stop-opacity="0"/>' +
           '</linearGradient></defs>';
    svg += '<path d="'+areaPath+'" fill="url(#grad)" stroke="none"/>';
    svg += '<path d="'+path+'" fill="none" stroke="#f2b134" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    svg += dots;
    svg += '</svg>';
    return svg;
  }

  function logOut(){
    setCurrentAccountId(null);

  function deleteAccount(){
    if (!state.currentAccount || state.currentAccount === 'guest') return;
    var id = state.currentAccount;
    var accounts = loadAccounts().filter(function(a){ return a.id !== id; });
    saveAccounts(accounts);
    localStorage.removeItem(STORAGE_SESSIONS + '::' + id);
    localStorage.removeItem(STORAGE_SETTINGS + '::' + id);
    logOut();
    showToast('Account deleted');
  }

  function handleLogIn(username, password){
    username = (username || '').trim();
    if (!username || !password){
      ui.authError = 'Enter your username and password';
      renderAuthGate();
      return;
    }
    var accounts = loadAccounts();
    var acct = accounts.find(function(a){ return a.username.toLowerCase() === username.toLowerCase(); });
    if (!acct){
      ui.authError = 'No account with that username';
      renderAuthGate();
      return;
    }
    hashPassword(password).then(function(hash){
      if (hash !== acct.passwordHash){
        ui.authError = 'Incorrect password';
        renderAuthGate();
        return;
      }
      ui.authError = null;
      loginToAccount(acct.id);
    });
  }

  function handleSignUp(username, password, confirmPassword){
    username = (username || '').trim();
    if (!username || !password){
      ui.authError = 'Enter a username and password';
      renderAuthGate();
      return;
    }
    if (username.length < 2){
      ui.authError = 'Username must be at least 2 characters';
      renderAuthGate();
      return;
    }
    if (password.length < 4){
      ui.authError = 'Password must be at least 4 characters';
      renderAuthGate();
      return;
    }
    if (password !== confirmPassword){
      ui.authError = "Passwords don't match";
      renderAuthGate();
      return;
    }
    var accounts = loadAccounts();
    var exists = accounts.some(function(a){ return a.username.toLowerCase() === username.toLowerCase(); });
    if (exists){
      ui.authError = 'That username is already taken';
      renderAuthGate();
      return;
    }
    hashPassword(password).then(function(hash){
      var acct = { id: 'u_' + uid(), username: username, passwordHash: hash, createdAt: new Date().toISOString() };
      accounts.push(acct);
      saveAccounts(accounts);
      ui.authError = null;
      loginToAccount(acct.id);
    });
  }

    var mode = ui.authMode || 'login';

            '</div>';
    html += '<div class="auth-field"><input type="text" id="authUsername" placeholder="Username" autocomplete="username" autocapitalize="none" value="'+esc(ui.authDraft.username || '')+'"></div>';
    html += '<div class="auth-field"><input type="password" id="authPassword" placeholder="Password" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'"></div>';
    if (mode === 'signup'){

  /* =========================================================
     ACTIONS
     ========================================================= */
  function addExercise(name, muscle){
    if (name == null){
      var input = document.getElementById('newExInput');
      name = input.value.trim();
      muscle = ui.pendingMuscle || null;
    }
    name = String(name).trim();
    if (!name) return;
    if (!muscle){
      ui.confirmModal = {
        kind: 'add-exercise',
        title: 'Add this exercise?',
        message: '\u201c' + name + '\u201d will be added to today\u2019s session.',
        confirmLabel: 'Add Exercise',
        variant: 'primary',
        name: name,
        muscle: muscle || null
      };
      renderApp();
      return;
    }
    commitAddExercise(name, muscle);
  }

  function commitAddExercise(name, muscle){
    var session = getActiveSession();
    var newExId = uid();
    session.exercises.push({ id: newExId, name: name, muscle: muscle || null, sets: [] });
    saveSessions();
    ui.showMuscleMap = false;
    ui.selectedMuscle = null;
    ui.pendingMuscle = null;
    renderApp();
    if (muscle) showToast('Added ' + name);
    var newCard = document.querySelector('.exercise-card[data-ex="'+newExId+'"]');
    if (newCard) newCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function deleteExercise(exId){
    var session = getActiveSession();
    var ex = findExercise(session, exId);
    var name = ex ? ex.name : null;
    session.exercises = session.exercises.filter(function(e){ return e.id !== exId; });
    if (name) recomputeExercisePRs(name);
    saveSessions();
    if (ui.editingSet && ui.editingSet.exId === exId) ui.editingSet = null;
    renderApp();
  }

  function toggleExerciseDone(exId){
    var session = getActiveSession();
    var ex = findExercise(session, exId);
    if (!ex) return;
    ex.done = !ex.done;
    if (ex.done && ui.editingSet && ui.editingSet.exId === exId) ui.editingSet = null;
    saveSessions();
    renderApp();
  }

  function addSet(exId){
    var session = getActiveSession();
    var ex = findExercise(session, exId);
    if (!ex) return;
    var card = document.querySelector('.exercise-card[data-ex="'+exId+'"]');
    var weightInput = card.querySelector('.set-weight-input');
    var repsInput = card.querySelector('.set-reps-input');
    var failureBtn = card.querySelector('.failure-toggle');

    var weightKg = toStoredKg(weightInput.value);
    var reps = parseInt(repsInput.value, 10);

    if (weightKg === null || weightKg <= 0 || isNaN(reps) || reps <= 0){
      showToast('Enter a weight and reps first');
      return;
    }

    commitSet(ex, weightKg, reps, failureBtn.classList.contains('active'));
  }

  function commitSet(ex, weightKg, reps, toFailure){
    var setId = uid();
    var prevBest = bestE1RM(ex.name, null);
    var thisE1rm = e1rm(weightKg, reps);
    var isPR = thisE1rm > prevBest + 0.001;

    ex.sets.push({
      id: setId,
      weightKg: roundNice(weightKg),
      reps: reps,
      toFailure: !!toFailure,
      isPR: isPR
    });
    saveSessions();
    ui.freshPRSetId = isPR ? setId : null;
    renderApp();
    ui.freshPRSetId = null;
    if (isPR) showToast('New PR on ' + ex.name + '!');
  }

  function activeAddSetTarget(){
    var session = getActiveSession();
    if (!session) return null;
    var exId = ui.editingSet ? ui.editingSet.exId : ui.activeExId;
    var ex = exId ? findExercise(session, exId) : null;
    if (!ui.editingSet && (!ex || ex.done)){
      ex = session.exercises.find(function(e){ return !e.done; });
    }
    if (!ex) return null;
    var card = document.querySelector('.exercise-card[data-ex="'+ex.id+'"]');
    var weightInput = card && card.querySelector('.set-weight-input');
    var repsInput = card && card.querySelector('.set-reps-input');
    var failureBtn = card && card.querySelector('.failure-toggle');
    if (!weightInput || !repsInput) return null;
    return { ex: ex, weightInput: weightInput, repsInput: repsInput, failureBtn: failureBtn };
  }

  function refreshAddExBtn(){
    var btn = document.querySelector('.add-ex-btn');
    var input = document.getElementById('newExInput');
    if (!btn || !input) return;
    var ready = input.value.trim().length > 0;
    btn.classList.toggle('ready', ready);
    btn.textContent = ready ? '\u2713' : '+';
  }

  function refreshAddSetGlobalBtn(){
    var btn = document.querySelector('.add-set-global-btn');
    if (!btn) return;
    var target = activeAddSetTarget();
    var ready = false;
    if (target){
      var weightKg = toStoredKg(target.weightInput.value);
      var reps = parseInt(target.repsInput.value, 10);
      ready = weightKg !== null && weightKg > 0 && !isNaN(reps) && reps > 0;
    }
    btn.disabled = !ready;
    btn.innerHTML = ui.editingSet ? '&#10003; Apply Changes' : '&#10003; Add Set';
  }

  function addSetGlobal(){
    var target = activeAddSetTarget();
    if (!target){
      showToast('Add an exercise first');
      return;
    }
    var ex = target.ex;
    var weightKg = toStoredKg(target.weightInput.value);
    var reps = parseInt(target.repsInput.value, 10);
    if (weightKg === null || weightKg <= 0 || isNaN(reps) || reps <= 0){
      showToast('Enter a weight and reps first');
      return;
    }

    ui.confirmModal = {
      kind: 'add-set-global',
      title: 'Add this set?',
      message: fmtWeight(weightKg) + ' ' + unitLabel() + ' \u00d7 ' + reps + ' will be logged for ' + ex.name + '.',
      confirmLabel: 'Add Set',
      variant: 'primary',
      exId: ex.id,
      weightKg: weightKg,
      reps: reps,
      toFailure: target.failureBtn ? target.failureBtn.classList.contains('active') : false
    };
    renderApp();
  }

  function deleteSet(exId, setId){
    var session = getActiveSession();
    var ex = findExercise(session, exId);
    if (!ex) return;
    ex.sets = ex.sets.filter(function(s){ return s.id !== setId; });
    recomputeExercisePRs(ex.name);
    saveSessions();
    if (ui.editingSet && ui.editingSet.setId === setId) ui.editingSet = null;
    renderApp();
  }

  function editSet(exId, setId){
    ui.editingSet = { exId: exId, setId: setId };
    renderApp();
    setTimeout(function(){
      var card = document.querySelector('.exercise-card[data-ex="'+exId+'"]');
      var input = card && card.querySelector('.set-weight-input');
      if (input){ input.focus(); input.select(); }
    }, 30);
  }

  function cancelEditSet(){
    ui.editingSet = null;
    renderApp();
  }

  function saveSetEdit(exId, setId){
    var session = getActiveSession();
    var ex = findExercise(session, exId);
    if (!ex) return;
    var st = ex.sets.find(function(s){ return s.id === setId; });
    if (!st) return;
    var card = document.querySelector('.exercise-card[data-ex="'+exId+'"]');
    var weightInput = card.querySelector('.set-weight-input');
    var repsInput = card.querySelector('.set-reps-input');
    var failureBtn = card.querySelector('.failure-toggle');

    var weightKg = toStoredKg(weightInput.value);
    var reps = parseInt(repsInput.value, 10);
    if (weightKg === null || weightKg <= 0 || isNaN(reps) || reps <= 0){
      showToast('Enter a weight and reps first');
      return;
    }

    st.weightKg = roundNice(weightKg);
    st.reps = reps;
    st.toFailure = failureBtn.classList.contains('active');
    recomputeExercisePRs(ex.name);
    saveSessions();
    ui.editingSet = null;
    renderApp();
    showToast('Set updated');
  }

  function finishSession(){
    var session = getActiveSession();
    session.status = 'done';
    saveSessions();
    ui.editingSet = null;
    showToast('Session saved');
    renderApp();
  }

  function deleteSession(sessionId){
    var removed = state.sessions.find(function(s){ return s.id === sessionId; });
    var affectedNames = {};
    if (removed){
      removed.exercises.forEach(function(ex){ affectedNames[ex.name] = true; });
    }
    state.sessions = state.sessions.filter(function(s){ return s.id !== sessionId; });
    Object.keys(affectedNames).forEach(function(name){ recomputeExercisePRs(name); });
    saveSessions();
    renderApp();
  }

  function renderConfirmModal(){

  function exportData(){
    var payload = { sessions: state.sessions, settings: state.settings, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'iron-ledger-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  }

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if (!data.sessions || !Array.isArray(data.sessions)) throw new Error('bad format');
        state.sessions = data.sessions;
        if (data.settings) state.settings = data.settings;
        saveSessions();
        saveSettings();
        showToast('Backup restored');
        renderApp();
      }catch(err){
        showToast('Could not read that file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* =========================================================
     EVENT DELEGATION
     ========================================================= */
  document.getElementById('app').addEventListener('click', function(e){
    if (e.target.id === 'mmOverlay'){
      ui.showMuscleMap = false;
      ui.selectedMuscle = null;
      ui.pendingMuscle = null;
      renderApp();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;

    if (action === 'set-tab'){
      state.tab = el.dataset.tab;
      ui.pendingMuscle = null;
      ui.editingSet = null;
      ui.showAccountMenu = false;
      ui.confirmModal = null;
      ui.pendingDeleteAccount = false;
      renderApp();
    } else if (action === 'toggle-account-menu'){
      ui.showAccountMenu = !ui.showAccountMenu;
      renderApp();
    } else if (action === 'log-out'){
      ui.confirmModal = {
        kind: 'logout',
        title: 'Log out?',
        message: state.currentAccount === 'guest'
          ? 'You\u2019ll return to the login screen. Guest data stays on this device.'
          : 'You\u2019ll be signed out of ' + currentAccountUsername() + ' on this device.',
        confirmLabel: 'Log out',
        variant: 'primary'
      };
      ui.showAccountMenu = false;
      renderApp();
    } else if (action === 'delete-account'){
      ui.pendingDeleteAccount = true;
      renderApp();
      setTimeout(function(){
        ui.pendingDeleteAccount = false;
        renderApp();
      }, 4000);
    } else if (action === 'confirm-delete-account'){
      ui.pendingDeleteAccount = false;
      deleteAccount();
    } else if (action === 'toggle-unit'){
      state.settings.unit = state.settings.unit === 'kg' ? 'lb' : 'kg';
      saveSettings();
      renderApp();
    } else if (action === 'add-exercise'){
      addExercise();
    } else if (action === 'delete-exercise'){
      openDeleteExerciseConfirm(el.dataset.ex);
    } else if (action === 'toggle-exercise-done'){
      toggleExerciseDone(el.dataset.ex);
    } else if (action === 'add-set'){
      addSet(el.dataset.ex);
    } else if (action === 'add-set-global'){
      if (ui.editingSet) saveSetEdit(ui.editingSet.exId, ui.editingSet.setId);
      else addSetGlobal();
    } else if (action === 'delete-set'){
      openDeleteSetConfirm(el.dataset.ex, el.dataset.set);
    } else if (action === 'edit-set'){
      editSet(el.dataset.ex, el.dataset.set);
    } else if (action === 'save-set-edit'){
      saveSetEdit(el.dataset.ex, el.dataset.set);
    } else if (action === 'cancel-set-edit'){
      cancelEditSet();
    } else if (action === 'toggle-failure'){
      el.classList.toggle('active');
    } else if (action === 'finish-session'){
      openFinishSessionConfirm();
    } else if (action === 'toggle-muscle-map'){
      ui.showMuscleMap = !ui.showMuscleMap;
      ui.selectedMuscle = null;
      ui.pendingMuscle = null;
      renderApp();
    } else if (action === 'mm-view'){
      ui.muscleMapView = el.dataset.view;
      ui.selectedMuscle = null;
      renderApp();
    } else if (action === 'mm-select-muscle'){
      ui.selectedMuscle = el.dataset.muscle;
      renderApp();
    } else if (action === 'mm-add-exercise'){
      addExercise(el.dataset.name, el.dataset.muscle);
    } else if (action === 'mm-custom'){
      ui.pendingMuscle = el.dataset.muscle;
      ui.showMuscleMap = false;
      renderApp();
      setTimeout(function(){
        var inp = document.getElementById('newExInput');
        if (inp) inp.focus();
      }, 50);
    } else if (action === 'toggle-history'){
      var sid = el.dataset.session;
      ui.expandedHistory[sid] = !ui.expandedHistory[sid];
      renderApp();
    } else if (action === 'edit-history-name'){
      editHistoryName(el.dataset.session);
    } else if (action === 'save-history-name'){
      saveHistoryName(el.dataset.session);
    } else if (action === 'cancel-history-name'){
      cancelHistoryNameEdit();
    } else if (action === 'delete-session'){
      openDeleteSessionConfirm(el.dataset.session);
    } else if (action === 'print-session'){
      printSessionReceipt(el.dataset.session);
    } else if (action === 'set-unit'){
      state.settings.unit = el.dataset.unit;
      saveSettings();
      renderApp();
    } else if (action === 'export-data'){
      exportData();
    } else if (action === 'import-data'){
      document.getElementById('importFile').click();
    } else if (action === 'clear-data'){
      openClearDataConfirm();
    }
  });

  document.getElementById('app').addEventListener('input', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.role === 'session-name'){
      var session = getActiveSession();
      session.name = t.value;
      saveSessions();
    }
    if (t.classList && (t.classList.contains('set-weight-input') || t.classList.contains('set-reps-input'))){
      refreshAddSetGlobalBtn();
    }
    if (t.id === 'newExInput'){
      refreshAddExBtn();
    }
  });

  document.getElementById('app').addEventListener('focusin', function(e){
    var t = e.target;
    if (t.classList && (t.classList.contains('set-weight-input') || t.classList.contains('set-reps-input'))){
      ui.activeExId = t.dataset.ex;
      refreshAddSetGlobalBtn();
    }
  });

  document.getElementById('app').addEventListener('change', function(e){
    var t = e.target;
    if (t.matches('.progress-select')){
      ui.progressExercise = t.value;
      renderApp();
    }
  });

  document.getElementById('app').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      if (e.target.id === 'newExInput'){
        e.preventDefault();
        addExercise();
      } else if (e.target.classList.contains('set-reps-input')){
        e.preventDefault();
        ui.activeExId = e.target.dataset.ex;
        if (ui.editingSet) saveSetEdit(ui.editingSet.exId, ui.editingSet.setId);
        else addSetGlobal();
      } else if (e.target.id === 'hiNameInput'){
        e.preventDefault();
        saveHistoryName(ui.editingHistoryName);
      }
    } else if (e.key === 'Escape' && e.target.id === 'hiNameInput'){
      e.preventDefault();
      cancelHistoryNameEdit();
    }
  });

  // Close the account menu when tapping anywhere outside it.
  document.addEventListener('click', function(e){
    if (!ui.showAccountMenu) return;
    var wrap = document.querySelector('.account-wrap');
    if (wrap && !wrap.contains(e.target)){
      ui.showAccountMenu = false;
      renderApp();
    }
  });

  var authGateEl = document.getElementById('authGate');
  authGateEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'auth-mode'){
      ui.authMode = el.dataset.mode;
      ui.authError = null;
      renderAuthGate();
    } else if (action === 'do-login'){
      handleLogIn(
        document.getElementById('authUsername').value,
        document.getElementById('authPassword').value
      );
    } else if (action === 'do-signup'){
      handleSignUp(
        document.getElementById('authUsername').value,
        document.getElementById('authPassword').value,
        document.getElementById('authConfirm').value
      );
    } else if (action === 'continue-guest'){
      continueAsGuest();
    }
  });
  authGateEl.addEventListener('input', function(e){
    if (e.target.id === 'authUsername'){
      ui.authDraft.username = e.target.value;
    }
  });
  authGateEl.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var mode = ui.authMode || 'login';
    var btn = authGateEl.querySelector(mode === 'signup' ? '[data-action="do-signup"]' : '[data-action="do-login"]');
    if (btn) btn.click();
  });

  var confirmOverlayEl = document.getElementById('confirmOverlay');
  confirmOverlayEl.addEventListener('click', function(e){
    if (e.target === confirmOverlayEl){
      ui.confirmModal = null;
      renderApp();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'cancel-confirm'){
      ui.confirmModal = null;
      renderApp();
    } else if (action === 'confirm-modal-action'){
      var m = ui.confirmModal;
      ui.confirmModal = null;
      renderConfirmModal();
      if (m && m.kind === 'exercise') deleteExercise(m.exId);
      else if (m && m.kind === 'set') deleteSet(m.exId, m.setId);
      else if (m && m.kind === 'session') deleteSession(m.sessionId);
      else if (m && m.kind === 'finish-session') finishSession();
      else if (m && m.kind === 'clear-data') clearAllData();
      else if (m && m.kind === 'logout') logOut();
      else if (m && m.kind === 'add-set-global'){
        var session = getActiveSession();
        var ex = findExercise(session, m.exId);
        if (ex) commitSet(ex, m.weightKg, m.reps, m.toFailure);
      }
      else if (m && m.kind === 'add-exercise'){
        commitAddExercise(m.name, m.muscle);
      }
      else renderApp();
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (ui.confirmModal){
      ui.confirmModal = null;
      renderApp();
    } else if (ui.showMuscleMap){
      ui.showMuscleMap = false;
      ui.selectedMuscle = null;
      ui.pendingMuscle = null;
      renderApp();
    }
  });

  /* =========================================================
     INIT
     ========================================================= */
  state.currentAccount = determineInitialAccount();
  if (state.currentAccount){
    setCurrentAccountId(state.currentAccount);
    bootAccountData();
    showAppShell();
    renderApp();
  } else {
    showAuthGateShell();
    renderAuthGate();
  }

  // Enables offline use + the "Install app" prompt on Android/Chrome.
  // Silently does nothing over file:// or if the browser lacks support.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // --- Custom "Install App" button ---
  // Chrome/Edge fire beforeinstallprompt; we capture it and trigger it
  // ourselves from our own button instead of relying on the browser's
  // own (often-suppressed) mini-infobar. iOS Safari never fires this
  // event, so we show manual "Add to Home Screen" instructions instead.
  (function(){
    var installBtn = document.getElementById('installAppBtn');
    if (!installBtn) return;
    var deferredPrompt = null;

    function isStandalone(){
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }
    if (isStandalone()) return; // already installed

    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIOS){
      installBtn.classList.remove('hidden');
    }

    installBtn.addEventListener('click', async function(){
      if (deferredPrompt){
        installBtn.classList.add('hidden');
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else if (isIOS){
        alert('To install Iron Ledger:\n\n1. Tap the Share icon\n2. Tap "Add to Home Screen"');
      }
    });

    window.addEventListener('appinstalled', function(){
      installBtn.classList.add('hidden');
      deferredPrompt = null;
    });
  })();
})();
</script>
</body>
</html>
