  .trial-offer-card{
    background:#343330;border:1px solid var(--accent-dim);border-radius:var(--radius-lg);
    padding:18px;text-align:center;margin-bottom:16px;
  }
  .trial-offer-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;}
  .trial-offer-sub{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
  .trial-offer-btn{
    width:100%;background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius);
    padding:14px;font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;
  }
  .trial-offer-btn:active{opacity:0.9;}
  .trial-offer-btn:disabled{opacity:0.6;}
  .trial-offer-confirm-row{display:flex;gap:8px;}
  .trial-offer-confirm-row .trial-offer-btn{flex:1;}
  .trial-offer-cancel-btn{
    flex:1;background:none;border:1px solid var(--line);color:var(--text-dim);
    border-radius:var(--radius);padding:14px;font-family:'Oswald',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;
  }
  .trial-offer-cancel-btn:active{opacity:0.8;}
  .trial-offer-cancel-btn:disabled{opacity:0.5;}
  .trial-offer-divider{
    text-align:center;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;
    letter-spacing:0.05em;margin:4px 0 16px;position:relative;
  }

  /* ---------- Progress lock (Basic tier, 3-day/month window) ---------- */
  .progress-tab-wrap{position:relative;}
  .progress-blur{filter:blur(5px);user-select:none;pointer-events:none;}
  .progress-lock-overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:28px 20px;
    background:rgba(20,22,26,0.62);border-radius:var(--radius);
  }
  .progress-lock-icon{font-size:30px;margin-bottom:10px;}
  .progress-lock-title{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .progress-lock-sub{font-size:12px;color:var(--text-dim);line-height:1.5;max-width:280px;margin-bottom:16px;}
  .progress-lock-cta{
    background:var(--accent);color:#1c1500;border:none;border-radius:var(--radius);
    padding:12px 20px;font-family:'Oswald',sans-serif;font-weight:700;font-size:12.5px;
    letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;
  }

  /* ---------- Redacted timestamp (Basic tier) ---------- */
  .ts-lock{color:var(--text-faint);font-size:10px;cursor:default;}

  /* ---------- Google sign-in button ---------- */
  .auth-google-btn{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:13px;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;
  }
  .auth-google-btn:active{background:var(--panel-3);}
  .auth-google-btn svg{flex-shrink:0;}

  /* ---------- Progress ---------- */
  .progress-select{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius);
    padding:12px;
    font-size:16px;
    margin-bottom:16px;
  }
  .chart-wrap{
    background-color:var(--panel);
    background-image:linear-gradient(180deg, rgba(10,12,16,0.55), rgba(10,12,16,0.85)), url('images/est-1rm-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:16px;
  }
  .chart-stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-family:'JetBrains Mono',monospace;
  }
  .chart-stats .cs-block .cs-label{font-size:10px;color:#c7ccd3;text-transform:uppercase;letter-spacing:0.05em;}
  .chart-stats .cs-block .cs-val{font-size:16px;color:var(--accent);font-weight:700;}
  .chart-empty-note{
    text-align:center;
    color:#c7ccd3;
    font-size:12px;
    padding:22px 10px;
  }
  .pr-list-item{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:8px 0;
    border-top:1px solid var(--line);
    color:var(--text-dim);
  }
  .pr-list-item .pl-w{color:var(--text);font-weight:600;}

  /* ---------- Settings ---------- */
  .settings-group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 14px;
    margin-bottom:16px;
  }
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-top:1px solid var(--line);
  }
  .settings-row:first-child{border-top:none;}
  .settings-row .sr-label{font-size:14px;color:var(--text);font-weight:600;}
  .settings-row .sr-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;line-height:1.4;}
  .settings-row .sr-value{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.02em;
    margin-top:7px;
  }
  .sr-with-avatar{display:flex;align-items:center;gap:12px;min-width:0;}
  .sr-avatar-pic{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--panel-2);
    border:1.5px solid var(--accent-dim);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .settings-row .sr-action,
  .settings-row button.sr-action{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    border-radius:var(--radius-sm);
    padding:8px 14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
  }
  .settings-row button.sr-action-danger{
    color:var(--accent-2);
    border-color:var(--accent-2-dim);
  }
  .settings-row .seg{
    display:flex;
    background:var(--panel-2);
    border-radius:var(--radius-sm);
    padding:3px;
  }
  .settings-row .seg button{
    background:none;border:none;color:var(--text-faint);
    padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .settings-row .seg button.active{background:var(--accent);color:#1c1500;}
  /* ---------- Bodyweight picker overlay ---------- */
  .bw-picker-intro{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
    margin-bottom:22px;
  }
  .bw-picker-section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:10px;
  }
  .bodyweight-picker-display{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    padding-bottom:16px;
  }
  .bodyweight-picker-input{
    width:140px;
    background:none;
    border:none;
    border-bottom:2px solid var(--line);
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:36px;
    font-weight:700;
    text-align:center;
    padding:4px 0 8px;
  }
  .bodyweight-picker-input:focus{outline:none;border-bottom-color:var(--accent);}
  .bodyweight-picker-unit{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:700;
    color:var(--text-faint);
    letter-spacing:0.03em;
  }
  .goal-picker{
    display:flex;
    gap:8px;
    padding:0 0 14px;
  }
  .goal-chip{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 6px;
    cursor:pointer;
  }
  .goal-chip.active{background:var(--accent-dim);border-color:var(--accent);}
  .goal-chip-label{
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    font-weight:700;
    color:var(--text);
    letter-spacing:0.02em;
  }
  .goal-chip.active .goal-chip-label{color:var(--accent);}
  .goal-chip-range{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
  }
  .goal-chip.active .goal-chip-range{color:var(--accent);}
  .routine-actions{display:flex;gap:8px;}
  .settings-version{text-align:center;color:var(--text-faint);font-size:11px;padding:16px 0 4px;letter-spacing:0.02em;}
  /* Accent color theme picker (Settings > Accent Color). Solid color
     circles rather than photo swatches like Card Style — the active
     ring is always --text (not --accent), since --accent equals the
     active swatch's own fill and wouldn't read as a distinct highlight
     against itself. */
  .accent-theme-picker{display:flex;gap:14px;padding:4px 0 14px;}
  .accent-theme-swatch{
    width:40px;height:40px;border-radius:50%;
    border:none;
    box-shadow:0 0 0 2px var(--line);
    cursor:pointer;padding:0;flex-shrink:0;
  }
  .accent-theme-swatch.active{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text);}
  /* Rest timer default-duration presets (Settings > Rest Timer) */
  .rest-preset-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px;}
  .rest-preset-chip{
    flex:1 1 auto;min-width:56px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 6px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
    color:var(--text-dim);cursor:pointer;text-align:center;
  }
  .rest-preset-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  /* Card-background swatch picker (Settings > Card Style). Each swatch
     previews its actual photo as a small thumbnail so the choice is
     visual, not just a label. */
  .card-bg-picker{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    padding:4px 0 14px;
  }
  .card-bg-swatch{
    position:relative;
    width:62px;
    height:62px;
    flex-shrink:0;
    border-radius:var(--radius);
    border:2px solid var(--line);
    background-color:var(--panel-2);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    padding:0;
    overflow:hidden;
  }
  .card-bg-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.3);}
  .card-bg-swatch[data-bg="chest"]{background-image:url('images/chest-bg.jpg');}
  .card-bg-swatch[data-bg="back"]{background-image:url('images/back-bg.jpg');}
  .card-bg-swatch[data-bg="shoulder"]{background-image:url('images/shoulder-bg.jpg');}
  .card-bg-swatch[data-bg="arms"]{background-image:url('images/arms-bg.jpg');}
  .card-bg-swatch[data-bg="legs"]{background-image:url('images/legs-bg.jpg');}
  .card-bg-swatch[data-bg="abs"]{background-image:url('images/abs-bg.jpg');}
  .card-bg-swatch[data-bg="default"]{background-image:url('images/exercise-card-bg.jpg');}
  .card-bg-swatch-label{
    width:100%;
    font-size:8px;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:#fff;
    background:rgba(0,0,0,0.6);
    padding:3px 4px;
    text-align:center;
    line-height:1.2;
  }
  .card-bg-swatch[data-bg="none"]{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-bg-swatch[data-bg="none"] .card-bg-swatch-label{
    width:auto;
    background:none;
    color:var(--text-faint);
    font-size:9px;
  }
  .card-bg-swatch.active[data-bg="none"] .card-bg-swatch-label{color:var(--accent);}

  /* ---------- Running rest timer bar ---------- */
  .stopwatch-bar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    border-top:1px solid var(--accent);
    background:rgba(var(--accent-rgb),0.10);
  }
  .stopwatch-bar.hidden{display:none;}
  .stopwatch-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .stopwatch-time{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    font-weight:700;
    color:var(--text);
    flex:1;
  }
  .stopwatch-stop-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .stopwatch-stop-btn:active{background:var(--panel-3);}
  .session-finish-bar{
    flex-shrink:0;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px 16px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .session-finish-bar.hidden{display:none;}
  .session-finish-bar.kb-hide{display:none;}
  .editing-past-banner.kb-hide{display:none;}
  .tabbar.kb-hide{display:none;}
  .session-finish-bar .btn-primary{
    flex:0 1 50%;
    margin-top:0;
    padding:11px;
    font-size:13px;
  }
  .add-set-global-btn{
    flex:1;
    padding:11px;
    border:none;
    border-radius:var(--radius-sm);
    background:var(--accent);
    color:#1c1500;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .add-set-global-btn:active{opacity:0.85;}
  .add-set-global-btn:disabled{
    background:var(--panel-2);
    color:var(--text-faint);
    cursor:not-allowed;
    opacity:0.7;
  }

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + var(--safe-bottom));
    max-width:480px;
    margin:0 auto;
    width:100%;
  }
  .tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:600;
    padding:8px 4px 6px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    border-radius:var(--radius-sm);
  }
  .tabbar button .tab-glyph{font-size:17px;}
  .tabbar button .tab-glyph svg{width:17px;height:17px;display:block;}
  .tabbar button.active{color:var(--accent);}
  .tabbar button:active{background:var(--panel-2);}

  .toast{
    position:fixed;
    bottom:calc(90px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-3);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 18px;
    border-radius:var(--radius-xl);
    font-size:13px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ---------- Delete confirmation overlay ---------- */
  .confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(8,9,11,0.68);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
  }
  /* The confirm/"are you sure?" dialog can be triggered from inside any
     other overlay (Brief's Clear all, History's Delete session, Danger
     Zone, etc.) — it needs to always win the stacking order regardless
     of which overlay opened it, not just whichever happens to sit later
     in the HTML. Every other overlay shares the same z-index as the one
     above, so document order decides ties; this one's z-index is bumped
     above all of them so it's never buried behind whatever it was
     opened on top of. */
  #confirmOverlay{ z-index:150; }
  .confirm-overlay.hidden{display:none;}
  .confirm-overlay:not(.hidden){animation:overlayBackdropIn 0.15s ease;}
  .confirm-overlay:not(.hidden) .confirm-panel,
  .confirm-overlay:not(.hidden) .pro-panel{
    animation:overlayPanelIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .confirm-panel{
    width:100%;
    max-width:340px;
    background-color:var(--panel-2);
    background-image:linear-gradient(180deg, rgba(36,40,48,0.90), rgba(36,40,48,0.96)), url('images/confirm-bg.jpg');
    background-size:cover;
    background-position:center;
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 20px 20px;
    box-shadow:0 16px 48px rgba(0,0,0,0.55);
  }
  .confirm-title{
    font-family:'Oswald',sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
    letter-spacing:0.01em;
  }
  .confirm-message{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
    margin-bottom:20px;
  }
  .confirm-buttons{display:flex;gap:10px;}
  .confirm-btn-cancel{
    flex:1;
    min-height:44px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .confirm-btn-cancel:active{background:var(--panel-3);}
  .confirm-btn-danger{
    flex:1;
    min-height:44px;
    border-radius:var(--radius);
    border:none;
    background:var(--accent-2);
    color:#fdf1f0;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .confirm-btn-danger:active{opacity:0.85;}
  .confirm-btn-primary:active{opacity:0.85;}
  .confirm-btn-info:active{opacity:0.85;}
  .confirm-btn-danger:disabled,
  .confirm-btn-primary:disabled,
  .confirm-btn-info:disabled{
    background:var(--panel-2);
    color:var(--text-faint);
    cursor:not-allowed;
    opacity:1;

<script type="module">
  // =========================================================
  // FIREBASE — Auth + Firestore sync. Real accounts (email/password)
  // work across devices, and workout data (sessions/routines/settings)
  // syncs through Firestore too — one document per user, pushed on
  // every local save and pulled down on login. Guest mode stays
  // fully local-only and never touches Firebase.
  // =========================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged, deleteUser, GoogleAuthProvider, signInWithPopup,
    reauthenticateWithCredential, EmailAuthProvider, reauthenticateWithPopup,
    sendPasswordResetEmail, updatePassword
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, deleteDoc, enableIndexedDbPersistence, onSnapshot, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getMessaging, getToken, onMessage, isSupported as isMessagingSupported
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js";

  // ---- PASTE YOUR FIREBASE PROJECT CONFIG HERE ----
  // Firebase console → Project settings → Your apps → SDK setup and config
  const firebaseConfig = {
    apiKey: "AIzaSyA5zTxIK6Yn81BZ03_rlUUgWjGBkbtL2Wo",
    authDomain: "iron-ledge.firebaseapp.com",
    projectId: "iron-ledge",
    storageBucket: "iron-ledge.firebasestorage.app",
    messagingSenderId: "978680753798",
    appId: "1:978680753798:web:13fdbdb6b4bd3dbc72ab07"
  };
  // ---------------------------------------------------

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // Lets writes/reads queue locally and sync automatically when back
  // online, instead of failing outright while offline.
  enableIndexedDbPersistence(db).catch(function(){ /* multiple tabs open, or unsupported browser — sync just won't be offline-durable, not fatal */ });

  // ---------------------------------------------------
  // PUSH NOTIFICATIONS (Firebase Cloud Messaging)
  // Wrapped so a browser that doesn't support messaging (older Safari,
  // no service-worker support, etc.) can never throw during module load
  // and take the rest of Firebase (auth/sync) down with it — every
  // messaging call below resolves to null instead on failure.
  // ---------------------------------------------------
  var messagingInstance = null;
  var messagingChecked = false;
  function getMessagingInstance(){
    if (messagingChecked) return Promise.resolve(messagingInstance);
    return isMessagingSupported().then(function(supported){
      messagingChecked = true;
      if (!supported) return null;
      try {
        messagingInstance = getMessaging(app);
      } catch (e){
        messagingInstance = null;
      }
      return messagingInstance;
    }).catch(function(){
      messagingChecked = true;
      return null;
    });
  }

  // The one email that gets permanent Pro, no payment or trial/expiry
  // check ever applied to it. Sourced from window.SaviorConfig, which
  // the main app script sets before this deferred module ever runs —
  // see the comment there. Don't hardcode a value here; edit it in the
  // main app script only, so the two layers can't drift apart.
  var DEV_OVERRIDE_EMAIL = window.SaviorConfig && window.SaviorConfig.devEmail;
  var TRIAL_DAYS = (window.SaviorConfig && window.SaviorConfig.trialDays) || 14;

  window.SaviorFirebase = {
    signUp: function(email, password){
      return createUserWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user; });
    },
    logIn: function(email, password){
      return signInWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user; });
    },
    resetPassword: function(email){
      return sendPasswordResetEmail(auth, email);
    },
    // Requires a recent sign-in (Firebase throws auth/requires-recent-login
    // otherwise) — callers should always run reauthenticate() first, same
    // as the account-deletion flow does.
    changePassword: function(newPassword){
      var user = auth.currentUser;
      if (!user) return Promise.reject({ code: 'auth/no-current-user' });
      return updatePassword(user, newPassword);
    },
    signInWithGoogle: function(){
      return signInWithPopup(auth, googleProvider).then(function(cred){ return cred.user; });
    },
    logOut: function(){
      return signOut(auth);
    },
    deleteCurrentUser: function(){
      return auth.currentUser ? deleteUser(auth.currentUser) : Promise.resolve();
    },
    // True for an account that signed in with Google only (no email/password
    // credential on file) — those accounts have no password to check, so
    // re-auth has to go through a Google popup instead. Synchronous: just
    // reads the already-loaded currentUser's providerData, no network call.
    isGoogleOnlyAccount: function(){
      var user = auth.currentUser;
      if (!user || !user.providerData) return false;
      var hasGoogle = user.providerData.some(function(p){ return p.providerId === 'google.com'; });
      var hasPassword = user.providerData.some(function(p){ return p.providerId === 'password'; });
      return hasGoogle && !hasPassword;
    },
    // Re-proves the currently signed-in user's identity right before a
    // destructive action (account deletion) — Firebase requires a recent
    // sign-in for deleteUser() anyway, and this doubles as an explicit
    // "are you really you" check so a device left unlocked/logged-in
    // can't have its account deleted by someone else in one tap.
    // Google-only accounts re-auth via popup and ignore the password arg;
    // email/password accounts need a non-empty password.
    reauthenticate: function(password){
      var user = auth.currentUser;
      if (!user) return Promise.reject({ code: 'auth/no-current-user' });
      var hasGoogle = user.providerData.some(function(p){ return p.providerId === 'google.com'; });
      var hasPassword = user.providerData.some(function(p){ return p.providerId === 'password'; });
      if (hasGoogle && !hasPassword){
        return reauthenticateWithPopup(user, googleProvider);
      }
      if (!password) return Promise.reject({ code: 'auth/missing-password' });
      var cred = EmailAuthProvider.credential(user.email, password);
      return reauthenticateWithCredential(user, cred);
    },
    onAuthChange: function(cb){
      return onAuthStateChanged(auth, cb);
    },
    // Used only to call the send-trial-email Netlify function — proves
    // to that function this request really came from a logged-in
    // Firebase user, so it can't be used to spam arbitrary addresses.
    getIdToken: function(){
      return auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(null);
    },
    // NOTE: merge:true is essential here — this doc also holds tier/
    // subscription/trial fields (see ensureUserDoc below). A plain
    // (non-merge) setDoc on every workout save would silently wipe
    // those fields back out the next time the user logs a set.
    saveUserData: function(uidVal, data){
      return setDoc(doc(db, 'users', uidVal), {
        sessions: data.sessions || [],
        routines: data.routines || [],
        settings: data.settings || {},
        updatedAt: Date.now()
      }, { merge: true });
    },
    loadUserData: function(uidVal){
      return getDoc(doc(db, 'users', uidVal)).then(function(snap){
        return snap.exists() ? snap.data() : null;
      });
    },
    deleteUserData: function(uidVal){
      return deleteDoc(doc(db, 'users', uidVal));
    },
    // Creates the /users/{uid} tier/subscription fields exactly once,
    // the first time this account is ever seen. Does NOT start the
    // 14-day free trial — trial only begins when the user explicitly
    // taps "Start Free Trial" in the pricing modal (see startTrial()
    // below). Dev override email still gets permanent Pro immediately.
    // Safe to call on every login: it's a no-op once the doc exists.
    ensureUserDoc: function(uidVal, email){
      var ref = doc(db, 'users', uidVal);
      return getDoc(ref).then(function(snap){
        var existing = snap.exists() ? snap.data() : null;
        if (existing){
          return existing;
        }
        var now = Date.now();
        var isDev = (email || '').trim().toLowerCase() === DEV_OVERRIDE_EMAIL;
        var fresh = {
          email: email || '',
          tier: 'basic',
          isDev: isDev,
          trialStartDate: null,
          trialEndDate: null,
          subscription: { status: isDev ? 'dev' : 'none', plan: null, currentPeriodEnd: null, startedAt: null },
          progressAccess: {},
          createdAt: now,
          updatedAt: now
        };
        return setDoc(ref, fresh, { merge: true }).then(function(){
          // __isNewAccount is an in-memory-only marker for enterAccount()
          // to detect "just signed up" and trigger the welcome push —
          // it was never included in the setDoc call above, so it's
          // never written to Firestore, only seen on this one resolve.
          fresh.__isNewAccount = true;
          return fresh;
        });
      });
    },
    // Called only when the user explicitly taps "Start Free Trial" in
    // the pricing modal. One-time — enforced two ways: (1) Firestore
    // rules reject this write if trialStartDate is already set on the
    // /users/{uid} doc, so it can't be replayed to extend the trial;
    // (2) a permanent, undeletable /trialClaims/{uid} doc is written in
    // the SAME batch, and the update rule also requires that doc not
    // already exist. That second check is what stops someone from
    // deleting just their /users/{uid} doc (bypassing the app entirely,
    // straight through the Firestore SDK) to make ensureUserDoc() treat
    // them as brand-new and hand out a fresh trial — trialClaims never
    // gets deleted, so the exists() check still blocks it. Needs the
    // matching Firestore security rules (see notes near DEV_OVERRIDE_EMAIL).
    // Deliberately does not touch subscription/tier/isDev (the update
    // security rule blocks client writes to those).
    startTrial: function(uidVal){
      var now = Date.now();
      var end = now + TRIAL_DAYS * 24 * 60 * 60 * 1000;
      var batch = writeBatch(db);
      batch.set(doc(db, 'users', uidVal), {
        trialStartDate: now,
        trialEndDate: end,
        updatedAt: now
      }, { merge: true });
      batch.set(doc(db, 'trialClaims', uidVal), { claimedAt: now });
      return batch.commit().then(function(){
        return { trialStartDate: now, trialEndDate: end };
      });
    },
    // Realtime listener on the user's own doc — picks up subscription
    // changes (e.g. a future payment webhook writing currentPeriodEnd)
    // without needing a reload or re-login.
    onUserDocChange: function(uidVal, cb){
      return onSnapshot(doc(db, 'users', uidVal), function(snap){
        cb(snap.exists() ? snap.data() : null, snap.metadata);
      }, function(err){ console.error('User doc listen failed:', err); });
    },
    // Client-side partial updates — used for things a user is allowed to
    // touch themselves (e.g. this month's Progress-tab first-use marker).
    // Security rules block this same path from writing tier/isDev/subscription.
    updateUserDoc: function(uidVal, data){
      return setDoc(doc(db, 'users', uidVal), data, { merge: true });
    },
    // Asks for notification permission, then exchanges it for an FCM
    // token scoped to the page's already-registered service worker
    // (sw.js) — reused rather than a separate firebase-messaging-sw.js,
    // so there's only one service worker controlling the page. sw.js
    // itself needs the Firebase Messaging background-handler snippet
    // added to it for this to actually work; see the setup notes.
    // Resolves to { token, error } — token is null on any failure, with
    // error set to a short diagnostic string (permission state, "not
    // supported", or the underlying getToken() error name/message) so
    // the caller can surface exactly what went wrong instead of a
    // generic "didn't work."
    requestPushToken: function(vapidKey){
      if (!('Notification' in window) || !('serviceWorker' in navigator)){
        return Promise.resolve({ token: null, error: 'not supported in this browser' });
      }
      return Notification.requestPermission().then(function(permission){
        if (permission !== 'granted') return { token: null, error: 'permission: ' + permission };
        return navigator.serviceWorker.ready.then(function(reg){
          return getMessagingInstance().then(function(messaging){
            if (!messaging) return { token: null, error: 'messaging unsupported in this browser' };
            return getToken(messaging, { vapidKey: vapidKey, serviceWorkerRegistration: reg })
              .then(function(token){ return { token: token, error: null }; });
          });
        });
      }).catch(function(err){
        console.error('Push permission/token failed:', err);
        var msg = err && (err.code || err.message) ? (err.code || err.message) : String(err);
        return { token: null, error: msg };
      });
    },
    // Fires cb(payload) for a push that arrives while this tab is open
    // and focused. Background pushes (tab closed/backgrounded) are
    // handled entirely inside sw.js instead — this never sees those.
    onForegroundPush: function(cb){
      getMessagingInstance().then(function(messaging){
        if (messaging) onMessage(messaging, cb);
      });
    }
  };

  window.dispatchEvent(new Event('savior-firebase-ready'));
</script>

<script>
(function(){
  "use strict";

  /* =========================================================
     STATE
     ========================================================= */
  var STORAGE_SESSIONS = 'il_sessions_v1';
  var STORAGE_SETTINGS = 'il_settings_v1';
  var STORAGE_CURRENT_ACCOUNT = 'il_current_account_v1';
  var STORAGE_ROUTINES = 'il_routines_v1';
  var STORAGE_ACTIVITY_LOG = 'il_activity_log_v1';
  var STORAGE_PROGRESS_ACCESS = 'il_progress_access_v1';
  var ACTIVITY_LOG_MAX = 300;
  var ACTIVITY_LOG_FREE_AGE_MS = 24 * 60 * 60 * 1000;      // Basic: Brief entries auto-expire after 24h
  var ACTIVITY_LOG_PRO_AGE_MS = 7 * 24 * 60 * 60 * 1000;   // Pro: extended to 7 days

  /* =========================================================
     SUBSCRIPTION / PRO TIER
     Basic (free) vs Pro. Pro is unlocked by, in priority order:
       1. the developer override email — permanent, no checks
       2. an active 14-day free trial (trialEndDate) — NOT started
          automatically at signup; only begins the moment the user

  function scopedKey(base){

  // Maps Firebase Auth error codes to friendly, human-readable messages.
  function firebaseAuthErrorMessage(err){
    var code = err && err.code;
    switch (code){
      case 'auth/email-already-in-use': return 'That email is already registered';
      case 'auth/invalid-email': return 'Enter a valid email address';
      case 'auth/weak-password': return 'Password must be at least 6 characters';
      case 'auth/user-not-found': return 'No account with that email';
      case 'auth/wrong-password': return 'Incorrect password';
      case 'auth/invalid-credential': return 'Incorrect email or password';
      case 'auth/too-many-requests': return 'Too many attempts — try again in a bit';
      case 'auth/network-request-failed': return 'Network error — check your connection';
      case 'auth/operation-not-allowed': return 'Email/Password sign-in isn\u2019t enabled yet in Firebase console';
      case 'auth/unauthorized-domain': return 'This domain isn\u2019t whitelisted yet in Firebase console';
      default: return 'Something went wrong (' + (code || 'unknown error') + ') — try again';
    }
  }

  // Wraps localStorage.setItem so a quota/availability failure (Safari
  // Private Browsing caps localStorage at ~0 bytes, some browsers block
  // it entirely) never throws up into a caller like commitSet() and
  // silently kills the "log a set" flow mid-workout. Returns true/false
  // so callers can warn the user once instead of failing invisibly.
  function safeSetItem(key, value){
    try{
      localStorage.setItem(key, value);
      return true;
    }catch(e){
      console.error('localStorage write failed:', e);
      return false;
    }
  }

  // (Safari Private Browsing, some in-app browsers) removeItem can throw
  // instead of silently no-op'ing. Used during account deletion so one

  function safeRemoveItem(key){

      localStorage.removeItem(key);
      return true;

      return false;
    }
  }

  // Records an entry in the Brief (activity log) — every add/edit/delete/rename
  // made from the Log or History tabs funnels through here. tag is 'Log' or

  function activityLogMaxAgeMs(){

  function logActivity(message, tag){
    state.activityLog.unshift({
      id: uid(),
      time: new Date().toISOString(),
      message: message,
      tag: tag || 'Log'

    var cutoff = Date.now() - activityLogMaxAgeMs();
    state.activityLog = state.activityLog.filter(function(entry){
      var t = new Date(entry.time).getTime();
      return !isNaN(t) && t >= cutoff;
    });
    if (state.activityLog.length > ACTIVITY_LOG_MAX){
      state.activityLog.length = ACTIVITY_LOG_MAX;
    }
    saveActivityLog();
  }

  // Drops any Brief entry older than the current plan's retention window
  // (24h Basic / 7 days Pro — see activityLogMaxAgeMs). Only touches the
  // activity log — sessions, routines, and History are never affected by
  // this. Returns true if anything was actually removed (so callers can
  // skip a save/re-render when there's nothing stale).
  function purgeStaleActivity(){
    var cutoff = Date.now() - activityLogMaxAgeMs();
    var before = state.activityLog.length;
    state.activityLog = state.activityLog.filter(function(entry){
      var t = new Date(entry.time).getTime();
      return !isNaN(t) && t >= cutoff;
    });
    if (state.activityLog.length !== before){
      saveActivityLog();
      return true;
    }
    return false;
  }

  /* =========================================================
     UNIT HELPERS  (weights always stored internally in kg)
     ========================================================= */
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }
  function toDisplay(kg){
    var v = state.settings.unit === 'kg' ? kg : kgToLb(kg);
    return roundNice(v);
  }
  function toStoredKg(displayVal){
    var v = parseFloat(displayVal);
    if (isNaN(v)) return null;
    return state.settings.unit === 'kg' ? v : lbToKg(v);
  }
  function roundNice(v){
    return Math.round(v * 100) / 100;
  }
  function fmtWeight(kg){
    var v = toDisplay(kg);
    var rounded = Math.round(v * 10) / 10;
    return (rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1));
  }
  function unitLabel(){ return state.settings.unit; }

  // Anything above this is virtually never a real lift — it's a fat finger
  // (extra zero, decimal in the wrong place). Only used as a fallback for
  // an exercise that's never been logged before, since there's nothing to
  // compare against yet. Stored value is always kg regardless of the
  // user's display unit.
  var MAX_LOGGABLE_WEIGHT_KG = 500;
  // Muscle-group-specific ceilings, used instead of the flat cap above
  // whenever the exercise has a known muscle. A flat 500kg cap is way too
  // loose for a bicep curl (world-record strict curls top out ~110kg) and,
  // for a couple of high-leverage movements, arguably too tight (leg press
  // and hip thrust can legitimately load past 500kg on machine leverage).
  // Ceilings below are set generously above real raw/equipped world-record
  // territory for the heaviest common exercise in that muscle group, so a
  // genuinely strong lifter is never blocked — this is a typo catcher, not
  // a strength judgment. Any exercise whose muscle isn't in this table (or
  // has no muscle set at all, e.g. some custom entries) falls back to the
  // flat cap above.
  var MUSCLE_MAX_LOAD_KG = {
    Quads: 700,      // leg press's machine leverage holds far more than a squat
    Glutes: 500,      // hip thrust has huge leverage; records exceed 400kg
    Back: 500,      // deadlift lives here; raw record is ~501kg
    Traps: 350,      // shrugs can get deadlift-adjacent heavy
    Calves: 400,      // short-range, high-leverage machine movements
    Hamstrings: 350,      // RDL can get heavy; leg curl machines can't
    Chest: 350,      // raw bench record ~230kg, generous buffer above
    Shoulders: 250,      // OHP record ~217kg; lateral raises nowhere close
    Triceps: 180,      // pushdowns/skull crushers, nothing near bench numbers
    Abs: 120,      // weighted crunches/ab wheel with a plate, at most
    Biceps: 130,      // strict curl records max out ~110kg
    Forearms: 80        // wrist curls, grip work — always light
  };
  function maxLoggableWeightKg(muscle){
    return (muscle && MUSCLE_MAX_LOAD_KG[muscle]) || MAX_LOGGABLE_WEIGHT_KG;
  }
  // Once an exercise HAS history, the cap tightens to a multiple of your
  // own best on that exact exercise name — adapts automatically whether
  // it's bench, leg press, or something custom-named, no muscle tagging
  // or config needed.
  var HISTORY_CAP_MULTIPLIER = 4;
  // Same idea as MAX_LOGGABLE_WEIGHT_KG, but for reps — a flat sanity
  // ceiling so a fat-fingered "150" instead of "15" can't slip through
  // and feed a wildly wrong number into the overload-tip math.
  var MAX_LOGGABLE_REPS = 100;

  // Highest raw weight ever logged under this exact exercise name (simple
  // max, not e1rm — an intuitive "biggest number you've typed here").
  function bestLoggedWeightKg(exerciseName){
    var name = (exerciseName || '').trim().toLowerCase();
    if (!name) return 0;
    var best = 0;
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name) return;
        ex.sets.forEach(function(st){
          if (st.weightKg > best) best = st.weightKg;
        });
      });
    });
    return best;
  }

  // Returns an error message to show in a toast, or null if the entry is
  // fine to log. exerciseName is optional — omitting it just falls back
  // to the flat sanity cap. muscle is optional too — when known, it's used
  // for a tighter, muscle-appropriate cap instead of the flat one (see
  // MUSCLE_MAX_LOAD_KG above), but only on an exercise's first-ever entry;
  // once there's real history, the cap always tightens to your own best
  // instead. Bodyweight exercises (push-ups, dips, pull-ups) allow exactly
  // 0 here, since 0 added weight is a completely valid, common entry for
  // them — everything else still requires a positive number.
  function weightRepsError(weightKg, reps, exerciseName, muscle){
    var isBW = exerciseName && isBodyweightExercise(exerciseName);
    if (weightKg === null || (isBW ? weightKg < 0 : weightKg <= 0) || isNaN(reps) || reps <= 0) return 'Enter a weight and reps first';
    if (reps > MAX_LOGGABLE_REPS) return 'That\u2019s over ' + MAX_LOGGABLE_REPS + ' reps \u2014 double check the number';
    var priorBest = exerciseName ? bestLoggedWeightKg(exerciseName) : 0;
    if (priorBest > 0){
      var cap = priorBest * HISTORY_CAP_MULTIPLIER;
      if (weightKg > cap) return 'That\u2019s way past your best here (' + fmtWeight(priorBest) + ' ' + unitLabel() + ') \u2014 double check the number';
    } else {
      var flatCap = maxLoggableWeightKg(muscle);
      if (weightKg > flatCap) return 'That\u2019s over ' + fmtWeight(flatCap) + ' ' + unitLabel() + ' \u2014 double check the number';
    }
    return null;
  }

  /* =========================================================
     SESSION / EXERCISE / SET HELPERS
     ========================================================= */
  function getActiveSession(){
    var active = state.sessions.find(function(s){ return s.status === 'active'; });
    if (active && active.exercises.length === 0 && !isSameLocalDay(active.date)){
      // Left over from a previous day, never actually used (no exercises
      // added yet) — treat it as today's session instead of showing
      // yesterday's date on an empty log. A session that already has
      // exercises is left alone even across midnight, since that's a real
      // in-progress workout, not a stale leftover.
      active.date = new Date().toISOString();
      saveSessions();
    }
    if (!active){
      active = {
        id: uid(),
        name: '',
        date: new Date().toISOString(),
        status: 'active',
        exercises: []
      };
      state.sessions.unshift(active);
      saveSessions();
    }
    return active;
  }

  // ---- IN-APP "HAVEN'T TRAINED IN A WHILE" NUDGE ----
  // Free, no backend: just checks the gap since your last finished session
  // whenever the app is opened. Not a real push notification — this only
  // shows up while you're actually looking at the app.
  function daysSinceLastWorkout(){
    var doneSessions = state.sessions.filter(function(s){ return s.status === 'done'; });
    if (!doneSessions.length) return null;
    var latest = doneSessions.reduce(function(a, b){
      var aTime = new Date(a.finishedAt || a.date).getTime();
      var bTime = new Date(b.finishedAt || b.date).getTime();
      return aTime > bTime ? a : b;
    });
    var lastDate = new Date(latest.finishedAt || latest.date);
    var now = new Date();
    var d1 = new Date(lastDate.getFullYear(), lastDate.getMonth(), lastDate.getDate());
    var d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((d2 - d1) / 86400000);
  }
  function reminderDismissedToday(){
    var stored = localStorage.getItem(scopedKey('il_reminder_dismissed'));
    return stored === new Date().toDateString();
  }
  function dismissReminderToday(){
    safeSetItem(scopedKey('il_reminder_dismissed'), new Date().toDateString());
  }

  // Install-banner dismissal is a device/browser-level decision, not a
  // per-account one — deliberately NOT run through scopedKey() (unlike
  // the reminder dismiss above), so it stays dismissed across logging
  // in/out of different accounts on the same device. Permanent (no
  // daily reset) since re-nagging about installing every day would be
  // far more annoying than the "haven't logged a workout" reminder.
  function installBannerDismissedPermanently(){
    return localStorage.getItem('il_install_banner_dismissed_v1') === '1';
  }
  function dismissInstallBannerPermanently(){
    safeSetItem('il_install_banner_dismissed_v1', '1');
  }

  // Re-derive isPR flags for every set of a given exercise name, across all
  // sessions, in chronological order. Needed after an edit or delete since
  // changing one set can change which sets before/after it count as PRs.
  function recomputeExercisePRs(exerciseName){
    var key = exerciseName.trim().toLowerCase();
    var entries = [];
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== key) return;
        ex.sets.forEach(function(st){ entries.push({ date: s.date, set: st }); });
      });
    });
    entries.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    var best = 0;
    entries.forEach(function(e){
      var val = e1rm(effectiveLoadKg(exerciseName, e.set.weightKg), e.set.reps);
      var isPR = val > best + 0.001;
      e.set.isPR = isPR;
      if (isPR) best = val;
    });
  }

  // Bodyweight changes what "effective load" means for every bodyweight
  // exercise ever logged, not just new ones — so setting or clearing it
  // recomputes PR flags across full history for every such exercise name,
  // not just going forward. displayVal is whatever's in the Settings
  // input, in the person's current display unit; toStoredKg converts it
  // to kg for storage, matching every other weight value in the app.
  function saveBodyweight(displayVal){
    var trimmed = String(displayVal == null ? '' : displayVal).trim();
    var kg = trimmed === '' ? null : toStoredKg(trimmed);
    if (kg !== null){
      if (isNaN(kg) || kg <= 0) kg = null;
      else kg = Math.max(20, Math.min(400, roundNice(kg))); // sane human range; guards against a fat-fingered value silently wrecking every calculation
    }
    state.settings.bodyweightKg = kg;
    saveSettings();
    allExerciseNames().forEach(function(name){
      if (isBodyweightExercise(name)) recomputeExercisePRs(name);
    });
    saveSessions();
    renderApp();
  }

  function findExercise(session, exId){
    return session.exercises.find(function(e){ return e.id === exId; });
  }

  function allExerciseNames(){
    var set = {};
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(e){
        if (e.name && e.name.trim()) set[e.name.trim()] = true;
      });
    });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  }

  // Common misspellings/shorthand of equipment words, normalized before
  // matching so e.g. typing "dumbell" still finds every "Dumbbell ..."
  // entry instead of silently coming up empty.
  var EXERCISE_QUERY_ALIASES = {
    dumbell: 'dumbbell', dumbells: 'dumbbell', dumbbells: 'dumbbell',
    barbel: 'barbell', barbels: 'barbell', barbells: 'barbell',
    // Common gym shorthand \u2014 maps to a word that actually appears in the
    // matching library entries (e.g. 'ohp' -> 'shoulder' surfaces Barbell/
    // Dumbbell/Machine Shoulder Press, since "overhead press" itself isn't
    // in any name).
    ohp: 'shoulder', rdl: 'romanian', db: 'dumbbell', bb: 'barbell',
    dl: 'deadlift', sldl: 'stiff-leg', sdl: 'sumo', bss: 'bulgarian',
    cgbp: 'close',
    // Alternate spellings people commonly type for hyphenated/single-word
    // library names.
    flys: 'fly', flyes: 'fly', pushups: 'push-ups', pullups: 'pull-ups',
    ezbar: 'ez-bar',
    // Plain English plurals \u2014 every library name is singular ("Bicep
    // Curl", "Barbell Row"), so without this the completely natural
    // "curls"/"rows"/"presses" would silently return nothing.
    curls: 'curl', presses: 'press', rows: 'row', raises: 'raise',
    extensions: 'extension', lunges: 'lunge', squats: 'squat',
    shrugs: 'shrug', kickbacks: 'kickback', pushdowns: 'pushdown',
    thrusts: 'thrust', twists: 'twist'
  };

  // Suggestions for the exercise-name field (both the "+ Add Exercise"
  // blank-name flow and renaming an existing exercise). Two sources,
  // your own logged names first:
  //  1. Names you've already logged (allExerciseNames()) — the strongest
  //     signal for continuity, since picking one guarantees you land on
  //     the exact same string your Progress/PR history is already keyed
  //     on, instead of retyping a near-miss that starts a new line.
  //  2. EXERCISE_LIBRARY_FLAT — the built-in equipment-tagged library,
  //     for exercises you haven't logged yet (or want a consistent
  //     canonical name for from the very first time).
  // If a logged name happens to match a library entry (case-insensitive),
  // its muscle/equipment tag rides along even though it came from your
  // history, so the dropdown stays visually consistent either way.
  //
  // Matching is word-order-independent: the query is split into words,
  // and a name matches as long as every one of those words appears
  // *somewhere* in it — not necessarily in the order typed. So "bench
  // press dumbbell" and "dumbbell bench press" both find "Dumbbell Bench
  // Press", instead of only a query that happens to match the name's
  // exact word order. No result cap — the results list is a full-screen
  // scrollable overlay now, not a small dropdown, so there's no need to
  // truncate matches the way a compact inline list would have required.
  function exerciseQueryTokens(query){
    return (query || '').trim().toLowerCase().split(/\s+/).filter(Boolean).map(function(t){
      return EXERCISE_QUERY_ALIASES[t] || t;
    });
  }
  // Whether the exercise-search filter panel currently has any muscle
  // group or equipment selected — drives the filter icon's active/badge
  // state and whether a "Clear" link is shown in the panel.
  function exFilterActive(){
    var f = ui.exSearchFilters;
    return !!(f && (f.muscles.length || f.equipment.length));
  }

  // Gate used by both the typed-search results (exerciseSuggestions) and
  // the empty-query browse-by-muscle list (exerciseLibraryBrowseHtml) so
  // filtering behaves identically either way. An empty muscles/equipment
  // selection means "no filter on that axis" (everything passes). Entries
  // with no known muscle/equipment (a custom logged name with no library
  // match) are excluded once a filter on that axis is active, since there's
  // no metadata to confirm they'd match.
  function passesExFilters(muscle, equipment){
    var f = ui.exSearchFilters;
    if (!f) return true;
    if (f.muscles.length && (!muscle || f.muscles.indexOf(muscle) === -1)) return false;
    if (f.equipment.length && (!equipment || f.equipment.indexOf(equipment) === -1)) return false;
    return true;
  }

  function exerciseSuggestions(query){
    var tokens = exerciseQueryTokens(query);
    if (!tokens.length) return [];
    var matchesAllTokens = function(nameLower){
      return tokens.every(function(t){ return nameLower.indexOf(t) !== -1; });
    };
    var libraryByName = {};
    EXERCISE_LIBRARY_FLAT.forEach(function(item){ libraryByName[item.name.toLowerCase()] = item; });

    var seen = {};
    var results = [];
    allExerciseNames().forEach(function(name){
      var key = name.toLowerCase();
      if (seen[key] || !matchesAllTokens(key)) return;
      var libMatch = libraryByName[key];
      var muscle = libMatch ? libMatch.muscle : null;
      var equipment = libMatch ? libMatch.equipment : null;
      if (!passesExFilters(muscle, equipment)) return;
      seen[key] = true;
      results.push({ name: name, muscle: muscle, equipment: equipment });
    });
    EXERCISE_LIBRARY_FLAT.forEach(function(item){
      var key = item.name.toLowerCase();
      if (seen[key] || !matchesAllTokens(key)) return;
      if (!passesExFilters(item.muscle, item.equipment)) return;
      seen[key] = true;
      results.push({ name: item.name, muscle: item.muscle, equipment: item.equipment });
    });
    return results;
  }

  function exerciseSuggestItemHtml(name, muscle, equipment){
    return '<button type="button" class="ex-suggest-item" data-action="pick-ex-suggestion" data-name="'+esc(name)+'" data-muscle="'+esc(muscle || '')+'">' +
      '<span class="ex-suggest-name">'+esc(name)+'</span>' +
      (equipment ? '<span class="ex-suggest-tag">'+esc(equipment)+'</span>' : '') +
    '</button>';
  }

  // The full built-in library, browsable by muscle group — shown when the
  // search field is still empty, so there's always something to scroll
  // through and tap rather than a blank screen waiting for input.
  function exerciseLibraryBrowseHtml(){
    var f = ui.exSearchFilters;
    var muscles = Object.keys(EXERCISE_LIBRARY);
    if (f && f.muscles.length){
      muscles = muscles.filter(function(m){ return f.muscles.indexOf(m) !== -1; });
    }
    var html = muscles.map(function(muscle){
      var items = EXERCISE_LIBRARY[muscle];
      if (f && f.equipment.length){
        items = items.filter(function(item){ return f.equipment.indexOf(item.equipment) !== -1; });
      }
      if (!items.length) return '';
      return '<div class="section-label">'+esc(muscle)+'</div>' +
        items.map(function(item){
          return exerciseSuggestItemHtml(item.name, muscle, item.equipment);
        }).join('');
    }).join('');
    if (!html && f && (f.muscles.length || f.equipment.length)){
      return '<div class="ex-filter-empty">No exercises match these filters.</div>';
    }
    return html;
  }

  // Chip + panel markup for the muscle-group / equipment filter shown
  // under the exercise-search header. Rebuilt on open, on every chip tap,
  // and on Clear — but always via renderExFilterPanel()'s targeted DOM
  // update (see below), never a full renderApp(), so the adjacent search
  // input's live typed value is never disturbed.
  function exFilterChipHtml(kind, value, active){
    return '<button type="button" class="ex-filter-chip'+(active ? ' active' : '')+'" data-action="toggle-ex-filter" data-kind="'+kind+'" data-value="'+esc(value)+'">'+esc(value)+'</button>';
  }
  function exFilterPanelHtml(){
    var f = ui.exSearchFilters;
    var muscles = Object.keys(EXERCISE_LIBRARY);
    return '<div class="ex-filter-row-head">' +
        '<span class="ex-filter-row-label">Muscle</span>' +
        (exFilterActive() ? '<button type="button" class="ex-filter-clear" data-action="clear-ex-filters">Clear filters</button>' : '') +
      '</div>' +
      '<div class="ex-filter-chips">' + muscles.map(function(m){
        return exFilterChipHtml('muscle', m, f.muscles.indexOf(m) !== -1);
      }).join('') + '</div>' +
      '<div class="ex-filter-row-head"><span class="ex-filter-row-label">Equipment</span>' +
        '<button type="button" class="eq-guide-btn" data-action="open-equipment-guide" aria-label="What does each equipment type look like?">?</button>' +
      '</div>' +
      '<div class="ex-filter-chips">' + EQUIPMENT_FILTER_OPTIONS.map(function(eq){
        return exFilterChipHtml('equipment', eq, f.equipment.indexOf(eq) !== -1);
      }).join('') + '</div>';
  }

  // Targeted refresh for the filter panel + filter icon button only —
  // deliberately mirrors renderExerciseSuggestions() in NOT calling a full
  // renderApp(), because renderExerciseSearchOverlay() rebuilds the whole
  // panel (including #exNameInput's value, from ex.name) and would wipe
  // out whatever the user has typed but not yet saved.
  function renderExFilterPanel(){
    var panelEl = document.getElementById('exFilterPanel');
    if (panelEl){
      panelEl.classList.toggle('hidden', !ui.exFilterPanelOpen);
      panelEl.innerHTML = exFilterPanelHtml();
    }
    var btn = document.getElementById('exFilterToggleBtn');
    if (btn){
      btn.classList.toggle('active', ui.exFilterPanelOpen || exFilterActive());
      var dot = btn.querySelector('.ex-filter-dot');
      if (exFilterActive() && !dot){
        btn.insertAdjacentHTML('beforeend', '<span class="ex-filter-dot"></span>');
      } else if (!exFilterActive() && dot){
        dot.remove();
      }
    }
  }
  function toggleExFilter(kind, value){
    var f = ui.exSearchFilters;
    var list = kind === 'muscle' ? f.muscles : f.equipment;
    var idx = list.indexOf(value);
    if (idx === -1) list.push(value); else list.splice(idx, 1);
    renderExFilterPanel();
    var input = document.getElementById('exNameInput');
    renderExerciseSuggestions(input ? input.value : '');
  }
  function clearExFilters(){
    ui.exSearchFilters = { muscles: [], equipment: [] };
    renderExFilterPanel();
    var input = document.getElementById('exNameInput');
    renderExerciseSuggestions(input ? input.value : '');
  }

  // Live-repopulates the results list in the full-screen exercise-search
  // overlay as the user types — called from the #app 'input' listener, not
  // a full renderApp(), so the input never loses focus/cursor position
  // mid-type. The overlay's own flex layout (input pinned at top, this
  // list filling the rest of #app's already keyboard-aware height) keeps
  // results within the visible area without needing any scroll-into-view
  // logic here.
  function renderExerciseSuggestions(query){
    var el = document.getElementById('exSuggestList');
    if (!el) return;
    var trimmed = (query || '').trim();

    if (!trimmed){
      el.classList.remove('hidden');
      el.innerHTML = exerciseLibraryBrowseHtml();
      return;
    }

    var matches = exerciseSuggestions(query);
    var exactMatch = matches.some(function(m){ return m.name.toLowerCase() === trimmed.toLowerCase(); });

    var html = '';
    // Pinned at the top whenever what's typed isn't already an exact match
    // below — lets a genuinely custom name still be added in one tap,
    // the same way the old inline "+ Custom name" option worked.
    if (!exactMatch){
      html += '<button type="button" class="ex-suggest-custom" data-action="pick-ex-custom" data-name="'+esc(trimmed)+'">Use \u201c'+esc(trimmed)+'\u201d</button>';
    }
    html += matches.map(function(m){
      return exerciseSuggestItemHtml(m.name, m.muscle, m.equipment);
    }).join('');

    el.classList.remove('hidden');
    el.innerHTML = html;
  }

  // Opens/closes/renders the full-screen "search for an exercise" overlay
  // that replaces the old inline name field + small dropdown. Driven by
  // the same ui.editingExerciseName that used to gate the inline editing
  // row, so every existing entry point (add-blank-exercise, rename) keeps
  // working unchanged — only the presentation layer changed.
  //
  // position:fixed;inset:0 (matching the muscle-map overlay, which already
  // renders correctly full-screen) handles the base sizing. On top of that,
  // the height is also set explicitly in JS (called below and again on every
  // visualViewport resize) using the same value #app syncs its own height
  // to — this keeps the overlay keyboard-safe without depending on #app's
  // own height having already resolved first.
  // No-op now that .ex-search-overlay is position:absolute inside #app
  // (see its CSS comment) — it inherits #app's own synced height via
  // inset:0 automatically, so it never needs its own explicit height.
  // Left in place (and still called) so nothing else needs to change.
  function syncExSearchOverlayHeight(){}
  function renderExerciseSearchOverlay(){
    var overlay = document.getElementById('exSearchOverlay');
    var panel = document.getElementById('exSearchPanel');
    var session = getActiveSession();
    var ex = ui.editingExerciseName && session ? findExercise(session, ui.editingExerciseName) : null;
    if (!ui.editingExerciseName || !ex){
      overlay.classList.add('hidden');
      panel.innerHTML = '';
      return;
    }
    overlay.classList.remove('hidden');
    syncExSearchOverlayHeight();
    panel.innerHTML =
      '<div class="ex-search-head">' +
        '<button class="ex-search-back" data-action="cancel-exercise-name" aria-label="Close">' +
          '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>' +
        '</button>' +
        '<input type="text" class="ex-search-input" id="exNameInput" maxlength="60" value="'+esc(ex.name)+'" placeholder="Search exercises\u2026" autocomplete="off">' +
        '<button class="ex-search-filter'+(ui.exFilterPanelOpen || exFilterActive() ? ' active' : '')+'" id="exFilterToggleBtn" data-action="toggle-ex-filter-panel" aria-label="Filter exercises">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 4 21 4 14 12.5 14 19 10 21 10 12.5 3 4"></polygon></svg>' +
          (exFilterActive() ? '<span class="ex-filter-dot"></span>' : '') +
        '</button>' +
      '</div>' +
      '<div class="ex-filter-panel'+(ui.exFilterPanelOpen ? '' : ' hidden')+'" id="exFilterPanel">' + exFilterPanelHtml() + '</div>' +
      '<div class="ex-suggest-list hidden" id="exSuggestList"></div>';
  }

  // Bodyweight-aware effective load. Exercises tagged "Bodyweight"
  // equipment (push-ups, dips, pull-ups, etc) are logged with just the
  // *added* weight — 0 if none, and the input's own label makes that
  // explicit (see the "+KG"/"+LB" unit shown next to it for these). For
  // every load-based calculation below (e1RM, PR detection, volume,
  // Progress charts, overload tips) the real load being moved is
  // bodyweight + whatever was added, so that's what gets read here rather
  // than the raw logged number. Falls back to the raw weight unchanged
  // whenever bodyweight isn't set or the exercise isn't a bodyweight one,
  // so nothing changes for anyone who leaves it blank.
  function isBodyweightExercise(name){
    if (!name) return false;
    var key = name.trim().toLowerCase();
    return EXERCISE_LIBRARY_FLAT.some(function(item){
      return item.equipment === 'Bodyweight' && item.name.toLowerCase() === key;
    });
  }
  function effectiveLoadKg(name, loggedKg){
    var bw = state.settings && state.settings.bodyweightKg;
    if (bw && bw > 0 && isBodyweightExercise(name)) return loggedKg + bw;
    return loggedKg;
  }
  // Human-readable version for tip/detail text — for a bodyweight exercise
  // with a bodyweight set, spells out the total so the math is legible
  // ("82.5 kg (bodyweight + 2.5 kg)") instead of silently using a bigger
  // number than what's on screen with no explanation.
  function describeLoad(name, loggedKg){
    var bw = state.settings && state.settings.bodyweightKg;
    if (bw && bw > 0 && isBodyweightExercise(name)){
      var eff = loggedKg + bw;
      return loggedKg > 0
        ? fmtWeight(eff) + ' ' + unitLabel() + ' (bodyweight + ' + fmtWeight(loggedKg) + ' ' + unitLabel() + ')'
        : fmtWeight(eff) + ' ' + unitLabel() + ' (bodyweight)';
    }
    return fmtWeight(loggedKg) + ' ' + unitLabel();
  }

  // One-time "you're strong" badge per muscle group, scaled to bodyweight
  // rather than a flat number — same reasoning as everywhere else
  // bodyweight gets used in this app: 90kg means something very different
  // for a 60kg lifter than a 120kg lifter, so the celebration should scale
  // with the person, not a fixed number. Ratios below are a rough "that's
  // genuinely strong" bar per muscle group (roughly advanced-tier on
  // common strength-standard charts for the heaviest typical lift in that
  // category) — approximate on purpose, since a muscle group can span very
  // different movements with very different leverage (Back covers both
  // rows and deadlifts, for instance), same caveat as MUSCLE_MAX_LOAD_KG
  // above. Forearms and Abs are excluded — bodyweight ratio isn't a
  // meaningful way to grade either. Requires a bodyweight to be set in
  // Settings; silently does nothing without one, same as the rest of the
  // bodyweight-aware features.
  var STRENGTH_BADGE_RATIO = {
    Glutes: 2.0,
    Back: 1.5,
    Quads: 1.5,
    Traps: 1.5,
    Calves: 1.5,
    Chest: 1.25,
    Hamstrings: 1.25,
    Shoulders: 0.75,
    Triceps: 0.6,
    Biceps: 0.5
  };
  // Checks whether this set just crossed that muscle's bar for the first
  // time ever; if so, marks it shown (persisted, never re-fires) and
  // returns a toast message. Returns null otherwise — no bodyweight set,
  // muscle not in the table, already earned, or just not heavy enough yet.
  function checkStrengthBadge(ex, weightKg){
    var bw = state.settings && state.settings.bodyweightKg;
    if (!bw || bw <= 0) return null;
    var muscle = ex.muscle;
    var ratio = muscle && STRENGTH_BADGE_RATIO[muscle];
    if (!ratio) return null;
    if (!state.settings.strengthBadges) state.settings.strengthBadges = {};
    if (state.settings.strengthBadges[muscle]) return null;
    var eff = effectiveLoadKg(ex.name, weightKg);
    if (eff / bw < ratio) return null;
    state.settings.strengthBadges[muscle] = true;
    saveSettings();
    return 'That\u2019s strong AF \u2014 ' + muscle + ' just crossed ' + roundNice(ratio) + '\u00d7 your bodyweight on ' + ex.name + ' \ud83d\udcaa';
  }

  function e1rm(weightKg, reps){
    reps = Math.max(1, reps);
    if (reps === 1) return weightKg;
    return weightKg * (1 + reps / 30);
  }

  // best e1rm for a given exercise name across all sessions, excluding one specific set id
  function bestE1RM(exerciseName, excludeSetId){
    var name = exerciseName.trim().toLowerCase();
    var best = 0;
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name) return;
        ex.sets.forEach(function(st){
          if (st.id === excludeSetId) return;
          var val = e1rm(effectiveLoadKg(ex.name, st.weightKg), st.reps);
          if (val > best) best = val;
        });
      });
    });
    return best;
  }

  function sessionVolume(session){
    var total = 0;
    session.exercises.forEach(function(ex){
      ex.sets.forEach(function(st){ total += effectiveLoadKg(ex.name, st.weightKg) * st.reps; });
    });
    return total;
  }
  function exerciseVolume(ex){
    var total = 0;
    ex.sets.forEach(function(st){ total += effectiveLoadKg(ex.name, st.weightKg) * st.reps; });
    return total;
  }
  function sessionSetCount(session){
    var total = 0;
    session.exercises.forEach(function(ex){ total += ex.sets.length; });
    return total;
  }

  // Duration = time from the first logged set to the last logged set in the
  // session. Older sets logged before this feature existed have no
  // timestamp, so sessions need at least 2 timestamped sets to show a time.
  function sessionDuration(session){
    var stamps = [];
    session.exercises.forEach(function(ex){
      ex.sets.forEach(function(st){
        if (st.timestamp) stamps.push(new Date(st.timestamp).getTime());
      });
    });
    if (stamps.length < 2) return null;
    stamps.sort(function(a,b){ return a - b; });
    var mins = Math.round((stamps[stamps.length - 1] - stamps[0]) / 60000);
    return Math.max(1, mins);
  }

  function fmtDuration(mins){
    if (mins == null) return '';
    if (mins < 60) return mins + ' min';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return h + 'h' + (m > 0 ? ' ' + m + 'm' : '');
  }

  // Small bar fill relative to a 90-minute "full bar" reference session.
  function durationBarPct(mins){
    return Math.min(100, Math.round((mins / 90) * 100));
  }

  function durationBarHTML(session){
    var mins = sessionDuration(session);

  // a key that gets removed later just quietly drops that card instead of
  // breaking.
  var WORKOUT_TEMPLATE_CATEGORIES = [
    { id: 'ppl', label: 'Push / Pull / Legs', description: 'The classic 3-day split.', keys: ['push', 'pull', 'leg', 'pushB', 'pullB', 'legB'] },
    { id: 'upperLower', label: 'Upper / Lower', description: 'Balanced, efficient, repeatable.', keys: ['upper', 'lower', 'upperB', 'lowerB'] },
    { id: 'fullBody', label: 'Full Body', description: 'Everything, every session.', keys: ['fullBodyA', 'fullBodyB', 'fullBodyC'] }
  ];

  // Pulls the trailing variant letter off a template label ('Push Day A' ->
  // 'A', 'Full Body C' -> 'C') so the picker can drop a divider line
  // wherever the variant changes within a category's list (A-block, then
  // B-block, etc) — see the "template-divider" insertion in
  // renderTemplatePickerOverlay's step 2 below.
  function templateVariantLetter(label){
    var m = /\s([A-Z])$/.exec(label);
    return m ? m[1] : null;
  }

  // "Chest 3 · Shoulders 2 · Triceps 2" style summary line for a template card.
  function templateSummaryLine(tpl){
    var counts = {}, order = [];
    tpl.exercises.forEach(function(ex){
      if (!counts[ex.muscle]){ counts[ex.muscle] = 0; order.push(ex.muscle); }
      counts[ex.muscle]++;
    });

  function muscleMapSVG(view, selected){
    var shapes = MUSCLE_SHAPES[view];
    var svg = '<svg viewBox="0 0 200 370" preserveAspectRatio="xMidYMid meet">';
    shapes.forEach(function(s){
      var isMuscle = !!s.muscle;
      var isSel = isMuscle && s.muscle === selected;
      var fill = isSel ? 'var(--accent)' : 'var(--mm-body)';
      var fillOpacity = !isMuscle ? '0.85' : (isSel ? '1' : '0.9');
      var stroke = isSel ? 'var(--accent)' : 'var(--mm-body-line)';
      var strokeWidth = isSel ? '2' : '1.5';
      var extra = isMuscle
        ? ' class="mm-shape'+(isSel?' selected':'')+'" data-action="mm-select-muscle" data-muscle="'+esc(s.muscle)+'"'
        : ' class="mm-shape-static"';
      var common = 'fill="'+fill+'" fill-opacity="'+fillOpacity+'" stroke="'+stroke+'" stroke-width="'+strokeWidth+'"'+extra;
      if (s.type === 'circle'){
        svg += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'" '+common+'/>';
      } else if (s.type === 'ellipse'){
        svg += '<ellipse cx="'+s.cx+'" cy="'+s.cy+'" rx="'+s.rx+'" ry="'+s.ry+'" '+common+'/>';
      } else {
        svg += '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" rx="'+(s.rx||6)+'" '+common+'/>';
      }
    });
    svg += '</svg>';
    return svg;
  }

  function fmtDate(iso){
    var d = new Date(iso);
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
  }
  function monthYearLabel(iso){
    var d = new Date(iso);
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return months[d.getMonth()] + ' ' + d.getFullYear();
  }
  function fmtDateShort(iso){
    var d = new Date(iso);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }
  function fmtTime(iso){
    var d = new Date(iso);
    var h = d.getHours();
    var m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    var mm = m < 10 ? '0'+m : m;
    return h + ':' + mm + ' ' + ampm;
  }
  // Compares by local calendar day (year/month/date), not by 24h distance —
  // used to tell whether a session's date is genuinely "today" on this
  // device, regardless of what time it was created.
  function isSameLocalDay(iso, ref){
    var a = new Date(iso), b = ref || new Date();
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
