  /* =========================================================
     PRO PDF RECEIPT
     A second, "pro" print-to-PDF version of the session receipt:
     modern layout, a timestamp on every logged set, and a short
     progressive-overload tip per exercise (add reps vs add weight).
     Gated behind isProActive() — see the SUBSCRIPTION / PRO TIER
     helpers below for how that's determined.
     ========================================================= */

  // True for the one hardcoded developer email — permanent Pro,
  // no trial/expiry check ever applied.
  function isDevOverride(){
    var email = (state.currentAccountEmail || '').trim().toLowerCase();
    return !!email && email === DEV_OVERRIDE_EMAIL;
  }

  // Firestore may give us numbers (what this app writes) or, if the doc
  // was ever touched with a native Firestore Timestamp, an object with
  // a toMillis() method — normalize either into a plain epoch ms number.
  function toMillis(v){
    if (v == null) return null;
    if (typeof v === 'number') return v;
    if (typeof v.toMillis === 'function') return v.toMillis();
    var t = new Date(v).getTime();
    return isNaN(t) ? null : t;
  }

  function isTrialActive(){
    var u = state.userDoc;
    var end = u && toMillis(u.trialEndDate);
    return !!end && Date.now() < end;
  }

  // True once a trial has actually run its course (started AND ended) —
  // distinct from "never started," which trialAvailable() covers. Used
  // to show a clear "trial ended" notice instead of the banner just
  // silently disappearing.
  function isTrialExpired(){
    var u = state.userDoc;
    var start = u && toMillis(u.trialStartDate);
    var end = u && toMillis(u.trialEndDate);
    return !!start && !!end && Date.now() >= end;
  }

  function isPaidPlanActive(){
    var u = state.userDoc;
    var end = u && u.subscription && toMillis(u.subscription.currentPeriodEnd);
    return !!end && Date.now() < end;
  }

  // The single source of truth for Pro access everywhere in the app.
  function isProActive(){
    if (state.currentAccount === 'guest') return false;
    if (isDevOverride()) return true;
    if (isTrialActive()) return true;
    if (isPaidPlanActive()) return true;
    return false;
  }
  // Old name, kept as an alias — a couple of call sites below still use it.
  function isProUnlocked(){ return isProActive(); }

  function trialDaysLeftLabel(){
    var u = state.userDoc;
    var end = u && toMillis(u.trialEndDate);
    if (!end) return '';
    var msLeft = Math.max(0, end - Date.now());
    var daysLeft = Math.ceil(msLeft / (24 * 60 * 60 * 1000));
    if (daysLeft >= 1) return daysLeft + ' day' + (daysLeft === 1 ? '' : 's') + ' left';
    var hoursLeft = Math.max(1, Math.ceil(msLeft / (60 * 60 * 1000)));
    return hoursLeft + ' hr' + (hoursLeft === 1 ? '' : 's') + ' left';
  }

  function proExpiryLabel(){
    if (isDevOverride()) return 'Developer account — permanent Pro access';
    var u = state.userDoc;
    if (!u) return '';
    if (isPaidPlanActive()){
      var planKey = u.subscription && u.subscription.plan;
      var end = toMillis(u.subscription.currentPeriodEnd);
      var endLabel = fmtDateShort(new Date(end).toISOString());
      // 'custom' comes from the admin Grant Pro tool (grant-pro.js) —
      // not a real Stripe subscription, so it won't auto-renew like
      // the other three plans do.
      if (planKey === 'custom') return 'Pro access — until ' + endLabel;
      var plan = planKey === 'annual' ? 'Annual' : planKey === 'quarterly' ? 'Quarterly' : 'Monthly';
      return plan + ' plan — renews ' + endLabel;
    }
    if (isTrialActive()){
      return 'Free trial — ' + trialDaysLeftLabel();
    }
    return '';
  }

  function monthKey(d){
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // Basic tier gets PROGRESS_FREE_DAYS_PER_MONTH days of Progress-tab
  // access, counted from the first time it's opened in a given calendar
  // month — not the calendar days of that month. Pro/trial/dev always
  // pass through unlocked. Has the side effect of recording "first use"
  // the first time it's called for a new month (idempotent after that).
  function progressAccessState(){
    if (isProActive()) return { locked: false };
    var mk = monthKey();
    var map = (state.currentAccount === 'guest')
      ? (state.progressAccess || {})
      : ((state.userDoc && state.userDoc.progressAccess) || state.progressAccess || {});
    var rec = map[mk];
    if (!rec){
      recordProgressFirstUse(mk);
      return { locked: false };
    }
    var firstUseAt = toMillis(rec.firstUseAt) || rec.firstUseAt;
    var elapsedDays = (Date.now() - firstUseAt) / (24 * 60 * 60 * 1000);
    return { locked: elapsedDays >= PROGRESS_FREE_DAYS_PER_MONTH };
  }

  function recordProgressFirstUse(mk){
    var rec = { firstUseAt: Date.now() };
    if (state.currentAccount === 'guest'){
      state.progressAccess = state.progressAccess || {};
      if (state.progressAccess[mk]) return;
      state.progressAccess[mk] = rec;
      saveProgressAccessLocal();
    } else if (state.currentAccount){
      state.userDoc = state.userDoc || {};
      state.userDoc.progressAccess = state.userDoc.progressAccess || {};
      if (state.userDoc.progressAccess[mk]) return;
      state.userDoc.progressAccess[mk] = rec;
      if (window.SaviorFirebase && window.SaviorFirebase.updateUserDoc){
        var patch = { progressAccess: {} };
        patch.progressAccess[mk] = rec;
        window.SaviorFirebase.updateUserDoc(state.currentAccount, patch).catch(function(){});
      }
    }
  }

  // Redacts a set/session timestamp for Basic tier — Pro sees the real
  // clock time, Basic sees a small lock glyph in its place.
  function tsOrLock(iso, label){
    if (!iso) return '';
    return isProActive() ? fmtTime(iso) : '<span class="ts-lock" title="Upgrade to Pro to see '+(label || 'set times')+'">&#128274;</span>';
  }

  // Best e1rm for this exercise name across all sessions, excluding a
  // given set of set ids (used to exclude "today's" sets so we're
  // comparing against the lifter's prior history, not this session).
  function priorBestE1RM(exerciseName, excludeSetIds){
    var name = exerciseName.trim().toLowerCase();
    var best = 0;
    state.sessions.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name) return;
        ex.sets.forEach(function(st){
          if (excludeSetIds.indexOf(st.id) !== -1) return;
          var val = e1rm(effectiveLoadKg(ex.name, st.weightKg), st.reps);
          if (val > best) best = val;
        });
      });
    });
    return best;
  }

  // A small, sane next-session weight bump — not exact science, just a
  // reasonable plate-friendly increment scaled to the current load.
  function smallIncrementKg(weightKg, muscle){
    var stepKg = stepKgFor(weightKg, muscle);
    return roundNice(weightKg + stepKg);
  }
  // Smaller, more joint-sensitive muscle groups (isolation-heavy, prone to
  // technique breakdown before real strength gain) get progression capped
  // to a smaller step even when the raw number would suggest a bigger
  // jump — a heavy weighted push-up total shouldn't jump by chest-press
  // increments if the working muscle here is really the shoulder/triceps.
  // Big compound-friendly groups just use the normal weight-scaled step.
  var SMALL_MUSCLE_GROUPS = ['Shoulders', 'Biceps', 'Triceps', 'Calves', 'Forearms', 'Traps', 'Abs'];
  // Training goal also scales the step, on top of the muscle-group cap
  // above: Strength work is low-rep/near-max-effort, where standard
  // programming pushes load more aggressively session to session, so it
  // gets a bigger jump. Endurance is about building rep capacity more than
  // loading up, so jumps stay conservative — reps should usually climb
  // before weight does. Hypertrophy (the app's original, unscaled
  // behavior) sits in between at 1x.
  var GOAL_STEP_MULT = { strength: 1.5, hypertrophy: 1.0, endurance: 0.5 };
  function stepKgFor(weightKg, muscle){
    var base = weightKg >= 60 ? 2.5 : (weightKg >= 20 ? 1.25 : 0.5);
    if (muscle && SMALL_MUSCLE_GROUPS.indexOf(muscle) !== -1) base = Math.min(base, 1.25);
    var goal = (state.settings && state.settings.goal) || 'hypertrophy';
    return roundNice(base * (GOAL_STEP_MULT[goal] || 1.0));
  }

  // A bigger jump for sets that badly overshoot the rep range (>15) — at
  // that point the weight is just too light, so a normal plate-sized bump
  // isn't enough. Scaled by load (not a flat number): we use the same
  // e1RM math as the rest of the app to back-solve a weight that should
  // land the lifter back around the bottom of the 8-12 range, then snap
  // it to a plate-friendly step sized to the current load (and capped
  // smaller for joint-sensitive muscle groups — see stepKgFor above).
  //
  // Two safety nets on top of that raw math, because e1RM formulas
  // (Epley-style, same one the rest of the app uses) get increasingly
  // unreliable the further out they're extrapolated — by 40-50+ reps the
  // "estimated 1RM" balloons into physically impossible territory. 200kg
  // x 50 reps, for instance, projects to a 533kg e1RM with the raw
  // formula, which without a cap would suggest jumping to ~420kg next
  // session — nobody has ever bench pressed that, raw or equipped. So:
  // (1) the reps fed into the e1RM estimate are capped at
  // JUMP_EST_REP_CAP, tempering the runaway extrapolation, and (2) the
  // final suggested jump is hard-capped at MAX_JUMP_PCT above the current
  // weight no matter what the math says — so the suggestion always stays
  // in "big but plausible" territory instead of "technically math but
  // physically absurd."
  var JUMP_EST_REP_CAP = 20;
  var MAX_JUMP_PCT = 0.20;
  function loadScaledJumpKg(weightKg, reps, muscle, repMin){
    var e1 = e1rm(weightKg, Math.min(reps, JUMP_EST_REP_CAP));
    var raw = e1 / (1 + repMin / 30);
    var stepKg = stepKgFor(weightKg, muscle);
    var snapped = Math.round(raw / stepKg) * stepKg;
    var capped = Math.min(snapped, weightKg * (1 + MAX_JUMP_PCT));
    // never suggest less than the normal small bump, even if the math
    // undershoots for some edge-case rep/weight combo
    return roundNice(Math.max(capped, smallIncrementKg(weightKg, muscle)));
  }

  // Progressive-overload heuristic per exercise, rep-range target driven
  // by the person's training goal (Settings > Bodyweight & Goal — defaults
  // to Hypertrophy's 8-12 if never set, matching this app's original fixed
  // behavior exactly for anyone who leaves it alone):
  //  - below your recent best     -> match it before pushing further
  //  - top set past the range's overshoot line -> way too light, load-scaled bigger jump
  //  - top set at/past the top of the range     -> at the top, add weight next time
  //  - top set inside the range                 -> chase one more rep at same weight
  //  - top set below the range                  -> under range, hold weight and build up
  //                                                 (only drop weight if it's genuinely too heavy)
  // Every weight/e1RM figure below runs through effectiveLoadKg first, so
  // bodyweight exercises (push-ups, dips, pull-ups) factor in your
  // bodyweight from Settings rather than just the added weight — and the
  // suggested targets get converted back to "added weight" terms (via
  // bwOffset) before display, since that's what you'd actually type into
  // the +KG field, not the total.
  var GOAL_REP_RANGES = {
    strength: { min: 1, max: 5, overshoot: 8, extreme: 15, label: 'strength' },
    hypertrophy: { min: 8, max: 12, overshoot: 15, extreme: 25, label: 'hypertrophy' },
    endurance: { min: 15, max: 20, overshoot: 25, extreme: 40, label: 'endurance' }
  };
  var GOAL_OPTIONS = [
    { id: 'strength', label: 'Strength' },
    { id: 'hypertrophy', label: 'Hypertrophy' },
    { id: 'endurance', label: 'Endurance' }
  ];
  function currentRepRange(){
    var goal = (state.settings && state.settings.goal) || 'hypertrophy';
    return GOAL_REP_RANGES[goal] || GOAL_REP_RANGES.hypertrophy;
  }
  function overloadTipForExercise(ex){
    var sets = ex.sets;
    if (!sets || !sets.length) return null;
    var range = currentRepRange();
    var repMin = range.min, repMax = range.max, repOvershoot = range.overshoot, repExtreme = range.extreme, goalLabel = range.label;
    var bwOffset = effectiveLoadKg(ex.name, 0);
    var best = sets[0];
    sets.forEach(function(st){
      if (e1rm(effectiveLoadKg(ex.name, st.weightKg), st.reps) > e1rm(effectiveLoadKg(ex.name, best.weightKg), best.reps)) best = st;
    });
    var bestEffKg = effectiveLoadKg(ex.name, best.weightKg);
    var setIds = sets.map(function(st){ return st.id; });
    var prior = priorBestE1RM(ex.name, setIds);
    var thisE1 = e1rm(bestEffKg, best.reps);
    var headline, detail, target;
    if (prior > 0 && thisE1 < prior - 0.001){
      headline = 'Match your recent best';
      target = 'Maintain ' + describeLoad(ex.name, best.weightKg) + ' until you match your recent best';
      detail = 'Top set here was ' + describeLoad(ex.name, best.weightKg) + ' \u00d7 ' + best.reps + ', below your recent best on ' + ex.name + '. Aim to match that number before chasing a new PR.';
    } else if (best.reps > repOvershoot){
      var bigAddedKg = roundNice(loadScaledJumpKg(bestEffKg, best.reps, ex.muscle, repMin) - bwOffset);
      headline = 'Weight is too light \u2014 jump up';
      target = 'Target: ' + describeLoad(ex.name, bigAddedKg) + ' next session, aim to land in ' + repMin + '\u2013' + repMax + ' reps';
      detail = 'You hit ' + best.reps + ' reps at ' + describeLoad(ex.name, best.weightKg) + ' \u2014 well past the ' + repMin + '\u2013' + repMax + ' ' + goalLabel + ' range, so this weight is too light. Based on that effort, jump up to about ' + describeLoad(ex.name, bigAddedKg) + ' next session \u2014 scaled to your current strength \u2014 and aim to land back in the ' + repMin + '\u2013' + repMax + ' range.' +
        (best.reps > repExtreme ? ' That\u2019s a lot of reps for one set \u2014 the jump above is capped to stay realistic rather than trust the math past the point it means anything, so double check the numbers if that rep count wasn\u2019t intentional.' : '');
    } else if (best.reps >= repMax){
      var nextAddedKg = roundNice(smallIncrementKg(bestEffKg, ex.muscle) - bwOffset);
      headline = 'Add weight next time';
      target = 'Target: ' + describeLoad(ex.name, nextAddedKg) + ' next session, aim for ' + repMin + ' reps';
      detail = 'You hit ' + best.reps + ' reps at ' + describeLoad(ex.name, best.weightKg) + ' \u2014 the top of the ' + repMin + '\u2013' + repMax + ' ' + goalLabel + ' range. Bump the weight to about ' + describeLoad(ex.name, nextAddedKg) + ' next session and reset toward ' + repMin + ' reps.';
    } else if (best.reps < repMin){
      headline = 'Work back up to ' + repMin + ' reps';
      target = 'Same weight, ' + describeLoad(ex.name, best.weightKg) + ', aim for ' + repMin + '\u2013' + repMax + ' reps';
      detail = 'Top set was ' + best.reps + ' reps at ' + describeLoad(ex.name, best.weightKg) + ' \u2014 below the ' + repMin + '\u2013' + repMax + ' ' + goalLabel + ' range. Keep the same weight next session and aim to reach at least ' + repMin + ' reps. If it still feels too heavy to get there, drop the weight slightly and build back up within ' + repMin + '\u2013' + repMax + '.';
    } else {
      headline = 'Add a rep next time';
      target = 'Maintain ' + describeLoad(ex.name, best.weightKg) + ', aim for ' + (best.reps + 1) + ' reps';
      detail = 'Top set: ' + describeLoad(ex.name, best.weightKg) + ' \u00d7 ' + best.reps + '. Keep the same weight and aim for ' + (best.reps + 1) + ' reps next session \u2014 once you reach ' + repMax + ', it\u2019s time to add weight.';
    }
    // Shows up here rather than as a toast — a persistent, revisitable
    // "you've earned this" line every time this muscle's tips are opened,
    // instead of a one-shot popup you could easily miss or that interrupts
    // the flow of actually logging your workout.
    var badge = null;
    if (ex.muscle && state.settings && state.settings.strengthBadges && state.settings.strengthBadges[ex.muscle]){
      var badgeRatio = STRENGTH_BADGE_RATIO[ex.muscle];
      if (badgeRatio) badge = 'Strong AF \u2014 your ' + ex.muscle + ' has crossed ' + roundNice(badgeRatio) + '\u00d7 bodyweight';
    }
    return { headline: headline, target: target, detail: detail, badge: badge };
  }

  // Shared HTML for the Pro receipt's content — stats row, then one card
  // per exercise with every set (each with its logged timestamp) and an
  // overload tip. Reused by both the on-screen preview (.pro-panel-body)
  // and the printed PDF (#printReceipt.pro) — each scopes the .prc-*
  // classes to its own theme.
  // Shared markup for a single overload tip — headline + detail, plus a
  // highlighted "target" line. Used by both the Pro receipt (on-screen
  // preview) and the History Tips/Target overlay so the two never drift
  // apart. Pass compact=true for the printed PDF, where a single condensed
  // line (headline + target, no explanatory prose) keeps the whole
  // session receipt printable on one sheet.
  function renderTipHtml(tip, compact){
    if (!tip) return '';
    if (compact){
      return '<div class="prc-tip compact"><b>'+esc(tip.headline)+':</b> '+esc(tip.target || tip.detail)+'</div>';
    }
    return (tip.badge ? '<div class="prc-tip-badge">\ud83c\udfc6 '+esc(tip.badge)+'</div>' : '') +
           '<div class="prc-tip"><b>'+esc(tip.headline)+':</b> '+esc(tip.detail)+
           (tip.target ? '<div class="prc-tip-target">'+esc(tip.target)+'</div>' : '') +
           '</div>';
  }

  function buildProReceiptHtml(s, compact){
    var html = '<div class="prc-stats">' +
                  '<div class="prc-stat"><div class="prc-stat-label">Exercises</div><div class="prc-stat-value">'+s.exercises.length+'</div></div>' +
                  '<div class="prc-stat"><div class="prc-stat-label">Sets</div><div class="prc-stat-value">'+sessionSetCount(s)+'</div></div>' +
                  '<div class="prc-stat"><div class="prc-stat-label">Volume ('+unitLabel()+')</div><div class="prc-stat-value">'+Math.round(toDisplay(sessionVolume(s))).toLocaleString()+'</div></div>' +
                '</div>';
    s.exercises.forEach(function(ex){
      var tip = overloadTipForExercise(ex);
      html += '<div class="prc-ex">' +
                '<div class="prc-ex-head"><span class="prc-ex-name">'+esc(ex.name)+'</span>' +
                (ex.muscle ? '<span class="prc-ex-muscle">'+esc(ex.muscle)+'</span>' : '') +
                '</div>';
      ex.sets.forEach(function(st, i){
        html += '<div class="prc-set"><span>'+(i+1)+'. '+fmtWeight(st.weightKg)+' '+unitLabel()+' &times; '+st.reps+'</span>' +
                  '<span>' +
                    (st.timestamp ? '<span class="prc-set-time">'+fmtTime(st.timestamp)+'</span>' : '') +
                    (st.isPR ? ' <span class="prc-pr">PR</span>' : '') +
                  '</span></div>';
      });
      html += renderTipHtml(tip, compact);
      html += '</div>';
    });
    return html;
  }

     TEMPLATE PICKER  (category cards -> drill into a category's

     later — the top level only ever shows 3-ish category cards no

  function openTemplatePicker(){

  // Templates that actually exist for a category, in WORKOUT_TEMPLATE_CATEGORIES'
  // declared order — a key that gets removed later just quietly drops out.
  function templatesInCategory(cat){
    return cat.keys.filter(function(k){ return WORKOUT_TEMPLATES[k]; });
  }

  function renderTemplatePickerOverlay(){
    var overlay = document.getElementById('templatePickerOverlay');
    var panel = document.getElementById('templatePickerPanel');
    if (!ui.showTemplatePicker){
      overlay.classList.add('hidden');
      panel.innerHTML = '';
      return;
    }
    overlay.classList.remove('hidden');

    var cat = ui.templatePickerCategory
      ? WORKOUT_TEMPLATE_CATEGORIES.find(function(c){ return c.id === ui.templatePickerCategory; })
      : null;

    if (!cat){
      // Step 1 — pick a category.
      panel.innerHTML =
        '<div class="pro-panel-header"><h3>Start from a Template</h3>' +
          '<button class="pro-panel-close" data-action="close-template-picker" aria-label="Close">&#10005;</button>' +
        '</div>' +
        '<div class="pro-panel-body">' +
          WORKOUT_TEMPLATE_CATEGORIES.map(function(c){
            var keys = templatesInCategory(c);
            if (!keys.length) return '';
            return '<button type="button" class="template-card template-cat-card" data-action="select-template-category" data-category="'+c.id+'">' +
              '<div class="template-card-name">'+esc(c.label)+'</div>' +
              '<div class="template-card-sub">'+esc(c.description || '')+'</div>' +
              '<div class="template-card-count">'+keys.length+' template'+(keys.length===1?'':'s')+'</div>' +
            '</button>';
          }).join('') +
        '</div>';
      return;
    }

    // Step 2 — templates within the chosen category.
    var keys = templatesInCategory(cat);
    panel.innerHTML =
      '<div class="pro-panel-header">' +
        '<div class="pro-panel-header-left">' +
          '<button class="pro-panel-back" data-action="template-picker-back" aria-label="Back to categories">&#8249;</button>' +
          '<h3>'+esc(cat.label)+'</h3>' +
        '</div>' +
        '<button class="pro-panel-close" data-action="close-template-picker" aria-label="Close">&#10005;</button>' +
      '</div>' +
      '<div class="pro-panel-body">' +
        keys.map(function(key, i){
          var tpl = WORKOUT_TEMPLATES[key];
          var prevTpl = i > 0 ? WORKOUT_TEMPLATES[keys[i - 1]] : null;
          var divider = '';
          if (prevTpl){
            var prevLetter = templateVariantLetter(prevTpl.label);
            var curLetter = templateVariantLetter(tpl.label);
            if (prevLetter && curLetter && prevLetter !== curLetter){
              divider = '<div class="template-divider"></div>';
            }
          }
          return divider + '<button type="button" class="template-card" data-action="select-template" data-template="'+key+'">' +
            '<div class="template-card-name">'+esc(tpl.label)+'</div>' +
            '<div class="template-card-sub">'+esc(templateSummaryLine(tpl))+'</div>' +
            '<div class="template-card-count">'+tpl.exercises.length+' exercises</div>' +
          '</button>';
        }).join('') +
      '</div>';
  }

  // Step 2 — confirmation, reusing the same generic confirm modal every

  function openStartTemplateConfirm(templateKey){
    var tpl = WORKOUT_TEMPLATES[templateKey];
    if (!tpl) return;
    ui.showTemplatePicker = false;
    renderTemplatePickerOverlay();
    var hasOptional = tpl.exercises.some(function(ex){ return ex.optional; });
    ui.confirmModal = {
      kind: 'start-template',
      title: 'Start ' + tpl.label + '?',
      message: 'This loads ' + tpl.exercises.length + ' exercises into this session, ready to log' +
                (hasOptional ? ' \u2014 a couple are optional, delete any you\u2019re skipping today' : '') + '.',
      confirmLabel: 'Start',
      variant: 'primary',
      templateKey: templateKey
    };
    renderApp();
  }

  // Step 3 — actually populate the current (already-empty) session. This
  // fills the active session in place rather than spawning a new one like
  // startRoutine() does, since the picker only ever shows when the active
  // session already has zero exercises (see the trigger button in renderLog()).
  function applyTemplate(templateKey){
    var tpl = WORKOUT_TEMPLATES[templateKey];
    if (!tpl) return;
    var session = getActiveSession();
    session.name = tpl.label;
    session.exercises = tpl.exercises.map(function(ex){
      return { id: uid(), name: ex.name, muscle: ex.muscle, sets: [], done: false };
    });
    saveSessions();
    renderApp();
    showToast('Started ' + tpl.label);
  }

  /* =========================================================
     REST TIMER  (manual trigger, tunable duration 1:00–5:00)
     Nothing auto-prompts this — it only ever opens when the watch icon
     next to "Add Exercise" is tapped. From there: a duration picker
     (15s steps, clamped 1:00–5:00) with a Start button acting as the
     confirmation step, then a countdown running in the bar between the
     exercise list and the Finish/Add Set bar. Ticks off a wall-clock
     endsAt timestamp rather than a naive counter, so it stays accurate
     even if the interval gets throttled while the tab is backgrounded.
     ========================================================= */
  var restTimerInterval = null;

  function fmtMMSS(totalSeconds){
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

    ui.restTimerDraftSeconds = Math.max(60, Math.min(300, v));
    renderRestTimerPickerOverlay();

        '</div>' +

      '</div>' +

  function submitChangePassword(){
    if (ui.changePasswordBusy) return;
    var curInput = document.getElementById('changePwCurrentInput');
    var newInput = document.getElementById('changePwNewInput');
    var confirmInput = document.getElementById('changePwConfirmInput');
    var current = curInput ? curInput.value : '';
    var next = newInput ? newInput.value : '';
    var confirmVal = confirmInput ? confirmInput.value : '';

    if (!current){
      ui.changePasswordError = 'Enter your current password';
      renderChangePasswordPanel();
      return;
    }
    if (!next || next.length < 6){
      ui.changePasswordError = 'New password must be at least 6 characters';

    ui.changePasswordBusy = true;
    ui.changePasswordError = null;
    renderChangePasswordPanel();

  // Browsers block audio from ever starting unless it's tied to a real
  // tap — and the timer's completion fires on its own from a background
  // interval, not a tap. So the AudioContext gets created/unlocked here,
  // inside startRestTimer(), which IS a genuine tap (the Start button).
  // tickRestTimer() later reuses this same already-unlocked context when
  // the timer actually completes, which is allowed since the context was
  // unlocked during a real gesture earlier in the same session.
  var restTimerAudioCtx = null;
  function unlockRestTimerAudio(){
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!restTimerAudioCtx) restTimerAudioCtx = new AudioCtx();
      if (restTimerAudioCtx.state === 'suspended') restTimerAudioCtx.resume();
    } catch (err){ /* no audio support — silently skip, vibration/toast still fire */ }
  }

  // Two-note synthesized chime (A5 + E6, a perfect fifth) rather than an
  // embedded audio file — keeps the whole app in one HTML file, no asset
  // to host or bundle.
  function playRestTimerChime(){
    if (!restTimerAudioCtx) return;
    try {
      var ctx = restTimerAudioCtx;
      var now = ctx.currentTime;
      [880, 1318.51].forEach(function(freq, i){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var startTime = now + i * 0.08;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(i === 0 ? 0.3 : 0.15, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 1.2);
      });
    } catch (err){
      console.error('Rest timer chime failed:', err);
    }
  }

  function startRestTimer(){
    var secs = ui.restTimerDraftSeconds || 90;
    unlockRestTimerAudio();
    ui.showRestTimerPicker = false;
    renderRestTimerPickerOverlay();
    ui.restTimer = { endsAt: Date.now() + secs * 1000, totalSeconds: secs };
    renderRestTimerBar();
    if (restTimerInterval) clearInterval(restTimerInterval);
    restTimerInterval = setInterval(tickRestTimer, 1000);
  }

  // Auto mode (Settings > Preferences > Rest timer start) skips the picker
  // entirely and starts straight from the saved default duration. Only
  // called when no timer is already running (see commitSet) — logging a
  // set mid-rest shouldn't reset an already-counting-down timer.
  function autoStartRestTimer(){
    ui.restTimerDraftSeconds = (state.settings && state.settings.restTimerDefaultSeconds) || 90;
    startRestTimer();
  }

  function tickRestTimer(){
    if (!ui.restTimer){
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      return;
    }
    var remaining = Math.max(0, Math.ceil((ui.restTimer.endsAt - Date.now()) / 1000));
    if (remaining <= 0){
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      ui.restTimer = null;
      renderRestTimerBar();
      showToast('Rest complete \u2014 back to it');
      if (navigator.vibrate && state.settings.restTimerVibrate !== false) navigator.vibrate([120, 60, 120]);
      if (state.settings.restTimerSound !== false) playRestTimerChime();
      return;
    }
    renderRestTimerBar(remaining);
  }

  function skipRestTimer(){
    if (restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval = null; }
    ui.restTimer = null;
    renderRestTimerBar();
  }

  function renderRestTimerBar(remainingOverride){
    var el = document.getElementById('stopwatchBar');
    if (!el) return;
    if (!ui.restTimer){
      el.classList.add('hidden');
      el.innerHTML = '';
      return;
    }
    el.classList.remove('hidden');
    var remaining = remainingOverride != null ? remainingOverride : Math.max(0, Math.ceil((ui.restTimer.endsAt - Date.now()) / 1000));
    el.innerHTML =
      '<span class="stopwatch-label">Resting</span>' +
      '<span class="stopwatch-time">'+fmtMMSS(remaining)+'</span>' +
      '<button class="stopwatch-stop-btn" data-action="skip-rest-timer">Skip</button>';
  }

  /* =========================================================
     NOTIFICATION BELL
     Computed fresh every time the bell is tapped or renderApp() runs —
     deliberately not a stored/persisted feed. Reuses the exact same
     trial-state helpers (isTrialActive/isTrialExpired/trialDaysLeftLabel)
     the trial banner already uses, and the same daysSinceLastWorkout()
     the inline "been X days" reminder banner already uses, so the bell
     never disagrees with what those already say elsewhere in the app.
     ========================================================= */
  function getNotifications(){
    var list = [];
    if (!isDevOverride() && state.currentAccount !== 'guest' && state.userDoc && !isPaidPlanActive()){
      if (isTrialActive()){
        var daysLeft = Math.ceil(Math.max(0, toMillis(state.userDoc.trialEndDate) - Date.now()) / (24 * 60 * 60 * 1000));
        var soon = daysLeft <= 3;
        list.push({
          title: soon ? 'Trial ending soon' : 'Pro trial active',
          message: 'Your free trial has ' + trialDaysLeftLabel() + '.' +
                    (soon ? ' Subscribe to keep Pro features when it ends.' : ' Full Pro access is unlocked until then.'),
          urgent: soon,
          actionLabel: 'Upgrade'
        });
      } else if (isTrialExpired()){
        list.push({
          title: 'Trial ended',
          message: 'Your free trial has ended and you\u2019re back on Basic. Subscribe anytime to unlock Pro again.',
          urgent: true,
          actionLabel: 'Subscribe'
        });
      }
    }
    var gap = daysSinceLastWorkout();
    if (gap !== null && gap >= 2 && !reminderDismissedToday()){
      list.push({
        title: 'Time for a session',
        message: 'It\u2019s been ' + gap + ' days since your last workout \u2014 ready to log one?',
        urgent: true,
        dismissAction: 'dismiss-reminder'
      });
    }
    return list;
  }

  // (Rename/Delete) and each set row (Edit/Delete). One global element,

  // dropdown baked into every row.
  function openRowActionMenu(type, exId, setId, anchorEl){
    ui.openRowMenu = { type: type, exId: exId, setId: setId || null };
    renderRowActionMenu(anchorEl);

  function closeRowActionMenu(){
    ui.openRowMenu = null;
    var menu = document.getElementById('rowActionMenu');
    if (menu){ menu.classList.add('hidden'); menu.innerHTML = ''; }
  }
  function renderRowActionMenu(anchorEl){
    var menu = document.getElementById('rowActionMenu');
    if (!menu || !ui.openRowMenu) return;
    var m = ui.openRowMenu;
    var items;
    if (m.type === 'exercise'){
      items = [
        { label: 'Rename', action: 'edit-exercise-name' },
        { label: 'Delete', action: 'delete-exercise', danger: true }
      ];
    } else if (m.type === 'session'){
      items = [
        { label: 'Rename', action: 'edit-history-name' },
        { label: 'Edit', action: 'edit-session' },
        { label: 'Repeat', action: 'repeat-session' },
        { label: 'Delete session', action: 'delete-session', danger: true }
      ];
    } else {
      items = [
        { label: 'Edit set', action: 'edit-set' },
        { label: 'Delete set', action: 'delete-set', danger: true }
      ];
    }
    // "session" menu items use data-session (what delete-session/edit-session/
    // repeat-session all read); exercise/set items use data-ex(+data-set) as
    // before — m.exId doubles as "the session id" when type is 'session'.
    var idAttrs = m.type === 'session'
      ? 'data-session="'+m.exId+'"'
      : 'data-ex="'+m.exId+'"'+(m.setId ? ' data-set="'+m.setId+'"' : '');
    menu.innerHTML = items.map(function(it){
      return '<button type="button" class="row-action-item'+(it.danger ? ' danger' : '')+'" data-action="'+it.action+'" '+idAttrs+'>'+esc(it.label)+'</button>';
    }).join('');
    menu.classList.remove('hidden');
    if (anchorEl){
      var rect = anchorEl.getBoundingClientRect();
      var menuWidth = menu.offsetWidth || 140;
      var left = Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - 8);
      menu.style.top = (rect.bottom + 6) + 'px';
      menu.style.left = Math.max(8, left) + 'px';
    }
  }

  // Opens the appropriate Stripe Payment Link in a new tab, tagging it
  // with client_reference_id so a webhook can tie the payment back to
  // this Firebase uid. Actually marking the account Pro after payment
  // has to happen server-side (see the note by STRIPE_LINK_* above) —
  // this call only launches checkout, it never grants Pro itself.
  function startCheckout(plan){
    if (state.currentAccount === 'guest'){
      showToast('Create a free account first \u2014 Guest data can\u2019t hold a subscription');
      return;
    }
    var link = plan === 'annual' ? STRIPE_LINK_ANNUAL : (plan === 'quarterly' ? STRIPE_LINK_QUARTERLY : STRIPE_LINK_MONTHLY);
    if (!link){
      showToast('Payments aren\u2019t connected yet \u2014 check back soon');
      return;
    }
    var sep = link.indexOf('?') === -1 ? '?' : '&';
    var url = link + sep + 'client_reference_id=' + encodeURIComponent(state.currentAccount);
    window.open(url, '_blank', 'noopener');
  }

  // True only for a real (non-guest) account that has never started its
  // one-time 14-day trial. Once trialStartDate is set — whether the trial
  // is still running or has since expired — this goes false for good.
  function trialAvailable(){
    if (state.currentAccount === 'guest' || isDevOverride()) return false;
    return !(state.userDoc && state.userDoc.trialStartDate);
  }

  // Fired by the "Start Free Trial" button in the pricing modal. Writes
  // trialStartDate/trialEndDate to Firestore, then refreshes every UI
  // surface that depends on trial state (pricing modal, trial banner,
  // Settings, the gold star icon). One-time 14-day trial — see
  // TRIAL_DAYS above.
  // Fires the "your trial has started" email in the background — never
  // awaited by the caller, never blocks the trial itself from starting,
  // and any failure here is just logged, not surfaced to the user (an
  // unsent welcome email isn't worth interrupting them over).
  function sendTrialStartEmail(){
    if (!window.SaviorFirebase || !window.SaviorFirebase.getIdToken || !TRIAL_EMAIL_ENDPOINT) return;
    window.SaviorFirebase.getIdToken().then(function(token){
      if (!token) return;
      return fetch(TRIAL_EMAIL_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
    }).catch(function(err){
      console.error('Trial-start email request failed:', err);
    });
  }

  function startFreeTrial(){
    if (state.currentAccount === 'guest' || !window.SaviorFirebase || !window.SaviorFirebase.startTrial) return;
    if (!trialAvailable()) return;
    ui.startingTrial = true;
    renderPricingPanel();
    window.SaviorFirebase.startTrial(state.currentAccount).then(function(fields){
      state.userDoc = Object.assign({}, state.userDoc, fields);
      ui.startingTrial = false;
      ui.confirmingTrial = false;
      renderApp();
      renderPricingPanel();
      showToast('Free trial started \u2014 14 days of Pro unlocked');
      sendTrialStartEmail();
    }).catch(function(err){
      ui.startingTrial = false;
      ui.confirmingTrial = false;
      renderPricingPanel();
      showToast('Couldn\u2019t start trial \u2014 check your connection and try again');
      console.error('startTrial failed:', err);

  // Opens Stripe's hosted Customer Portal in a new tab, where a paying
  // user can cancel, switch plans, or update their card themselves —
  // no message to Xavier needed. Only meaningful for someone with a
  // real Stripe subscription (isPaidPlanActive()) — trial-only or dev
  // accounts have no Stripe customer to manage, so this isn't shown to
  // them at all (see renderPricingPanel/renderSettings).
  function openManageSubscription(){
    if (!window.SaviorFirebase || !window.SaviorFirebase.getIdToken || !PORTAL_ENDPOINT) return;
    if (ui.openingPortal) return;
    ui.openingPortal = true;
    renderPricingPanel();
    renderApp();
    window.SaviorFirebase.getIdToken().then(function(token){
      if (!token) throw new Error('Not logged in');
      return fetch(PORTAL_ENDPOINT, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnUrl: window.location.href })
      });
    }).then(function(res){ return res.json(); }).then(function(data){
      ui.openingPortal = false;
      renderPricingPanel();
      renderApp();
      if (data && data.url){
        window.open(data.url, '_blank', 'noopener');
      } else {
        showToast('Couldn\u2019t open subscription management \u2014 try again shortly');
      }
    }).catch(function(err){
      ui.openingPortal = false;
      renderPricingPanel();
      renderApp();
      showToast('Couldn\u2019t open subscription management \u2014 try again shortly');
      console.error('openManageSubscription failed:', err);
    });
  }

  function enablePushNotifications(){
    if (state.currentAccount === 'guest'){
      showToast('Create an account first \u2014 push needs somewhere to save the subscription');
      return;
    }
    if (!window.SaviorFirebase || !window.SaviorFirebase.requestPushToken){
      showToast('Push isn\u2019t supported in this browser');
      return;
    }
    if (ui.pushBusy) return;
    ui.pushBusy = true;
    renderApp();
    window.SaviorFirebase.requestPushToken(FCM_VAPID_KEY).then(function(result){
      ui.pushBusy = false;
      var token = result && result.token;
      if (!token){
        renderApp();
        showToast('Not enabled \u2014 ' + ((result && result.error) || 'unknown error'));
        return;
      }
      window.SaviorFirebase.updateUserDoc(state.currentAccount, {
        fcmToken: token,
        fcmTokenUpdatedAt: Date.now()
      }).then(function(){
        showToast('Notifications enabled');
        renderApp();
      }).catch(function(err){
        renderApp();
        showToast('Got permission, but couldn\u2019t save it \u2014 try again shortly');
        console.error('Saving FCM token failed:', err);
      });
    }).catch(function(err){
      ui.pushBusy = false;
      renderApp();
      showToast('Notifications weren\u2019t enabled \u2014 try again shortly');
      console.error('requestPushToken failed:', err);
    });
  }

  function sendWelcomePush(){
    if (state.currentAccount === 'guest' || !window.SaviorFirebase || !window.SaviorFirebase.requestPushToken){
      return;
    }
    window.SaviorFirebase.requestPushToken(FCM_VAPID_KEY).then(function(result){
      var token = result && result.token;
      if (!token){
        console.error('sendWelcomePush: no token \u2014', result && result.error);
        return; // permission denied or unsupported — skip quietly, no nagging at signup
      }
      return window.SaviorFirebase.updateUserDoc(state.currentAccount, {
        fcmToken: token,
        fcmTokenUpdatedAt: Date.now()
      }).then(function(){
        if (!WELCOME_PUSH_ENDPOINT || !window.SaviorFirebase.getIdToken) return;
        return window.SaviorFirebase.getIdToken().then(function(idToken){
          if (!idToken) return;
          return fetch(WELCOME_PUSH_ENDPOINT, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + idToken, 'Content-Type': 'application/json' }
          }).catch(function(err){
            console.error('send-welcome-push request failed:', err);
          });
        });
      });
    }).catch(function(err){
      console.error('sendWelcomePush failed:', err);
    });
  }

  function renderExerciseCard(session, ex){
    if (ex.done) return renderExerciseCardCollapsed(ex);

    var html = '<div class="exercise-card'+(ex.id===ui.justAddedExId?' just-added':'')+'" data-ex="'+ex.id+'" data-muscle="'+esc(ex.muscle||'')+'">';
    html += '<div class="exercise-head"><div class="eh-title"><h3>'+esc(ex.name || 'New Exercise')+'</h3>' +
            '<div class="eh-badges">' +
            (ex.muscle ? '<span class="muscle-badge">'+esc(ex.muscle)+'</span>' : '') +
            (ex.sets.length > 0 ? '<span class="volume-badge">VOL '+Math.round(toDisplay(exerciseVolume(ex))).toLocaleString()+' '+unitLabel().toUpperCase()+'</span>' : '') +
            '</div>' +
            '</div>' +
            '<div class="exercise-head-actions">' +
              '<button class="icon-btn" data-action="open-exercise-menu" data-ex="'+ex.id+'" aria-label="Exercise options">&#8942;</button>' +
              '<button class="icon-btn" data-action="toggle-exercise-done" data-ex="'+ex.id+'" aria-label="Minimize '+esc(ex.name)+'">&#8963;</button>' +
            '</div></div>';

    var editingSetId = (ui.editingSet && ui.editingSet.exId === ex.id) ? ui.editingSet.setId : null;
    var editingSetObj = null;

    if (ex.sets.length === 0){
      // Intentionally empty: no "no sets" placeholder, keeps the card compact until a set is logged.
    } else {
      ex.sets.forEach(function(st, i){
        var isEditingRow = st.id === editingSetId;
        if (isEditingRow) editingSetObj = st;
        html += '<div class="set-row'+(isEditingRow ? ' editing' : '')+'">' +
                  '<span class="set-idx">'+(i+1)+'</span>' +
                  '<span class="set-detail">' +
                    '<span class="set-wr">'+fmtWeight(st.weightKg)+' '+unitLabel()+'<span class="x">&times;</span>'+st.reps+'</span>' +
                    (st.timestamp ? '<span class="set-time"> &middot; '+tsOrLock(st.timestamp)+'</span>' : '') +
                    (st.isPR ? '<span class="pr-tag'+(st.id===ui.freshPRSetId?' fresh':'')+'">PR</span>' : '') +
                  '</span>' +
                  '<span class="set-actions">' +
                    '<button class="set-act-btn" data-action="open-set-menu" data-ex="'+ex.id+'" data-set="'+st.id+'" aria-label="Set options">&#8942;</button>' +
                  '</span>' +
                '</div>';
      });
    }

    if (editingSetObj){
      var editIdx = ex.sets.indexOf(editingSetObj) + 1;
      html += '<div class="editing-label">Editing set '+editIdx+'</div>';
      html += '<div class="add-set-row editing-row">' +
                '<input type="number" inputmode="decimal" step="0.5" class="set-weight-input" data-ex="'+ex.id+'" value="'+fmtWeight(editingSetObj.weightKg)+'">' +
                '<input type="number" inputmode="numeric" step="1" class="set-reps-input" data-ex="'+ex.id+'" value="'+editingSetObj.reps+'">' +
                '<div class="add-set-btn-group">' +
                  '<button class="add-set-btn" data-action="save-set-edit" data-ex="'+ex.id+'" data-set="'+editingSetObj.id+'" aria-label="Save changes">&#10003;</button>' +
                  '<button class="cancel-edit-btn" data-action="cancel-set-edit" aria-label="Cancel edit">&#10005;</button>' +
                '</div>' +
              '</div>';
    } else {
      var isOpen = !!ui.expandedAddSet[ex.id];
      if (isOpen){
        var draft = ui.draftSets[ex.id];
        var draftWeightKg = draft && draft.weight != null ? toStoredKg(draft.weight) : null;
        var draftReps = draft && draft.reps != null ? parseInt(draft.reps, 10) : NaN;
        // Bodyweight exercises (push-ups, dips, pull-ups) log *added*
        // weight, and 0 added weight is completely valid there — this used
        // to require a positive number to enable the checkmark at all,
        // which meant a plain bodyweight set literally couldn't be logged
        // without typing some arbitrary nonzero placeholder number.
        var isBW = isBodyweightExercise(ex.name);
        var rowReady = draftWeightKg !== null && (isBW ? draftWeightKg >= 0 : draftWeightKg > 0) && !isNaN(draftReps) && draftReps > 0;
        html += '<div class="add-set-row">' +
                  '<input type="number" inputmode="decimal" step="0.5" placeholder="'+(isBW ? '+' + unitLabel() : unitLabel())+'" class="set-weight-input" data-ex="'+ex.id+'" value="'+(draft && draft.weight != null ? esc(draft.weight) : '')+'">' +
                  '<input type="number" inputmode="numeric" step="1" placeholder="reps" class="set-reps-input" data-ex="'+ex.id+'" value="'+(draft && draft.reps != null ? esc(draft.reps) : '')+'">' +
                  '<div class="add-set-btn-group">' +
                    '<button class="add-set-btn" data-action="add-set-row" data-ex="'+ex.id+'" aria-label="Add set"'+(rowReady?'':' disabled')+'>&#10003;</button>' +
                    '<button class="cancel-edit-btn" data-action="close-add-set" data-ex="'+ex.id+'" aria-label="Cancel">&#10005;</button>' +
                  '</div>' +
                '</div>';
      } else {
        html += '<button class="add-set-toggle-btn" data-action="open-add-set" data-ex="'+ex.id+'">' +
                  '<span class="plus-glyph">&#43;</span> Add Set '+(ex.sets.length+1) +
                '</button>';
      }
    }
    html += '</div>';
    return html;
  }

  function renderExerciseCardCollapsed(ex){
    var setCount = ex.sets.length;
    var summary = setCount + (setCount === 1 ? ' set' : ' sets');

            '</div>';
    html += '</div>';
    return html;
  }

  function renderHistory(){
    var done = state.sessions.filter(function(s){ return s.status === 'done'; });
    // Explicit sort by actual finish time, newest first. Array position
    // alone isn't a reliable stand-in for this: finishedAt is deliberately
    // preserved (not overwritten) when an old session is reopened and
    // re-finished after a correction, so sorting by it is what keeps a
    // fixed typo anchored to its original date instead of jumping to the
    // top of the list.
    done.sort(function(a, b){
      return new Date(b.finishedAt || b.date) - new Date(a.finishedAt || a.date);
    });
    var html = '';
    if (done.length === 0){
      html += '<div class="empty"><div class="glyph">&#128220;</div>' +
              '<p>No finished sessions yet.<br>Sessions you finish in the Log tab will show up here.</p></div>';
    } else {
      html += '<input type="text" id="historySearchInput" class="history-search-input" autocomplete="off" placeholder="Search by exercise or session name" value="'+esc(ui.historySearch || '')+'">';
      html += '<div class="history-no-match hidden" id="historyNoMatch">No sessions match your search.</div>';

      // Split into "this week" (last 7 days) vs everything older, so the
      // list stays short by default and old sessions don't clutter it.
      var cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
      var recent = [];
      var older = [];
      done.forEach(function(s){
        var t = new Date(s.finishedAt || s.date).getTime();
        if (!isNaN(t) && t >= cutoff) recent.push(s);
        else older.push(s);
      });

      if (older.length > 0 && recent.length > 0){
        html += '<div class="section-label">This week</div>';
      }
      recent.forEach(function(s){ html += renderHistoryItem(s); });

      if (older.length > 0){
        // While actively searching, always include older sessions so the
        // search can actually find them, regardless of collapsed state.
        var oldOpen = !!ui.showOldHistory || !!(ui.historySearch && ui.historySearch.trim());
        html += '<div class="section-label history-old-toggle" data-action="toggle-old-history">' +
                  'Older (' + older.length + ') ' +
                  '<span class="history-old-caret">' + (oldOpen ? '&#9650;' : '&#9660;') + '</span>' +
                '</div>';
        if (oldOpen){
          // Clustered by month rather than one flat list — older[] is
          // already sorted newest-first, so same-month sessions are
          // already contiguous; this just labels the boundaries. Makes
          // "find that session from March" a scan instead of a scroll.
          var currentLabel = null;
          older.forEach(function(s){
            var label = monthYearLabel(s.finishedAt || s.date);
            if (label !== currentLabel){
              html += '<div class="history-month-label">'+esc(label)+'</div>';
              currentLabel = label;
            }
            html += renderHistoryItem(s);
          });
        }
      }
    }
    document.getElementById('view').innerHTML = html;
    if (done.length > 0) filterHistoryList(ui.historySearch || '');
  }

  function filterHistoryList(query){
    query = String(query || '').trim().toLowerCase();
    var items = document.querySelectorAll('.history-item');
    var anyVisible = false;
    items.forEach(function(item){
      var haystack = item.dataset.search || '';
      var match = !query || haystack.indexOf(query) !== -1;
      item.classList.toggle('hidden', !match);
      if (match) anyVisible = true;
    });
    var noMatchEl = document.getElementById('historyNoMatch');
    if (noMatchEl) noMatchEl.classList.toggle('hidden', anyVisible || !query);
  }

  // one point per session for this exercise: best e1rm set in that session + top weight
  function collectExercisePoints(name){
    var pts = [];
    var chronological = state.sessions.filter(function(s){ return s.status === 'done'; })
      .slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    chronological.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name.trim().toLowerCase()) return;
        if (ex.sets.length === 0) return;
        var bestSet = ex.sets.reduce(function(a,b){
          return e1rm(effectiveLoadKg(ex.name,b.weightKg),b.reps) > e1rm(effectiveLoadKg(ex.name,a.weightKg),a.reps) ? b : a;
        }, ex.sets[0]);
        var topKg = Math.max.apply(null, ex.sets.map(function(st){ return effectiveLoadKg(ex.name, st.weightKg); }));
        pts.push({ date: s.date, e1rm: e1rm(effectiveLoadKg(ex.name, bestSet.weightKg), bestSet.reps), topKg: topKg });
      });
    });
    return pts;
  }

  function collectPRs(name){
    var prs = [];
    var chronological = state.sessions.filter(function(s){ return s.status === 'done'; })
      .slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    chronological.forEach(function(s){
      s.exercises.forEach(function(ex){
        if (ex.name.trim().toLowerCase() !== name.trim().toLowerCase()) return;
        ex.sets.forEach(function(st){
          if (st.isPR) prs.push({ date: s.date, weightKg: st.weightKg, reps: st.reps });
        });
      });
    });
    return prs;
  }

  function buildChartSVG(points){
    var w = 400, h = 140, pad = 16;
    var vals = points.map(function(p){ return p.e1rm; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max){ min = min - 1; max = max + 1; }
    var n = points.length;
    function xAt(i){ return n === 1 ? w/2 : pad + (i/(n-1)) * (w - pad*2); }
    function yAt(v){ return h - pad - ((v - min)/(max - min)) * (h - pad*2); }

    var path = points.map(function(p,i){
      return (i===0?'M':'L') + xAt(i).toFixed(1) + ',' + yAt(p.e1rm).toFixed(1);
    }).join(' ');

    var accentHex = currentAccentTheme().accent;
    var dots = points.map(function(p,i){
      return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.e1rm).toFixed(1)+'" r="3" fill="'+accentHex+'"/>';
    }).join('');

    var areaPath = path + ' L' + xAt(n-1).toFixed(1) + ',' + (h-pad) + ' L' + xAt(0).toFixed(1) + ',' + (h-pad) + ' Z';

    var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="140" preserveAspectRatio="none">';
    svg += '<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">' +
             '<stop offset="0%" stop-color="'+accentHex+'" stop-opacity="0.28"/>' +
             '<stop offset="100%" stop-color="'+accentHex+'" stop-opacity="0"/>' +
           '</linearGradient></defs>';
    svg += '<path d="'+areaPath+'" fill="url(#grad)" stroke="none"/>';
    svg += '<path d="'+path+'" fill="none" stroke="'+accentHex+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    svg += dots;
    svg += '</svg>';
    return svg;
  }

  var TAB_ORDER = ['log', 'history', 'progress', 'settings'];

  // Slides the outgoing tab out and the incoming tab in, direction based on
  // their order in the tab bar (left tab -> right tab slides leftward, etc).
  function switchTabWithSlide(newTab){
    if (newTab === state.tab){
      renderApp();
      return;
    }
    var oldIndex = TAB_ORDER.indexOf(state.tab);
    var newIndex = TAB_ORDER.indexOf(newTab);
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (ui.tabAnimating || oldIndex === -1 || newIndex === -1 || reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    var dir = newIndex > oldIndex ? 1 : -1; // 1: slide leftward (new enters from right), -1: slide rightward
    var oldHTML = viewEl.innerHTML;

    state.tab = newTab;
    renderApp();
    var newHTML = viewEl.innerHTML;
    var viewHeight = viewEl.scrollHeight;

    ui.tabAnimating = true;

    var track = document.createElement('div');
    track.className = 'view-slide-track';
    track.style.minHeight = viewHeight + 'px';

    var oldPane = document.createElement('div');
    oldPane.className = 'view-slide-pane';
    oldPane.innerHTML = oldHTML;

    var newPane = document.createElement('div');
    newPane.className = 'view-slide-pane';
    newPane.innerHTML = newHTML;

    if (dir === 1){
      track.appendChild(oldPane);
      track.appendChild(newPane);
      track.style.transform = 'translateX(0%) translateZ(0)';
    } else {
      track.appendChild(newPane);
      track.appendChild(oldPane);
      track.style.transform = 'translateX(-100%) translateZ(0)';
    }

    viewEl.innerHTML = '';
    viewEl.appendChild(track);
    viewEl.scrollTop = 0;

    void track.offsetWidth; // force reflow so the transition below actually animates

    track.style.transition = 'transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1)';
    track.style.transform = (dir === 1 ? 'translateX(-100%)' : 'translateX(0%)') + ' translateZ(0)';

    var finished = false;
    var cleanup = function(){
      if (finished) return;
      finished = true;
      ui.tabAnimating = false;
      renderApp(); // re-render for real: reattaches any tab-specific listeners (e.g. Settings' import input)
      var freshView = document.getElementById('view');
      if (freshView) freshView.scrollTop = 0;
    };
    track.addEventListener('transitionend', cleanup);
    setTimeout(cleanup, 400); // fallback in case transitionend doesn't fire
  }

  // Realtime listener on the current user's Firestore doc — keeps
  // state.userDoc (tier/trial/subscription/progressAccess) in sync
  // without needing a reload, e.g. once a payment webhook eventually
  // writes subscription.currentPeriodEnd server-side.
  var userDocUnsub = null;
  function subscribeUserDoc(uidVal){
    if (userDocUnsub){ userDocUnsub(); userDocUnsub = null; }
    if (!window.SaviorFirebase || !window.SaviorFirebase.onUserDocChange) return;
    userDocUnsub = window.SaviorFirebase.onUserDocChange(uidVal, function(docData, metadata){
      // Skip local echoes of our own writes. This same /users/{uid} doc
      // also receives the debounced workout-data sync (sessions/routines/
      // settings), and Firestore fires this listener instantly with the
      // optimistic local value the moment that write is queued — before
      // it ever reaches the server. Without this guard, typing an
      // exercise name would trigger a renderApp() ~800ms later (when the
      // debounced sync fires), tearing down the focused input and
      // dismissing the keyboard mid-type. Genuine remote changes (another
      // device, a payment webhook) arrive with hasPendingWrites false and
      // still go through normally.
      if (metadata && metadata.hasPendingWrites) return;
      state.userDoc = docData;
      renderApp();
      renderPricingPanel();
      renderExTipOverlay();
    });
  }


  // Called by the Firebase onAuthChange listener once a real login/signup
  // succeeds — not called directly by handleLogIn/handleSignUp, since
  // Firebase itself is the source of truth for "who's logged in."
  // Pulls the latest synced data from Firestore (if any) into this
  // device's local cache before booting, so a login on a new device
  // picks up existing history instead of showing an empty log. Also
  // provisions (once, ever) the account's tier/trial/subscription
  // fields on the same /users/{uid} doc, then keeps them live via a
  // realtime listener.
  function enterAccount(uidVal, email){
    setCurrentAccountId(uidVal);
    state.currentAccount = uidVal;
    state.currentAccountEmail = email;
    ui.authBusy = false;
    ui.authError = null;
    var pull = (window.SaviorFirebase && window.SaviorFirebase.loadUserData)
      ? window.SaviorFirebase.loadUserData(uidVal)
      : Promise.resolve(null);
    var ensureDoc = (window.SaviorFirebase && window.SaviorFirebase.ensureUserDoc)
      ? window.SaviorFirebase.ensureUserDoc(uidVal, email)
      : Promise.resolve(null);
    Promise.all([pull, ensureDoc]).then(function(results){
      var remote = results[0];
      state.userDoc = results[1];
      // See ensureUserDoc — this in-memory-only marker means the
      // /users/{uid} doc was just created for the first time (a real
      // signup, or a first-ever Google sign-in), not a returning login.
      var isNewAccount = !!(state.userDoc && state.userDoc.__isNewAccount);
      if (state.userDoc) delete state.userDoc.__isNewAccount;
      if (remote){
        if (remote.sessions) safeSetItem(scopedKey(STORAGE_SESSIONS), JSON.stringify(remote.sessions));
        if (remote.routines) safeSetItem(scopedKey(STORAGE_ROUTINES), JSON.stringify(remote.routines));
        if (remote.settings) safeSetItem(scopedKey(STORAGE_SETTINGS), JSON.stringify(remote.settings));
      }
      return isNewAccount;
    }).catch(function(err){
      // Offline or first login with nothing synced yet — fall back to
      // whatever's cached locally on this device rather than blocking.
      console.error('Firestore pull failed:', err);
      return false;
    }).then(function(isNewAccount){
      bootAccountData();
      subscribeUserDoc(uidVal);
      // Marks "last opened the app" for the 2-day inactivity push job
      // (a Netlify scheduled function — see send-inactivity-push.js).
      // Clearing inactivityPushSentAt here re-arms it: once this account
      // goes quiet again, the next scheduled run is free to nudge them
      // again, rather than staying permanently silenced after one nudge.
      // Fire-and-forget — a failed write here just means this boot
      // doesn't count toward "active," nothing user-facing breaks.
      if (window.SaviorFirebase && window.SaviorFirebase.updateUserDoc){
        window.SaviorFirebase.updateUserDoc(uidVal, {
          lastActiveAt: Date.now(),
          inactivityPushSentAt: null
        }).catch(function(err){ console.error('lastActiveAt update failed:', err); });
      }
      if (isNewAccount){
        // Brand-new account — hold off on the dashboard until they've
        // picked an icon (see renderAvatarPickGate()). Start them on the
        // default so there's always something valid saved either way.
        state.settings.avatar = DEFAULT_AVATAR;
        saveSettings();
        sendWelcomePush();
        ui.awaitingAvatarPick = true;
        renderAuthGate();
      } else {
        showAppShell();
        renderApp();
      }
    });
  }

  function continueAsGuest(){
    setCurrentAccountId('guest');
    state.currentAccount = 'guest';
    state.userDoc = null;
    bootAccountData();
    showAppShell();
    renderApp();
  }

  function logOut(){
    var wasGuest = (state.currentAccount === 'guest');
    if (userDocUnsub){ userDocUnsub(); userDocUnsub = null; }
    // Cancel any pending debounced Firestore sync (see scheduleFirestoreSync)
    // — otherwise a save queued just before logging out can still fire
    // ~800ms later and write to the account that was just logged out of.
    clearTimeout(firestoreSyncTimer);
    setCurrentAccountId(null);
    state.currentAccount = null;
    state.currentAccountEmail = null;
    state.userDoc = null;
    state.progressAccess = {};
    ui.showAccountMenu = false;
    ui.authMode = 'login';
    ui.authError = null;
    ui.authBusy = false;
    ui.authDraft = { email: '', avatar: DEFAULT_AVATAR };
    ui.awaitingAvatarPick = false;
    ui.pendingDeleteAccount = false;
    ui.showPricing = false;
    if (!wasGuest && window.SaviorFirebase) window.SaviorFirebase.logOut();
    showAuthGateShell();
    renderAuthGate();
  }

  function deleteAccount(){
    if (!state.currentAccount || state.currentAccount === 'guest') return;
    var id = state.currentAccount;
    // Cancel any pending debounced Firestore sync (see scheduleFirestoreSync)
    // — without this, a save queued just before deletion can fire ~800ms
    // later with merge:true and silently recreate the doc we're about to
    // wipe, right after deleteUserData() removes it.
    clearTimeout(firestoreSyncTimer);
    safeRemoveItem(STORAGE_SESSIONS + '::' + id);
    safeRemoveItem(STORAGE_SETTINGS + '::' + id);
    safeRemoveItem(STORAGE_ROUTINES + '::' + id);
    safeRemoveItem(STORAGE_ACTIVITY_LOG + '::' + id);
    safeRemoveItem(STORAGE_PROGRESS_ACCESS + '::' + id);
    if (window.SaviorFirebase){
      var wipeRemote = window.SaviorFirebase.deleteUserData
        ? window.SaviorFirebase.deleteUserData(id).catch(function(){})
        : Promise.resolve();
      wipeRemote.then(function(){
        return window.SaviorFirebase.deleteCurrentUser();
      }).then(function(){
        logOut();
        showToast('Account deleted');
      }).catch(function(err){
        showToast(err && err.code === 'auth/requires-recent-login'
          ? 'Log out and back in, then try deleting again'
          : 'Could not delete account — try again');
      });
    } else {
      logOut();
      showToast('Account deleted');
    }
  }

  /* =========================================================
     DELETE ACCOUNT — RE-AUTH STEP
     After the danger-zone countdown confirm, before deleteAccount()
     actually runs, the user has to re-prove who they are: password for
     email/password accounts, a Google popup for Google-only accounts.
     Wrong password (or a canceled/failed Google popup) aborts the whole
     flow — no retry loop, no deletion, just back to Settings with the
     account untouched. They can tap Delete again from Settings to
     restart the flow from the top if it was a typo.
     ========================================================= */
  function openDeleteAccountPasswordConfirm(){
    if (!window.SaviorFirebase || !window.SaviorFirebase.reauthenticate) return;
    ui.confirmingDeleteAccountPassword = true;
    ui.deleteAccountPasswordBusy = false;
    ui.deleteAccountPasswordError = null;
    renderDeleteAccountPasswordPanel();
  }

  function cancelDeleteAccountPasswordConfirm(){
    ui.confirmingDeleteAccountPassword = false;
    ui.deleteAccountPasswordBusy = false;
    ui.deleteAccountPasswordError = null;
    renderDeleteAccountPasswordPanel();
  }

  // Wrong password / failed Google re-auth -> abort back to the account,
  // no deletion, no retry loop. Only a genuine successful re-auth reaches
  // deleteAccount() below.
  function submitDeleteAccountPasswordConfirm(){
    if (ui.deleteAccountPasswordBusy) return;
    var isGoogleOnly = window.SaviorFirebase.isGoogleOnlyAccount && window.SaviorFirebase.isGoogleOnlyAccount();
    var passwordInput = document.getElementById('deletePasswordInput');
    var password = isGoogleOnly ? null : (passwordInput ? passwordInput.value : '');
    if (!isGoogleOnly && !password){
      ui.deleteAccountPasswordError = 'Enter your password';
      renderDeleteAccountPasswordPanel();
      return;
    }
    ui.deleteAccountPasswordBusy = true;
    ui.deleteAccountPasswordError = null;
    renderDeleteAccountPasswordPanel();
    window.SaviorFirebase.reauthenticate(password).then(function(){
      ui.confirmingDeleteAccountPassword = false;
      ui.deleteAccountPasswordBusy = false;
      renderDeleteAccountPasswordPanel();
      deleteAccount();
    }).catch(function(err){
      // Any failure — wrong password, canceled Google popup, network
      // issue — aborts the deletion entirely and returns to the account.
      ui.confirmingDeleteAccountPassword = false;
      ui.deleteAccountPasswordBusy = false;
      ui.deleteAccountPasswordError = null;
      renderDeleteAccountPasswordPanel();
      var isCanceledPopup = err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request');
      showToast(isCanceledPopup ? 'Account not deleted' : ('Account not deleted — ' + firebaseAuthErrorMessage(err)));
    });
  }

  function renderDeleteAccountPasswordPanel(){
    var overlay = document.getElementById('deletePasswordOverlay');
    var panel = document.getElementById('deletePasswordPanel');
    if (!ui.confirmingDeleteAccountPassword){
      overlay.classList.add('hidden');
      panel.innerHTML = '';
      return;
    }
    overlay.classList.remove('hidden');
    var isGoogleOnly = window.SaviorFirebase.isGoogleOnlyAccount && window.SaviorFirebase.isGoogleOnlyAccount();
    var busy = ui.deleteAccountPasswordBusy;
    var html = '<div class="confirm-title">Confirm it\u2019s you</div>';
    if (isGoogleOnly){
      html += '<div class="confirm-message">This account signs in with Google \u2014 confirm through the Google popup to finish deleting it. Wrong account or canceled popup and nothing gets deleted.</div>';
    } else {
      html += '<div class="confirm-message">Enter your password to permanently delete this account. Get it wrong and nothing gets deleted \u2014 you\u2019ll just land back here.</div>' +
              passwordFieldHtml('deletePasswordInput', 'Password', 'current-password', busy, 'width:100%;box-sizing:border-box;margin:4px 0 6px;');
      if (ui.deleteAccountPasswordError){
        html += '<div style="color:var(--accent-2);font-size:12px;margin:0 0 8px;">'+esc(ui.deleteAccountPasswordError)+'</div>';
      }
    }
    html += '<div class="confirm-buttons">' +
              '<button class="confirm-btn-cancel" data-action="cancel-delete-password"'+(busy?' disabled':'')+'>Cancel</button>' +
              '<button class="confirm-btn-danger" data-action="confirm-delete-password"'+(busy?' disabled':'')+'>'+(busy?'Checking\u2026':(isGoogleOnly?'Confirm with Google':'Delete Account'))+'</button>' +
            '</div>';
    panel.innerHTML = html;
    if (!isGoogleOnly){
      setTimeout(function(){
        var inp = document.getElementById('deletePasswordInput');
        if (inp) inp.focus();
      }, 30);
    }
  }

  function handleLogIn(email, password){
    email = (email || '').trim();
    if (!email || !password){
      ui.authError = 'Enter your email and password';
      renderAuthGate();
      return;
    }
    if (!isValidEmail(email)){
      ui.authError = 'Enter a valid email address';
      renderAuthGate();
      return;
    }
    if (!window.SaviorFirebase){
      ui.authError = 'Still connecting — try again in a moment';
      renderAuthGate();
      return;
    }
    ui.authError = null;
    ui.authBusy = true;
    renderAuthGate();
    window.SaviorFirebase.logIn(email, password).catch(function(err){
      ui.authBusy = false;
      ui.authError = firebaseAuthErrorMessage(err);
      renderAuthGate();
    });
    // On success, the onAuthChange listener fires and takes it from here.
  }

  function handleSignUp(email, password, confirmPassword){
    email = (email || '').trim();
    if (!email || !password){
      ui.authError = 'Enter an email and password';
      renderAuthGate();
      return;
    }
    if (!isValidEmail(email)){
      ui.authError = 'Enter a valid email address';
      renderAuthGate();
      return;
    }
    if (password.length < 6){
      ui.authError = 'Password must be at least 6 characters';
      renderAuthGate();
      return;
    }
    if (password !== confirmPassword){
      ui.authError = "Passwords don't match";
      renderAuthGate();
      return;
    }
    if (!window.SaviorFirebase){
      ui.authError = 'Still connecting — try again in a moment';
      renderAuthGate();
      return;
    }
    ui.authError = null;
    ui.authBusy = true;
    renderAuthGate();
    window.SaviorFirebase.signUp(email, password).catch(function(err){
      ui.authBusy = false;
      ui.authError = firebaseAuthErrorMessage(err);
      renderAuthGate();
    });
  }

  function handleForgotPassword(){
    var email = (document.getElementById('authEmail') ? document.getElementById('authEmail').value : '').trim();
    if (!email){
      ui.authError = 'Enter your email above first, then tap "Forgot password?"';
      renderAuthGate();
      return;
    }
    if (!isValidEmail(email)){
      ui.authError = 'Enter a valid email address';
      renderAuthGate();
      return;
    }
    if (!window.SaviorFirebase || !window.SaviorFirebase.resetPassword){
      ui.authError = 'Still connecting — try again in a moment';
      renderAuthGate();
      return;
    }
    ui.authError = null;
    ui.authBusy = true;
    renderAuthGate();
    window.SaviorFirebase.resetPassword(email).then(function(){
      ui.authBusy = false;
      renderAuthGate();
      showToast('Password reset email sent \u2014 check your inbox');
    }).catch(function(err){
      ui.authBusy = false;
      ui.authError = firebaseAuthErrorMessage(err);
      renderAuthGate();
    });
  }

  function handleGoogleSignIn(){
    if (!window.SaviorFirebase || !window.SaviorFirebase.signInWithGoogle){
      ui.authError = 'Still connecting — try again in a moment';
      renderAuthGate();
      return;
    }
    ui.authError = null;
    ui.authBusy = true;
    renderAuthGate();
    window.SaviorFirebase.signInWithGoogle().catch(function(err){
      ui.authBusy = false;
      // Popup closed by the user isn't really an "error" worth showing.
      if (err && err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request'){
        ui.authError = firebaseAuthErrorMessage(err);
      }
      renderAuthGate();
    });
    // On success, the onAuthChange listener fires and takes it from here.
  }

  function renderAuthGate(){
    if (ui.awaitingAvatarPick){
      renderAvatarPickGate();
      return;
    }
    var mode = ui.authMode || 'login';
    var busy = !!ui.authBusy;
    var html = '<div class="auth-card">';
    html += '<div class="auth-title"><h1>SAVIORFIT <span>LOGGER</span></h1></div>';
    html += '<div class="auth-tabs">' +
              '<button class="'+(mode==='login'?'active':'')+'" data-action="auth-mode" data-mode="login"'+(busy?' disabled':'')+'>Log In</button>' +
              '<button class="'+(mode==='signup'?'active':'')+'" data-action="auth-mode" data-mode="signup"'+(busy?' disabled':'')+'>Sign Up</button>' +
            '</div>';
    html += '<div class="auth-field"><input type="email" id="authEmail" placeholder="Email" autocomplete="email" autocapitalize="none" value="'+esc(ui.authDraft.email || '')+'"'+(busy?' disabled':'')+'></div>';
    html += '<div class="auth-field">'+passwordFieldHtml('authPassword', 'Password', (mode==='signup'?'new-password':'current-password'), busy, '', '')+'</div>';
    if (mode === 'signup'){
      html += '<div class="auth-field">'+passwordFieldHtml('authConfirm', 'Confirm password', 'new-password', busy, '', '')+'</div>';
    } else {
      html += '<button class="auth-forgot-link" type="button" data-action="forgot-password"'+(busy?' disabled':'')+'>Forgot password?</button>';
    }
    html += '<div class="auth-error">'+(ui.authError ? esc(ui.authError) : '')+'</div>';
    html += '<button class="auth-submit" data-action="'+(mode==='signup'?'do-signup':'do-login')+'"'+(busy?' disabled':'')+'>'+(busy ? '\u2026' : (mode==='signup'?'Create Account':'Log In'))+'</button>';
    html += '<div class="auth-divider">or</div>';

  // the same pattern as freshPRSetId: set the flag, render (so the fresh

  function saveExerciseName(exId, providedName){
    var session = getActiveSession();
    var ex = findExercise(session, exId);
    if (!ex) return;
    var name;
    if (providedName != null){
      name = providedName.trim();
    } else {

      name = input ? input.value.trim() : '';
    }
    if (!name){
      showToast('Exercise name can\u2019t be empty');
      return;
    }
    var oldName = ex.name;
    var wasNew = ui.newExerciseId === exId;
    ex.name = name;
    // Only applies if the name being saved came from tapping a library
    // suggestion (see 'pick-ex-suggestion') — free-typed names never touch
    // ex.muscle, same as before this feature existed.
    if (ui.pendingSuggestMuscle) ex.muscle = ui.pendingSuggestMuscle;
    ui.pendingSuggestMuscle = null;
    saveSessions();
    if (oldName.trim().toLowerCase() !== name.trim().toLowerCase()){
      recomputeExercisePRs(oldName);
      recomputeExercisePRs(name);
    }
    if (wasNew){
      logActivity('Added exercise "' + name + '"', 'Log');
    } else if (oldName.trim().toLowerCase() !== name.trim().toLowerCase()){
      logActivity('Renamed exercise "' + oldName + '" to "' + name + '"', 'Log');
    }
    ui.newExerciseId = null;
    ui.editingExerciseName = null;
    ui.justAddedExId = wasNew ? exId : null;
    renderApp();
    ui.justAddedExId = null;
    showToast(wasNew ? 'Exercise added' : 'Exercise renamed');

      if (ui.newExerciseId === exId) discardPendingNewExercise();
      ui.editingExerciseName = null;
    }
    // Collapsing hides the add-set input row from view, but doesn't
    // otherwise clear it — leaving expandedAddSet[exId] stuck true would
    // silently keep Finish Session disabled with no visual sign why,
    // since the collapsed card never renders that panel to close it.
    if (ex.done && ui.expandedAddSet[exId]) ui.expandedAddSet[exId] = false;

  function addSet(exId){

    var card = document.querySelector('.exercise-card[data-ex="'+exId+'"]');
    var weightInput = card.querySelector('.set-weight-input');
    var repsInput = card.querySelector('.set-reps-input');

    var weightKg = toStoredKg(weightInput.value);

    var err = weightRepsError(weightKg, reps, ex.name, ex.muscle);

    commitSet(ex, weightKg, reps);

  // Fires only on a wild, out-of-nowhere jump (5x+ the previous best for
  // that exercise) — never on someone's first-ever log of an exercise
  // (nothing to compare against yet), and it never blocks the save. Pure
  // comic relief for an obvious fat-finger, not a data gate.
  var SUS_WEIGHT_JOKES = [
    'Brotha, you sure about {w}{u} on {ex}? \ud83d\udc80',
    '{w}{u}?? Bro thinks he\u2019s in the Avengers \ud83e\udea8',
    'That\u2019s not a PR, that\u2019s a typo \ud83d\ude2d',
    '{w}{u} on {ex} \u2014 Hafth\u00f3r Bj\u00f6rnsson wants a word \ud83d\udcaa',
    'Lifting weights or moving a small car? ({w}{u}) \ud83d\ude97',
    'New world record or fat-finger? \ud83d\udc40 ({w}{u})'
  ];
  function susWeightJoke(exName, weightKg, prevBestE1rm){
    if (!prevBestE1rm || prevBestE1rm <= 0) return null;
    if (weightKg < prevBestE1rm * 5) return null;
    var msg = SUS_WEIGHT_JOKES[Math.floor(Math.random() * SUS_WEIGHT_JOKES.length)];
    return msg.replace('{w}', fmtWeight(weightKg)).replace('{u}', unitLabel()).replace('{ex}', exName);
  }

  function commitSet(ex, weightKg, reps){
    var setId = uid();
    var prevBest = bestE1RM(ex.name, null);
    var thisE1rm = e1rm(effectiveLoadKg(ex.name, weightKg), reps);
    var isPR = thisE1rm > prevBest + 0.001;

    ex.sets.push({
      id: setId,
      weightKg: roundNice(weightKg),
      reps: reps,
      isPR: isPR,
      timestamp: new Date().toISOString()
    });
    delete ui.draftSets[ex.id];
    saveSessions();
    logActivity('Added set ' + fmtWeight(weightKg) + ' ' + unitLabel() + ' \u00d7 ' + reps + ' to "' + ex.name + '"' + (isPR ? ' \u2014 new PR' : ''), 'Log');
    ui.freshPRSetId = isPR ? setId : null;
    // Silently tracks/persists whether this muscle's strength badge was
    // just earned — no toast for it anymore, it shows up in the Tips/
    // Target overlay instead (see renderTipHtml) whenever that muscle's
    // exercises are viewed there.
    checkStrengthBadge(ex, weightKg);
    renderApp();
    ui.freshPRSetId = null;
    if (state.settings.hapticFeedback !== false && navigator.vibrate){
      navigator.vibrate(isPR ? [15, 30, 15] : 10);
    }
    if (isPR){
      var joke = susWeightJoke(ex.name, weightKg, prevBest);
      showToast(joke || ('New PR on ' + ex.name + '!'));
    }
    if (state.settings.restTimerAutoStart && !ui.restTimer){
      autoStartRestTimer();
    }
  }

  function saveSetEdit(exId, setId){
