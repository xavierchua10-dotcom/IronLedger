  body::after{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(var(--accent-rgb),.14), transparent 60%),
      linear-gradient(180deg, rgba(20,22,26,.55) 0%, rgba(20,22,26,.9) 55%, #14161a 100%);
  }
  .wrap{width:100%;max-width:440px;text-align:center;}
  .logo{
    width:112px;height:112px;margin:8px auto 18px;border-radius:50%;
    padding:6px;background:var(--panel);
    box-shadow:0 0 0 2px rgba(var(--accent-rgb),.85), 0 10px 40px rgba(var(--accent-rgb),.25);
    display:flex;align-items:center;justify-content:center;
  }
  .logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
  h1{
    margin:0;font-family:'Oswald',Impact,sans-serif;font-weight:700;
    font-size:34px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;
  }
  h1 span{color:var(--accent);}
  .handle{margin:8px 0 0;font-size:14px;color:var(--text-dim);letter-spacing:.02em;}
  .bio{
    margin:18px auto 30px;max-width:340px;
    font-size:15px;line-height:1.55;color:#c9c6bf;
  }
  .links{display:flex;flex-direction:column;gap:14px;}
  .link{
    display:flex;align-items:center;gap:14px;text-align:left;
    padding:16px 18px;border-radius:16px;text-decoration:none;color:var(--text);
    border:1.5px solid rgba(var(--accent-rgb),.55);
    background:rgba(28,31,36,.82);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .link:active{transform:scale(.98);}
  @media (hover:hover){ .link:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(var(--accent-rgb),.18);} }
  .link:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .link.primary{background:var(--accent);color:#14161a;border-color:var(--accent);}
  .link.primary .sub{color:rgba(20,22,26,.72);}
  .ico{
    flex:0 0 44px;width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(var(--accent-rgb),.14);color:var(--accent);
  }
  .link.primary .ico{background:rgba(20,22,26,.12);color:#14161a;}
  .ico svg{width:24px;height:24px;display:block;}
  .txt{flex:1;min-width:0;}
  .title{
    display:block;font-family:'Oswald',Impact,sans-serif;font-weight:600;
    font-size:19px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;
  }
  .sub{display:block;margin-top:3px;font-size:13px;color:var(--text-dim);}
  .chev{flex:0 0 auto;width:20px;height:20px;opacity:.7;}
  footer{margin-top:34px;font-size:12px;color:#6d727a;letter-spacing:.04em;}

  @media (prefers-reduced-motion:no-preference){
    .logo,h1,.handle,.bio,.link,footer{animation:up .5s ease both;}
    .handle{animation-delay:.05s;} .bio{animation-delay:.1s;}
    .link:nth-child(1){animation-delay:.18s;} .link:nth-child(2){animation-delay:.26s;}
    footer{animation-delay:.34s;}
    @keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  }
</style>
</head>
